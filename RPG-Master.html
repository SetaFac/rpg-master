/* ===== Base ===== */
* {
  box-sizing: border-box;
}
html {
  font-size: var(--fs);
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.4;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: var(--texture);
  background-size: var(--texture-size);
  z-index: -2;
  pointer-events: none;
}
body::after {
  content: "";
  position: fixed;
  right: -80px;
  bottom: -80px;
  width: 420px;
  height: 420px;
  z-index: -1;
  opacity: var(--compass, 0.07);
  pointer-events: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-100 -100 200 200' fill='none' stroke='%23000' stroke-width='1.4'><circle r='90'/><circle r='76'/><circle r='20'/><path d='M0-96 L12 -12 L96 0 L12 12 L0 96 L-12 12 L-96 0 L-12 -12Z' fill='%23000' fill-opacity='.5'/><path d='M0-70 L6 -6 L70 0 L6 6 L0 70 L-6 6 L-70 0 L-6 -6Z' transform='rotate(45)' fill='%23000' fill-opacity='.25'/></svg>")
    no-repeat center/contain;
}
html:not([data-theme="carta"]):not([data-theme="oceano"]) body::after {
  display: none;
}
html[data-theme="oceano"] body::after {
  filter: invert(1);
  --compass: 0.05;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
::selection {
  background: var(--accent);
  color: var(--accent-ink);
}
:focus-visible {
  outline: 2px solid var(--accent2);
  outline-offset: 1px;
}
h1,
h2,
h3 {
  font-family: var(--font-display);
  margin: 0;
}
.muted {
  color: var(--muted);
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

/* ===== Botões ===== */
.btn {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: var(--radius);
  padding: 6px 12px;
  display: inline-flex;
  gap: 6px;
  align-items: center;
  transition:
    background 0.15s,
    border-color 0.15s,
    transform 0.05s;
  white-space: nowrap;
}
.btn:hover {
  border-color: var(--accent2);
  background: var(--card2);
}
.btn:active {
  transform: translateY(1px);
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}
.btn.primary:hover {
  filter: brightness(1.08);
}
.btn.ghost {
  background: transparent;
  border-color: transparent;
}
.btn.ghost:hover {
  background: rgba(127, 127, 127, 0.15);
}
.btn.sm {
  padding: 2px 8px;
  font-size: 0.85em;
}
.btn.danger:hover {
  border-color: var(--bad);
  color: var(--bad);
}
.btn[disabled] {
  opacity: 0.45;
  pointer-events: none;
}
.ibtn {
  width: 26px;
  height: 26px;
  padding: 0;
  justify-content: center;
}

/* ===== Barra superior ===== */
#top {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--top-bg);
  color: var(--top-ink);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 18px;
  box-shadow: 0 2px 14px -6px rgba(0, 0, 0, 0.5);
}
#top .btn {
  background: transparent;
  color: var(--top-ink);
  border-color: rgba(255, 255, 255, 0.22);
}
#top .btn:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: var(--accent2);
}
#top .btn.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.brand {
  font-family: var(--font-display);
  font-size: 1.25rem;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  border: 0;
  background: none;
  color: inherit;
  padding: 0;
}
.brand i {
  font-style: normal;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--seal-bg);
  color: var(--seal-ink);
  box-shadow: inset 0 0 0 2px var(--seal-ring);
  font-size: 1rem;
}
.sp {
  flex: 1;
}
#saved {
  font-size: 0.8em;
  opacity: 0.75;
  min-width: 90px;
  text-align: right;
}

/* ===== Menus / popovers ===== */
.pop {
  position: absolute;
  z-index: 60;
  min-width: 220px;
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 6px;
}
.pop .it {
  display: flex;
  width: 100%;
  gap: 8px;
  align-items: center;
  padding: 7px 10px;
  border: 0;
  background: none;
  text-align: left;
  border-radius: calc(var(--radius) - 1px);
}
.pop .it:hover {
  background: var(--card2);
}
.pop hr {
  border: 0;
  border-top: 1px solid var(--line2);
  margin: 5px 0;
}
.pop .lbl {
  font-size: 0.78em;
  color: var(--muted);
  padding: 6px 10px 2px;
}

/* ===== HUD ===== */
#stick {
  position: sticky;
  top: 49px;
  z-index: 20;
}
#hud {
  position: relative;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 8px 18px;
  flex-wrap: wrap;
}
#hud .who {
  min-width: 180px;
}
#hud .who b {
  font-family: var(--font-display);
  font-size: 1.25rem;
  display: block;
  line-height: 1.15;
}
#hud .who span {
  color: var(--muted);
  font-size: 0.85em;
}
.hbar {
  min-width: 170px;
  flex: 1;
  max-width: 300px;
}
.hbar .row {
  display: flex;
  justify-content: space-between;
  font-size: 0.8em;
  font-variant-numeric: tabular-nums;
}
.hbar .row b {
  font-family: var(--font-display);
}
.bar {
  height: 10px;
  border-radius: 99px;
  background: var(--bar-bg);
  overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
  margin-top: 3px;
  position: relative;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--c, var(--hp));
  border-radius: 99px;
  transition: width 0.25s;
}
.bar u {
  position: absolute;
  top: 0;
  height: 100%;
  background: repeating-linear-gradient(
    45deg,
    rgba(255, 255, 255, 0.55) 0 3px,
    rgba(255, 255, 255, 0.2) 3px 6px
  );
}
.chips {
  display: flex;
  gap: 8px;
}
.chip {
  text-align: center;
  min-width: 54px;
  padding: 3px 9px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card2);
  cursor: default;
}
.chip small {
  display: block;
  color: var(--muted);
  font-size: 0.7em;
}
.chip b {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-variant-numeric: tabular-nums;
}
.chip.click {
  cursor: pointer;
}
.chip.click:hover {
  border-color: var(--accent2);
}

/* ===== Abas ===== */
#tabs {
  display: flex;
  gap: 2px;
  padding: 0 18px;
  background: var(--card2);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.tab {
  border: 0;
  background: none;
  padding: 10px 16px;
  font-family: var(--font-display);
  font-size: 1.02rem;
  color: var(--muted);
  border-bottom: 3px solid transparent;
  white-space: nowrap;
}
.tab:hover {
  color: var(--ink);
}
.tab[aria-selected="true"] {
  color: var(--ink);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.tab.add {
  color: var(--accent2);
}

/* ===== Conteúdo ===== */
#main {
  padding: 18px;
  max-width: 1500px;
  margin: 0 auto;
}
.tabgrid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  column-gap: var(--gap);
  grid-auto-rows: 4px;
  grid-auto-flow: row dense;
  align-items: start;
}
.blk {
  grid-column: span var(--span, 12);
  padding-bottom: var(--gap);
  min-width: 0;
  align-self: start;
  scroll-margin-top: 200px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  position: relative;
}
.card > h3 {
  background: var(--head-bg);
  color: var(--head-ink);
  border-bottom: 2px solid var(--head-rule);
  padding: 7px var(--pad);
  font-size: 1.02rem;
  letter-spacing: 0.03em;
  border-radius: calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
html[data-theme="escuro"] .card > h3,
html[data-theme="claro"] .card > h3 {
  font-size: 0.95rem;
  padding-bottom: 2px;
}
.card .body {
  padding: var(--pad);
}
.card.plain {
  background: transparent;
  border: 0;
  box-shadow: none;
}
.card.plain .body {
  padding: 0;
}
.hint {
  color: var(--muted);
  font-size: 0.8em;
  margin-top: 6px;
}

/* ===== Campos ===== */
:where(
  input:not([type="checkbox"]):not([type="color"]):not([type="range"]):not([type="file"]),
  select,
  textarea
) {
  background: var(--field);
  color: var(--ink);
  border: 1px solid var(--field-line);
  border-radius: calc(var(--radius) - 1px);
  padding: 4px 8px;
  min-width: 0;
}
:where(select option) {
  background: var(--card);
  color: var(--ink);
}
.fgrid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 10px var(--gap);
}
.fld {
  grid-column: span var(--s, 4);
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.fld > label,
.lab {
  font-size: 0.76em;
  color: var(--muted);
  letter-spacing: 0.02em;
  line-height: 1.2;
}
.in,
.fld input[type="text"],
.fld input[type="number"],
.fld select,
.fld textarea,
.tbl input[type="text"],
.tbl input[type="number"],
.tbl select,
.tbl textarea {
  width: 100%;
  background: var(--field);
  border: 1px solid var(--field-line);
  border-radius: calc(var(--radius) - 1px);
  padding: 5px 8px;
  min-width: 0;
  transition:
    border-color 0.12s,
    box-shadow 0.12s;
}
input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--accent2);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent2) 28%, transparent);
}
textarea {
  resize: vertical;
  line-height: 1.4;
}
input[type="number"] {
  appearance: textfield;
  -moz-appearance: textfield;
  font-variant-numeric: tabular-nums;
}
input[type="number"]::-webkit-inner-spin-button {
  opacity: 0;
}
input[type="number"]:hover::-webkit-inner-spin-button,
input[type="number"]:focus::-webkit-inner-spin-button {
  opacity: 1;
}
.fld.big input {
  font-family: var(--font-display);
  font-size: 1.35rem;
  padding: 3px 8px;
}
select {
  appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:
    calc(100% - 13px) 55%,
    calc(100% - 8px) 55%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  padding-right: 22px !important;
}
.fld .calc {
  padding: 5px 8px;
  min-height: 31px;
  border-bottom: 1px dashed var(--line);
  font-variant-numeric: tabular-nums;
}
.tile {
  text-align: center;
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px 4px 8px;
  position: relative;
}
.tile > label {
  display: block;
  font-size: 0.72em;
  color: var(--muted);
}
.tile .calc {
  border: 0;
  font-family: var(--font-display);
  font-size: 1.7rem;
  font-weight: 600;
  line-height: 1.1;
  padding: 2px 0 0;
  min-height: 0;
}
.tile .calc.txt {
  font-size: 1.05rem;
}
.calc.roll {
  cursor: pointer;
}
.calc.roll:hover {
  color: var(--accent);
  text-decoration: underline dotted;
}
.calc.err {
  color: var(--bad);
}
.ovr {
  width: 100%;
  text-align: center;
  border: 0 !important;
  background: transparent !important;
  font-family: var(--font-display);
  font-size: 1.7rem;
  font-weight: 600;
  padding: 0 !important;
  box-shadow: none !important;
}
.ovr::placeholder {
  color: var(--ink);
  opacity: 1;
}
.ovr:focus {
  background: var(--field) !important;
}

/* checkbox personalizado */
.chk {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  position: relative;
  cursor: pointer;
  flex: none;
}
.chk input {
  position: absolute;
  inset: 0;
  opacity: 0;
  margin: 0;
  cursor: pointer;
}
.chk i {
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--field-line);
  border-radius: calc(var(--radius) - 1px);
  background: var(--field);
  display: grid;
  place-items: center;
  transition: 0.12s;
}
.chk input:checked + i {
  background: var(--accent);
  border-color: var(--accent);
}
.chk input:checked + i::after {
  content: "";
  width: 5px;
  height: 9px;
  border: solid var(--accent-ink);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}
.chk input:focus-visible + i {
  outline: 2px solid var(--accent2);
  outline-offset: 1px;
}

/* ===== Atributos (selos) ===== */
.attrs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 12px;
}
.attr {
  text-align: center;
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 6px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.attr .nm {
  font-family: var(--font-display);
  font-size: 0.92rem;
  line-height: 1.1;
}
.attr .nm small {
  display: block;
  color: var(--muted);
  font-family: var(--font);
  font-size: 0.7em;
}
.seal {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: var(--seal-bg);
  color: var(--seal-ink);
  box-shadow:
    inset 0 0 0 3px var(--seal-ring),
    0 3px 6px -2px rgba(0, 0, 0, 0.4);
  border: 0;
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  display: grid;
  place-items: center;
  transition: transform 0.12s;
  font-variant-numeric: tabular-nums;
}
html[data-theme="neon"] .seal,
html[data-theme="caderno"] .seal {
  box-shadow: none;
  border: 2px solid var(--seal-ring);
}
html[data-theme="neon"] .seal {
  text-shadow: 0 0 8px currentColor;
  box-shadow:
    0 0 14px -2px var(--seal-ring),
    inset 0 0 12px -6px var(--seal-ring);
}
html[data-theme="caderno"] .seal {
  border-radius: 46% 54% 50% 50% / 52% 46% 54% 48%;
}
.seal:hover {
  transform: rotate(-6deg) scale(1.06);
}
.attr input {
  width: 64px !important;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

/* ===== Recursos ===== */
.res .head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.res .head .big {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.res .big input {
  width: 3.6ch !important;
  min-width: 0;
  border: 0 !important;
  background: transparent !important;
  font: inherit !important;
  text-align: right;
  padding: 0 !important;
  box-shadow: none !important;
}
.res .big input:focus {
  background: var(--field) !important;
}
.res .big small {
  font-size: 0.55em;
  color: var(--muted);
}
.res .tmp {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.85em;
  color: var(--muted);
}
.res .tmp input {
  width: 56px !important;
  text-align: center;
  padding: 2px 4px !important;
}
.res .bar {
  height: 14px;
  margin: 6px 0 8px;
}
.res .ctl {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.res .ctl input {
  width: 74px !important;
  text-align: center;
}
.res details {
  margin-top: 8px;
}
.res summary {
  cursor: pointer;
  font-size: 0.82em;
  color: var(--muted);
}
.res .mm {
  display: inline-flex;
  gap: 4px;
  align-items: center;
  font-size: 0.78em;
  color: var(--muted);
  margin-left: auto;
}
.res .mm input {
  width: 62px !important;
  padding: 2px 4px !important;
  text-align: center;
}

/* ===== Tabelas (listas) ===== */
.tbl {
  display: flex;
  flex-direction: column;
  font-size: 0.94em;
}
.tr {
  display: grid;
  gap: 6px;
  align-items: center;
  padding: 3px 0;
  border-bottom: 1px solid var(--line2);
  grid-template-columns: var(--cols);
}
.tr.th {
  color: var(--muted);
  font-size: 0.76em;
  border-bottom: 1px solid var(--line);
  padding-bottom: 4px;
}
.tr.grp {
  grid-template-columns: 1fr;
  font-family: var(--font-display);
  color: var(--accent);
  background: var(--card2);
  padding: 3px 6px;
  margin-top: 4px;
  font-size: 0.92em;
}
.tr.dim {
  opacity: 0.45;
}
.tr.ft {
  font-weight: 600;
  border-bottom: 0;
  padding-top: 6px;
}
.tr .c {
  min-width: 0;
}
.tr .c.ctr {
  text-align: center;
  display: flex;
  justify-content: center;
}
.tr .lblc {
  padding: 0 2px;
}
.tr .lblc.mut {
  color: var(--muted);
  font-size: 0.88em;
}
.tbl input[type="text"],
.tbl input[type="number"],
.tbl select {
  padding: 3px 6px;
}
.tbl .num {
  text-align: center;
}
.tbl .calc {
  text-align: center;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.tbl .calc.roll {
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 2px 4px;
}
.tbl .calc.roll:hover {
  border-color: var(--accent2);
}
.split2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 22px;
}
.addrow {
  margin-top: 8px;
}
.rowdel {
  opacity: 0.35;
}
.tr:hover .rowdel {
  opacity: 1;
}
.cards {
  display: grid;
  grid-template-columns: repeat(var(--cc, 3), minmax(0, 1fr));
  gap: var(--gap);
}
.cardi {
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 10px 10px;
}
.cardi .ch {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  font-family: var(--font-display);
}
.cardi .ch b {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
}
.cardi .acts {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.cardi.col .fgrid {
  display: none;
}
.cardi.col .acts {
  display: none;
}
.note p {
  margin: 0 0 0.6em;
  white-space: pre-wrap;
}

/* ===== Rolador ===== */
#dice-fab {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 40;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 0;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 1.5rem;
  box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.55);
  display: grid;
  place-items: center;
}
#dice-fab:hover {
  transform: rotate(18deg) scale(1.05);
}
#dice {
  position: fixed;
  right: 18px;
  bottom: 84px;
  z-index: 40;
  width: 330px;
  max-height: 70vh;
  display: none;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow:
    var(--shadow),
    0 18px 40px -12px rgba(0, 0, 0, 0.5);
}
#dice.open {
  display: flex;
}
#dice .dh {
  padding: 9px 12px;
  font-family: var(--font-display);
  background: var(--head-bg);
  color: var(--head-ink);
  border-bottom: 2px solid var(--head-rule);
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;
}
#dice .db {
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: hidden;
}
.dq {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}
.dq .btn {
  justify-content: center;
  padding: 5px 0;
  font-variant-numeric: tabular-nums;
}
.seg {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.seg button {
  border: 0;
  background: var(--card2);
  padding: 5px;
  border-right: 1px solid var(--line);
  font-size: 0.85em;
}
.seg button:last-child {
  border-right: 0;
}
.seg button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
}
#dlog {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 32vh;
}
.lg {
  border-left: 3px solid var(--line);
  padding: 3px 8px;
  background: var(--card2);
  font-size: 0.88em;
}
.lg b {
  font-family: var(--font-display);
  font-size: 1.15em;
  float: right;
}
.lg small {
  color: var(--muted);
  display: block;
}
.lg.crit {
  border-color: var(--accent2);
}
.lg.fail {
  border-color: var(--bad);
}

/* ===== Toast ===== */
#toasts {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
}
.toast {
  background: var(--head-bg, #222);
  background-color: var(--top-bg);
  color: var(--top-ink);
  border: 1px solid var(--accent2);
  border-radius: var(--radius);
  padding: 8px 16px;
  box-shadow: 0 10px 28px -8px rgba(0, 0, 0, 0.6);
  animation: tin 0.18s ease-out;
  pointer-events: auto;
  max-width: 80vw;
}
.toast.roll {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 18px;
}
.toast.roll .n {
  font-family: var(--font-display);
  font-size: 2.2rem;
  font-weight: 700;
  line-height: 1;
  min-width: 1.6ch;
  text-align: center;
  color: var(--accent2);
}
.toast.roll.crit .n {
  color: #ffd34d;
  text-shadow: 0 0 14px #ffb300;
}
.toast.roll.fail .n {
  color: #ff6b6b;
}
.toast small {
  display: block;
  opacity: 0.75;
}
@keyframes tin {
  from {
    transform: translateY(10px) scale(0.96);
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}

/* ===== Modal ===== */
.ovl {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(5, 10, 15, 0.55);
  display: grid;
  place-items: center;
  padding: 20px;
  backdrop-filter: blur(2px);
}
.dlg {
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.7);
  width: min(560px, 100%);
  max-height: 92vh;
  display: flex;
  flex-direction: column;
}
.dlg.wide {
  width: min(980px, 100%);
}
.dlg.xl {
  width: min(1200px, 100%);
}
.dlg > h3 {
  padding: 11px 16px;
  background: var(--head-bg);
  color: var(--head-ink);
  border-bottom: 2px solid var(--head-rule);
  border-radius: calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;
  display: flex;
}
.dlg > h3 span {
  flex: 1;
}
.dlg .db {
  padding: 16px;
  overflow: auto;
  flex: 1;
}
.dlg .df {
  padding: 10px 16px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  background: var(--card2);
  border-radius: 0 0 calc(var(--radius) - 1px) calc(var(--radius) - 1px);
}
.dlg label.f {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-bottom: 10px;
  font-size: 0.86em;
  color: var(--muted);
}
.dlg label.f input,
.dlg label.f select,
.dlg label.f textarea {
  background: var(--field);
  border: 1px solid var(--field-line);
  border-radius: calc(var(--radius) - 1px);
  padding: 6px 8px;
  width: 100%;
  color: var(--ink);
}
.dlg textarea.code {
  font-family: var(--font-mono);
  font-size: 0.85em;
  min-height: 260px;
  white-space: pre;
}
.row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.warn {
  color: var(--bad);
  font-size: 0.85em;
}
.okc {
  color: var(--good);
  font-size: 0.85em;
}

/* ===== Início ===== */
.home {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 18px 80px;
}
.hero {
  padding: 34px 6px 26px;
  display: grid;
  gap: 8px;
}
.hero h1 {
  font-size: clamp(2rem, 4.6vw, 3.3rem);
  line-height: 1.02;
  letter-spacing: -0.01em;
}
.hero p {
  max-width: 62ch;
  color: var(--muted);
  font-size: 1.05rem;
  margin: 6px 0 0;
}
.sec-t {
  font-family: var(--font-display);
  font-size: 1.15rem;
  margin: 26px 0 10px;
  padding-bottom: 5px;
  border-bottom: 2px solid var(--head-rule, var(--line));
}
html[data-theme="escuro"] .sec-t,
html[data-theme="claro"] .sec-t {
  border-bottom-color: var(--line);
}
.cgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: var(--gap);
}
.tcard {
  text-align: left;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 120px;
  transition:
    transform 0.15s,
    border-color 0.15s;
  position: relative;
}
.tcard:hover {
  transform: translateY(-2px);
  border-color: var(--accent2);
}
.tcard .ic {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--seal-bg);
  color: var(--seal-ink);
  box-shadow: inset 0 0 0 2px var(--seal-ring);
  font-size: 1.15rem;
}
.tcard b {
  font-family: var(--font-display);
  font-size: 1.1rem;
}
.tcard span {
  color: var(--muted);
  font-size: 0.88em;
}
.tcard .x {
  position: absolute;
  right: 8px;
  top: 8px;
}
.tcard .pill {
  align-self: flex-start;
  font-size: 0.72em;
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 0 8px;
  color: var(--muted);
}
.empty {
  border: 2px dashed var(--line);
  border-radius: var(--radius);
  padding: 26px;
  text-align: center;
  color: var(--muted);
}
body.drag::after {
  content: "Solte o arquivo (.json, .xlsx) para importar";
  display: grid !important;
  place-items: center;
  position: fixed;
  inset: 0;
  width: auto;
  height: auto;
  background: rgba(0, 0, 0, 0.55);
  color: #fff;
  font-size: 1.6rem;
  z-index: 200;
  opacity: 1;
  filter: none;
}

/* ===== Editor ===== */
body.editing .blk > .card,
body.editing .blk > .xcard {
  outline: 2px dashed var(--accent2);
  outline-offset: 2px;
}
.etool {
  position: absolute;
  right: 6px;
  top: -14px;
  z-index: 6;
  display: none;
  gap: 3px;
  background: var(--top-bg);
  padding: 3px;
  border-radius: var(--radius);
  box-shadow: 0 6px 14px -4px rgba(0, 0, 0, 0.5);
}
.etool .btn {
  background: transparent;
  color: var(--top-ink);
  border-color: transparent;
  width: 26px;
  height: 26px;
  padding: 0;
  justify-content: center;
}
.etool .btn:hover {
  background: rgba(255, 255, 255, 0.18);
}
body.editing .blk:hover .etool,
body.editing .blk:focus-within .etool {
  display: flex;
}
.blk.dragover > .card {
  box-shadow: 0 0 0 3px var(--accent2);
}
.ebar {
  background: var(--accent2);
  color: #111;
  padding: 6px 18px;
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 0.9em;
}
.ebar .btn {
  background: rgba(255, 255, 255, 0.7);
  border-color: transparent;
  color: #111;
}
.ed-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88em;
}
.ed-table th {
  text-align: left;
  color: var(--muted);
  font-weight: 500;
  padding: 3px 4px;
  border-bottom: 1px solid var(--line);
}
.ed-table td {
  padding: 2px 3px;
  vertical-align: middle;
}
.ed-table input,
.ed-table select {
  width: 100%;
  background: var(--field);
  border: 1px solid var(--field-line);
  border-radius: 3px;
  padding: 3px 5px;
  color: var(--ink);
}
.ed-table td.mono input {
  font-family: var(--font-mono);
}
.addmenu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.addmenu button {
  text-align: left;
  padding: 10px 12px;
  border: 1px solid var(--line);
  background: var(--card2);

<noscript>Este app precisa de JavaScript.</noscript>
<script id="selfjs">
/* ===== Motor de fórmulas (nativo e Excel) — sem eval ===== */
const Formula = (() => {
  class FErr extends Error {
    constructor(code, msg) {
      super(msg || code);
      this.code = code;
    }
  }
  const cache = new Map();
  const REFRE = /^\$?[A-Za-z]{1,3}\$?\d+$/;

  function tokenize(s, xl) {
    const t = [];
    let i = 0;
    const isIdStart = c => /[A-Za-z_À-ɏ$]/.test(c);
    const isId = c => /[\wÀ-ɏ.$]/.test(c);
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) {
        i++;
        continue;
      }
      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(s[i + 1] || ''))) {
        let j = i;
        while (j < s.length && /[0-9.]/.test(s[j])) j++;
        if (/[eE]/.test(s[j] || '') && /[0-9+-]/.test(s[j + 1] || '')) {
          j += 2;
          while (/[0-9]/.test(s[j] || '')) j++;
        }
        t.push({ t: 'num', v: parseFloat(s.slice(i, j)) });
        i = j;
        continue;
      }
      if (c === '"' || (!xl && c === "'")) {
        let j = i + 1,
          out = '';
        while (j < s.length) {
          if (s[j] === c) {
            if (s[j + 1] === c) {
              out += c;
              j += 2;
              continue;
            }
            break;
          }
          out += s[j++];
        }
        if (xl && s[j + 1] === '!') {
          /* nome de planilha entre aspas simples tratado abaixo */
        }
        t.push({ t: 'str', v: out });
        i = j + 1;
        continue;
      }
      if (xl && c === "'") {
        // 'Nome da planilha'!A1
        let j = i + 1,
          out = '';
        while (j < s.length && !(s[j] === "'" && s[j + 1] !== "'")) {
          if (s[j] === "'") j++;
          out += s[j++];
        }
        j++;
        if (s[j] === '!') {
          t.push({ t: 'sheet', v: out });
          i = j + 1;
          continue;
        }
        throw new FErr('#NAME?');
      }
      if (isIdStart(c)) {
        let j = i;
        while (j < s.length && isId(s[j])) j++;
        let w = s.slice(i, j);
        if (xl && s[j] === '!') {
          t.push({ t: 'sheet', v: w });
          i = j + 1;
          continue;
        }
        t.push({ t: 'id', v: w });
        i = j;
        continue;
      }
      const two = s.substr(i, 2);
      if (['<=', '>=', '<>', '!=', '==', '&&', '||'].includes(two)) {
        t.push({ t: 'op', v: two });
        i += 2;
        continue;
      }
      if ('+-*/^&=<>(),:%!'.includes(c)) {
        t.push({ t: 'op', v: c });
        i++;
        continue;
      }
      if (c === ';') {
        t.push({ t: 'op', v: ',' });
        i++;
        continue;
      }
      throw new FErr('#NAME?', 'Caractere inesperado: ' + c);
    }
    return t;
  }

  const PREC = {
    '||': 1,
    '&&': 2,
    '=': 3,
    '==': 3,
    '<>': 3,
    '!=': 3,
    '<': 3,
    '>': 3,
    '<=': 3,
    '>=': 3,
    '&': 4,
    '+': 5,
    '-': 5,
    '*': 6,
    '/': 6,
    '^': 7,
  };

  function parse(src, xl) {
    const key = (xl ? 'x:' : 'n:') + src;
    if (cache.has(key)) return cache.get(key);
    const tk = tokenize(src, xl);
    let p = 0;
    const peek = () => tk[p],
      next = () => tk[p++];
    const isOp = v => peek() && peek().t === 'op' && peek().v === v;
    function primary() {
      const k = next();
      if (!k) throw new FErr('#ERR', 'Fórmula incompleta');
      if (k.t === 'num') return { n: 'num', v: k.v };
      if (k.t === 'str') return { n: 'str', v: k.v };
      if (k.t === 'op') {
        if (k.v === '(') {
          const e = expr(0);
          if (!isOp(')')) throw new FErr('#ERR', 'Falta )');
          next();
          return e;
        }
        if (k.v === '-' || k.v === '+' || k.v === '!') return { n: 'un', op: k.v, x: expr(7.5) };
        throw new FErr('#ERR', 'Símbolo inesperado ' + k.v);
      }
      let sheet = null,
        id;
      if (k.t === 'sheet') {
        sheet = k.v;
        id = next();
        if (!id || id.t !== 'id') throw new FErr('#REF!');
      } else id = k;
      if (id.t !== 'id') throw new FErr('#ERR');
      const name = id.v;
      if (isOp('(') && !sheet) {
        next();
        const args = [];
        if (!isOp(')')) {
          for (;;) {
            args.push(isOp(',') ? { n: 'blank' } : expr(0));
            if (isOp(',')) {
              next();
              continue;
            }
            break;
          }
        }
        if (!isOp(')')) throw new FErr('#ERR', 'Falta )');
        next();
        return { n: 'call', name: name.toLowerCase(), args };
      }
      if (xl && REFRE.test(name)) {
        const a = name.replace(/\$/g, '').toUpperCase();
        if (isOp(':')) {
          next();
          let k2 = next();
          let sh2 = sheet;
          if (k2 && k2.t === 'sheet') {
            sh2 = k2.v;
            k2 = next();
          }
          if (!k2 || k2.t !== 'id' || !REFRE.test(k2.v)) throw new FErr('#REF!');
          return { n: 'range', sheet, a, b: k2.v.replace(/\$/g, '').toUpperCase() };
        }
        return { n: 'ref', sheet, a };
      }
      return { n: 'id', name };
    }
    function expr(minp) {
      let l = primary();
      for (;;) {
        const k = peek();
        if (xl && k && k.t === 'op' && k.v === '%') {
          next();
          l = { n: 'bin', op: '/', l, r: { n: 'num', v: 100 } };
          continue;
        }
        if (!k || k.t !== 'op' || !(k.v in PREC)) break;
        const pr = PREC[k.v];
        if (pr < minp) break;
        next();
        const r = expr(k.v === '^' ? pr : pr + 0.01);
        l = { n: 'bin', op: k.v, l, r };
      }
      return l;
    }
    const ast = expr(0);
    if (p < tk.length) throw new FErr('#ERR', 'Sobrou: ' + tk[p].v);
    cache.set(key, ast);
    return ast;
  }

  // ---- conversões
  const isArr = Array.isArray;
  function num(v, lenient) {
    if (isArr(v)) v = v[0];
    if (v === null || v === undefined || v === '') return 0;
    if (typeof v === 'boolean') return v ? 1 : 0;
    if (typeof v === 'number') return v;
    const n = parseFloat(String(v).replace(',', '.'));
    if (isNaN(n)) {
      if (lenient) return 0;
      throw new FErr('#VALUE!');
    }
    return n;
  }

function h(sel, attrs, ...kids) {
  if (attrs && (typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs))) {
    kids.unshift(attrs);
    attrs = null;
  }
  const m = /^([a-z0-9]*)((?:[.#][\w-]+)*)$/i.exec(sel) || [, sel, ''];
  const el = document.createElement(m[1] || 'div');
  (m[2].match(/[.#][\w-]+/g) || []).forEach(x =>
    x[0] === '.' ? el.classList.add(x.slice(1)) : (el.id = x.slice(1))
  );
  if (attrs)
    for (const k in attrs) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') {
        for (const sk in v) {
          if (sk.startsWith('--')) el.style.setProperty(sk, v[sk]);
          else el.style[sk] = v[sk];
        }
      } else if (k === 'class')
        v.split(' ')
          .filter(Boolean)
          .forEach(c => el.classList.add(c));
      else if (
        k === 'value' ||
        k === 'checked' ||
        k === 'disabled' ||
        k === 'selected' ||
        k === 'indeterminate'
      )
        el[k] = v;
      else if (k === 'html') el.innerHTML = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  const add = k => {
    if (k === null || k === undefined || k === false) return;
    if (Array.isArray(k)) k.forEach(add);
    else el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  };
  kids.forEach(add);
  return el;
}

const hash = s => {
  let x = 5381;
  for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0;
  return (x >>> 0).toString(36);

const rnd = n => {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return Math.floor((a[0] / 4294967296) * n) + 1;
};
const DICE_FIND = /\d*d\d+/i;
function parseDice(src) {
  src = String(src ?? '');
  const m = DICE_FIND.exec(src);
  if (!m) return null;
  // retrocede para pegar sinal anterior e avança para pegar termos seguintes
  let start = m.index;
  const rest = src.slice(start);
  const chain = /^(?:\d*d\d+(?:k[hl]\d+)?)(?:\s*[+-]\s*(?:\d*d\d+(?:k[hl]\d+)?|\d+(?:[.,]\d+)?))*/i.exec(
    rest
  );
  if (!chain) return null;
  const expr = chain[0];
  const terms = [];
  const re = /([+-]?)\s*(?:(\d*)d(\d+)(?:k([hl])(\d+))?|(\d+(?:[.,]\d+)?))/gi;
  let x;
  while ((x = re.exec(expr))) {
    const sign = x[1] === '-' ? -1 : 1;
    if (x[3])
      terms.push({
        sign,
        n: Math.min(parseInt(x[2] || '1'), 100),
        f: Math.min(parseInt(x[3]), 1000),
        k: x[4],
        kn: x[5] ? parseInt(x[5]) : 0,
      });
    else terms.push({ sign, c: parseFloat(x[6].replace(',', '.')) });
  }
  return { expr: expr.replace(/\s+/g, ''), terms };
}
function rollParsed(p, { adv = 0 } = {}) {
  let total = 0;
  const parts = [];
  let nat = null,
    d20 = false;
  p.terms.forEach((tm, i) => {
    if (tm.c !== undefined) {
      total += tm.sign * tm.c;
      parts.push({ sign: tm.sign, c: tm.c });
      return;
    }
    let rolls = Array.from({ length: tm.n }, () => rnd(tm.f));
    let kept = rolls.slice();
    let alt = null;
    if (tm.f === 20 && tm.n === 1 && adv && i === 0) {
      alt = rnd(20);
      kept = [adv > 0 ? Math.max(rolls[0], alt) : Math.min(rolls[0], alt)];
      rolls = [rolls[0], alt];
    } else if (tm.k) {
      const s = rolls.slice().sort((a, b) => a - b);
      kept = tm.k === 'h' ? s.slice(-tm.kn) : s.slice(0, tm.kn);
    }
    const sum = kept.reduce((a, b) => a + b, 0);
    total += tm.sign * sum;
    if (tm.f === 20 && tm.n === 1 && i === 0) {
      nat = kept[0];
      d20 = true;
    }
    parts.push({ sign: tm.sign, n: tm.n, f: tm.f, rolls, kept, alt: alt !== null });
  });
  return { total, parts, nat, d20 };
}
function partsText(parts) {
  return parts
    .map((p, i) => {
      const sg = p.sign < 0 ? '−' : i ? '+' : '';
      if (p.c !== undefined) return sg + ' ' + p.c;
      return (
        sg +
        ' ' +
        p.n +
        'd' +
        p.f +
        '[' +
        (p.alt ? p.rolls.join('/') + '→' + p.kept[0] : p.rolls.join(',')) +
        ']'
      );
    })
    .join(' ')
    .trim();
}

  {"e":"Atirador","t":"Auxiliar","g":5,"n":"Domínio Aperfeiçoado","c":10,"du":"Até 2 minutos","al":"Pessoal","rq":"Ação Bônus","da":"","ac":"","d":"Independentemente da escolha feita, você recebe os benefícios de ambos os caminhos das características “Caminho do Atirador” e “Atirador de Elite” enquanto esta técnica durar. No caso das habilidades “Mira de Duelista” e “Mira de Sniper”, tanto a jogada de ataque quanto a de dano recebem o acréscimo do bônus de proficiência apenas uma vez, de forma integral."},
  {"e":"Atirador","t":"Combate","g":1,"n":"Tiro De Advertência","c":2,"du":"Instantâneo","al":"Arma, Linha","rq":"Arma Favorita, 1 Munição (Qualquer), Ação Poderosa","da":"2d10 de dano Psíquico","ac":"Possível","d":"Ao realizar um disparo incrivelmente rápido e que quase raspa no inimigo, você consegue assustá-lo e causar um impacto psicológico com uma jogada de ataque à distância. A criatura alvo desta técnica deve fazer uma Salvaguarda de Vontade. Se falhar, ela deve escolher entre se mover ou realizar uma ação e não poderá usar reação ou ação bônus até o início do próximo turno dela."},
  {"e":"Atirador","t":"Combate","g":2,"n":"Tiro Certeiro","c":4,"du":"Instantâneo","al":"Arma, Linha","rq":"Mosquete, 1 Munição (Qualquer), Ação Poderosa","da":"3d10 de dano Contundente ou Perfurante","ac":"Possível","d":"Com uma jogada de ataque à distância, você é capaz de realizar um disparo perfeito em uma criatura que possa ver e que esteja dentro do alcance da técnica. Esse disparo acerta automaticamente."},
  {"e":"Atirador","t":"Combate","g":3,"n":"Mira Cruel","c":6,"du":"Instantâneo","al":"Arma, Linha","rq":"Mosquete, 1 Munição (Perfurante), Ação Poderosa","da":"5d10 de dano Perfurante","ac":"Impossível","d":"Ao realizar uma jogada de ataque à distância mirando nas articulações de uma criatura, você tenta incapacitar seu alvo. A criatura atingida tem seu movimento reduzido pela metade e deve ser bem-sucedida em uma Salvaguarda de Constituição ou receberá a condição “Impedido” até o final do próximo turno."},
  {"e":"Atirador","t":"Combate","g":4,"n":"Overwatch","c":9,"du":"Até 1 minuto, Concentração","al":"Arma, Linha","rq":"Mosquete, 1 Munição qualquer para cada ataque, Ação Poderosa","da":"Nenhum","ac":"Impossível","d":"Você pode marcar uma esfera de até 3 metros de raio em um ponto de origem escolhido dentro do alcance da técnica. Sempre que uma criatura realizar uma ação durante a duração da técnica, antes que ela a complete, você pode fazer uma jogada de ataque contra ela. Você pode usar uma ação bônus para mover o centro da esfera por até 6 metros. Cada criatura atingida deve ser bem-sucedida em uma Salvaguarda de Constituição ou encerrará seu turno prematuramente, logo após sofrer o dano. Se você realizar qualquer atividade diferente de uma jogada de ataque, a técnica é encerrada automaticamente."},
  {"e":"Atirador","t":"Combate","g":5,"n":"Shooting Stars","c":12,"du":"Instantâneo","al":"Até 18 metros, Cone","rq":"Mosquete, 20 Munições (Qualquer), Ação Poderosa","da":"12d6 de dano Contundente ou Perfurante","ac":"Possível","d":"Você realiza uma série de disparos contra todos os seus inimigos. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso."},
  {"e":"Atirador","t":"Combate","g":6,"n":"Zona Do Atirador","c":16,"du":"Até 1 minuto","al":"Arma, Linha","rq":"Mosquete, 10 Munições (Perfurante), Ação Poderosa","da":"9d10 de dano Perfurante","ac":"Impossível","d":"Você dispara rapidamente uma jogada de ataque à distância certeira contra uma criatura. Ao acertar com esta técnica, você recebe vantagem em jogadas de ataque e ganha 60 Pontos de Vida temporários, enquanto a técnica durar."},
  {"e":"Atirador","t":"Combate","g":7,"n":"Headshot","c":20,"du":"Instantâneo","al":"Arma, Linha","rq":"Mosquete, 1 Munição (Perfurante), Ação Poderosa","da":"18d10 de dano Perfurante","ac":"Possível","d":"Ao usar esta técnica contra uma criatura que tenha pelo menos uma cabeça e obtiver um acerto crítico natural, você atravessa a cabeça da criatura, que morre se não puder sobreviver sem ela. Caso a criatura não tenha ou não precise de uma cabeça, tenha Ações Lendárias ou o Narrador decida que não pode ser afetada por essa característica, em vez de morrer, ela sofre 6d10 de dano Perfurante extra, após a determinação do dano do acerto crítico. Essa técnica não surte efeito caso a criatura escolhida não possa sofrer danos, como, por exemplo, se ela tiver Invulnerabilidade a dano Perfurante."},
  {"e":"Atirador","t":"Auxiliar","g":1,"n":"Saída Forçada","c":2,"du":"Instantâneo","al":"Até 1,5 metro, Esfera","rq":"Mosquete (ou algo semelhante), Reação","da":"","ac":"","d":"No momento em que se vê cercado por inimigos, você pode girar o seu mosquete, acertando todas as criaturas ao seu redor. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza para não receber a condição “Caído” e perder a sua reação durante essa rodada."},
  {"e":"Atirador","t":"Auxiliar","g":3,"n":"Manobra Evasiva","c":9,"du":"Até o início do seu próximo turno","al":"Pessoal","rq":"Reação","da":"","ac":"","d":"Quando for alvo de uma jogada de ataque, você pode rapidamente se afastar, percorrendo até 9 metros. Esse deslocamento não provoca reações de nenhum tipo, mesmo aquelas que normalmente ignorariam esse tipo de característica, como “Ataque de Oportunidade Superior”. Além disso, você recebe um bônus de +3 na sua CR até o início do seu próximo turno."},
  {"e":"Atirador","t":"Auxiliar","g":5,"n":"Domínio Aperfeiçoado","c":10,"du":"Até 5 minutos","al":"Pessoal","rq":"Ação Bônus","da":"","ac":"","d":"Independentemente da escolha feita, você recebe os benefícios de ambos os caminhos das características “Caminho do Atirador” e “Atirador de Elite” enquanto esta técnica durar. No caso das habilidades “Mira de Duelista” e “Mira de Sniper”, tanto a jogada de ataque quanto a de dano recebem o acréscimo do bônus de proficiência apenas uma vez, de forma integral."},
  {"e":"Brutamontes","t":"Combate","g":1,"n":"Nari Kabura","c":2,"du":"Instantâneo","al":"9 metros, Linha","rq":"Arma Favorita, Ação Poderosa","da":"2d10 de dano Contundente","ac":"Possível","d":"Você executa um golpe poderoso e preciso que transforma o próprio ar, rochas ou destroços em um projétil, lançado contra uma criatura em uma jogada de ataque à distância com margem de acerto crítico 19-20. <Kongo Kabura> No 6º nível, você pode usar essa técnica como uma técnica de 3º Grau, seu dano aumenta para 5d10 de dano Contundente, o alcance se torna 21 metros em Linha e custa 6 PP. A margem de acerto crítico muda para 18-20."},
  {"e":"Brutamontes","t":"Combate","g":2,"n":"Kosanze Ragnaraku","c":4,"du":"Instantâneo","al":"Toque","rq":"Arma Favorita, Ação Poderosa","da":"4d10 de dano Contundente ou Perfurante","ac":"Impossível","d":"Você pula na direção de uma criatura e desce um golpe em uma criatura com grande brutalidade. A criatura atingida deve ser bem\u0002sucedida em uma Salvaguarda de Força ou receberá a condição “Caído”. Alternativamente: Você pode mirar o golpe no chão e desencadear uma onda de choque que atinge seus inimigos. Toda a criatura dentro da área de um cone de 15 metros deve fazer uma Salvaguarda de Destreza. Sofrendo 4d6 de dano Trovejante se falhar ou metade desse dano se obtiver sucesso. A criatura atingida deve ser bem-sucedida em uma Salvaguarda de Destreza ou receberá a condição “Caído”."},
  {"e":"Brutamontes","t":"Combate","g":3,"n":"Mahoroba","c":6,"du":"Instantâneo","al":"Toque","rq":"Arma Favorita, Ação Poderosa","da":"5d10 de dano Contundente ou Perfurante","ac":"Possível","d":"Você realiza um golpe com grande força contra uma criatura em uma jogada de ataque corpo a corpo. O impacto empurra a criatura, com categoria de tamanho Grande ou menor, para um espaço desocupado a até 6 metros de distância dela, caso ela não passe em uma Salvaguarda de Força. Durante o empurrão, se a criatura bater em um objeto ou estrutura com mais de 1,5 metro de raio, ela receberá 2d8 de dano extra."},
  {"e":"Brutamontes","t":"Combate","g":4,"n":"Raimei Hakke","c":9,"du":"Instantâneo","al":"Toque","rq":"Arma Favorita, Ação Poderosa","da":"9d10 de dano Contundente ou Perfurante","ac":"Possível","d":"Você usa um golpe extremamente feroz que atinge uma criatura com uma jogada de ataque corpo a corpo com grande violência. Caso a jogada de ataque desta técnica seja um acerto crítico, quando estiver determinando o dano extra da técnica, adicione mais 4 dados de dano."},
  {"e":"Brutamontes","t":"Combate","g":5,"n":"Gundari Ryuseigun","c":12,"du":"Instantâneo","al":"Toque","rq":"Arma Favorita, Ação Poderosa","da":"12d10 de dano Contundente ou Perfurante","ac":"Possível","d":"Você realiza uma série de ataques rápidos, com uma jogada de ataque corpo a corpo, contra uma criatura. Ao ser acertado, o alvo desta técnica deve ser bem-sucedido em uma Salvaguarda de Constituição ou não poderá realizar reações até o final do próximo turno dele. Além disso, no próximo turno dele, ele deve escolher entre se mover, realizar uma ação ou realizar uma ação bônus; ele pode fazer apenas uma das três coisas."},
  {"e":"Brutamontes","t":"Combate","g":6,"n":"Horai Hakke","c":16,"du":"Instantâneo","al":"Toque","rq":"Arma Favorita, Ação Poderosa","da":"13d10 de dano Contundente ou Perfurante","ac":"Impossível","d":"Você usa um golpe extremamente feroz, para atingir uma criatura com uma jogada de ataque corpo a corpo, causando um impacto tão poderoso que pode desligar momentaneamente a consciência do alvo. A criatura atingida deve ser bem-sucedida em uma Salvaguarda de Constituição ou receberá a condição “Atordoado”, até o final do próximo turno dela."},
  {"e":"Brutamontes","t":"Combate","g":7,"n":"Hakai","c":20,"du":"Instantâneo","al":"30 metros, Cone","rq":"Arma Favorita, Ação Poderosa","da":"20d6 de dano Contundente","ac":"Possível","d":"Com o balançar do seu ataque, você lança uma onda de destruição em massa contra todos os seus inimigos. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. A área afetada por essa técnica se torna um terreno difícil e o dano em estruturas é dobrado."},
  {"e":"Brutamontes","t":"Auxiliar","g":1,"n":"Shinsoku Hakujaku","c":2,"du":"Instantâneo","al":"Pessoal","rq":"Ação Bônus","da":"","ac":"","d":"Você se move rapidamente, com passos firmes, aumentando seu deslocamento normal em 6 metros. Além disso, o seu deslocamento não poderá ser reduzido, até o final do seu turno."},
  {"e":"Brutamontes","t":"Auxiliar","g":3,"n":"Yamantaka","c":4,"du":"Instantâneo","al":"Pessoal","rq":"Reação","da":"","ac":"","d":"Ao receber uma jogada de ataque ou tiver que fazer uma Salvaguarda de Força ou Destreza, você pode usar sua fúria para proteger o seu corpo e reduzir 10d8 do dano. Você pode gastar 1 Ponto de Poder para adicionar 2d8 à redução de dano, até um total de 20d8."},
  {"e":"Brutamontes","t":"Auxiliar","g":5,"n":"Oni No Youna","c":10,"du":"Até 1 minuto","al":"Pessoal","rq":"Ação Bônus","da":"","ac":"","d":"Você se coloca em um transe de fúria que só pode ser saciado com violência, recebendo as seguintes características: Você recebe os bônus da tabela “Movimentos Caóticos” da característica “Saikoro Hakke”, ao mesmo tempo (com exceção do “Modo Depressivo”, “Modo Ladrão” e “Modo Lúcido”); Você se torna incapaz de usar técnicas; Você ataca indiscriminadamente aliados e inimigos, priorizando as criaturas mais próximas (à escolha do Narrador); Esta técnica é encerrada se você não realizar uma jogada de ataque ou for atacado até o final do seu turno."},
  {"e":"Carateca Homem-Peixe","t":"Combate","g":1,"n":"Uchimizu","c":2,"du":"Instantâneo","al":"Até 9 metros, Linha","rq":"Ação Poderosa","da":"2d10 de dano Perfurante","ac":"Possível","d":"Juntando a água presente na atmosfera, você dispara uma lança de água como um projétil de alta velocidade em uma jogada de ataque à distância. Se a lança atingir a criatura, ela deve ser bem-sucedida em uma Salvaguarda de Constituição ou receberá a condição “Sangramento”. <Gyojin Jujutsu – Yabusame> No 6º nível, você pode usar esta técnica como uma de 3º Grau, seu dano aumenta para 6d6 de dano Perfurante, o alcance se torna um Cone de 18 metros e custa 5 PP. Concentrando água em todo o braço, você lança dezenas de gotas d'água como projéteis em alta velocidade. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso."},
  {"e":"Carateca Homem-Peixe","t":"Combate","g":2,"n":"Mawashigeri","c":4,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"3d10 de dano Contundente","ac":"Possível","d":"Uma jogada de ataque corpo a corpo com um chute giratório, feito com toda a força do corpo, contra uma criatura. O impacto empurra a criatura, com categoria de tamanho Grande ou menor, para um espaço desocupado a até 6 metros de distância dela, caso ela não passe em uma Salvaguarda de Força. Durante o empurrão, se a criatura bater em um objeto ou estrutura com mais de 1,5 metro de raio, ela receberá 2d8 de dano extra."},
  {"e":"Carateca Homem-Peixe","t":"Combate","g":3,"n":"Samegawara Seiken","c":6,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"6d8 de dano Verdadeiro","ac":"Possível","d":"Você realiza uma jogada de ataque corpo a corpo com um soco que libera uma onda de choque através do oponente. Se o ataque for bem-sucedido, você pode atingir um inimigo adicional que esteja na mesma linha de direção do golpe, a até 9 metros de distância. Esse inimigo deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso."},
  {"e":"Carateca Homem-Peixe","t":"Combate","g":4,"n":"Soshark","c":9,"du":"Até 1 minuto","al":"Toque","rq":"Ação Poderosa","da":"4d6 de dano Contundente","ac":"Impossível","d":"Você executa uma jogada de ataque corpo a corpo contra uma criatura de categoria Grande ou menor. Se o ataque for bem-sucedido, a criatura deve fazer uma Salvaguarda de Força. Se falhar, recebe a condição “Agarrado”. Enquanto a criatura estiver agarrada, ao final de cada um dos seus turnos, ela sofre dano e você terá vantagem em suas jogadas de ataque e técnicas contra ela. O alvo agarrado pode usar sua ação para repetir a Salvaguarda no final de cada um dos turnos dele, encerrando a condição se obtiver sucesso."},
  {"e":"Carateca Homem-Peixe","t":"Combate","g":5,"n":"Yarinami","c":12,"du":"Instantâneo","al":"Até 33 metros, Linha","rq":"3.000 litros de água, Ação Poderosa","da":"12d10 de dano Cortante","ac":"Possível","d":"Você manipula a água próxima e cria uma corrente poderosa ao seu redor, liberando-a com grande velocidade e pressão em uma jogada de ataque à distância. Esta onda se transforma em uma lâmina afiada que corta tudo em sua trajetória. O dano causado por essa técnica é dobrado contra estruturas e possui uma margem de acerto crítico de 18-20. Está técnica só pode ser usada estando a 1,5 metro de grandes fontes de água."},
  {"e":"Carateca Homem-Peixe","t":"Combate","g":6,"n":"Gyojin Karate Ogi – Buraikan","c":16,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"13d10 de dano Contundente","ac":"Impossível","d":"Concentrando a água da atmosfera em seu punho, você realiza um ataque corpo a corpo brutal que faz com que a água atravesse o corpo do oponente, estremecendo-o internamente. A criatura atingida deve ser bem-sucedida em uma Salvaguarda de Constituição ou receberá a condição “Letárgico”, por até 1 minuto. O alvo letárgico pode repetir a Salvaguarda ao fim de cada um de seus turnos, terminando a condição em si mesmo com um sucesso."},
  {"e":"Carateca Homem-Peixe","t":"Combate","g":7,"n":"Gyojin Karate Ogi – Onigawara Seiken","c":20,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"20d10 de dano Verdadeiro","ac":"Possível","d":"Uma técnica secreta do caratê homem-peixe que traz à tona uma única jogada de ataque corpo a corpo, carregada de puro poder bruto e intenção assassina. Essa jogada de ataque possui uma margem de acerto crítico de 18-20. Alternativamente: Você pode escolher causar 10d10 de dano com esta técnica. Caso a criatura possua ou esteja com menos de 100 Pontos de Vida, ela automaticamente tem seus PV reduzidos a 0."},
  {"e":"Carateca Homem-Peixe","t":"Auxiliar","g":1,"n":"Shizurase","c":2,"du":"Instantâneo","al":"Até 21 metros, Linha","rq":"Reação","da":"","ac":"","d":"Ao ver um inimigo prestes a realizar uma jogada de ataque (comum ou de Técnica), você rapidamente concentra e dispara um pequeno jato d’água contra uma criatura dentro do alcance da técnica, impondo desvantagem na jogada de ataque do oponente. Caso o ataque ainda acerte, o dano causado é reduzido em 2 dados (Técnicas) ou 10 pontos de dano (ataque comum)."},
  {"e":"Carateca Homem-Peixe","t":"Auxiliar","g":3,"n":"Gyojin Karate – Giganteum","c":9,"du":"Até 1 minuto, Concentração","al":"Pessoal","rq":"Ação Bônus","da":"","ac":"","d":"Por um curto período, você amplifica sua capacidade de vibrar as moléculas de água que emanam pelo seu corpo. Enquanto esta técnica durar, você recebe as seguintes características: Suas jogadas de ataque corpo a corpo desarmado causam o dobro de dano em estruturas; Criaturas recebem desvantagem em Salvaguardas contra as técnicas deste Estilo de Combate; Todo o dano causado a você recebe uma redução de 5 pontos."},
  {"e":"Carateca Homem-Peixe","t":"Auxiliar","g":5,"n":"Dai Uzu","c":5,"du":"Até 10 minutos, Concentração","al":"Até 30 metros de raio e 30 metros de altura, Cilindro","rq":"Estar em alto mar ou uma grande área fluvial, Ação Bônus","da":"","ac":"","d":"Você começa a nadar em alta velocidade em círculos, aumentando gradativamente sua própria velocidade a cada volta e criando um redemoinho na superfície da água que cobre uma área de até 30 metros de raio. Durante a técnica, você ficará “Incapacitado” e não poderá se mover livremente até que ela termine ou seja desfeita (nenhuma ação necessária). Navios na área do redemoinho devem fazer um Teste de Desastre Natural CD 16 para não ficarem presos até o término da técnica. Criaturas na área devem fazer uma Salvaguarda de Força, repetindo o teste no início de cada turno para evitar ficarem presas novamente caso sejam bem-sucedidas no teste inicial. Enquanto a técnica durar, você fica vulnerável a ataques direcionados à área do redemoinho. No entanto, sua Classe de Resistência aumenta em +6, e você recebe vantagem em todas as Salvaguardas."},
  {"e":"Ciborgue","t":"Combate","g":1,"n":"Buster Gun","c":2,"du":"Instantâneo","al":"Até 15 metros, Linha","rq":"Ação Poderosa","da":"2d10 de dano de Energia","ac":"Possível","d":"Ao apontar uma parte específica do corpo para essa função, você dispara um feixe de laser em um ataque à distância contra um alvo. <X Buster Gun> No 6º nível, você pode usar esta técnica como uma de 3º Grau, seu dano aumenta para 6d10 de dano de Energia, o alcance muda para 21 metros em Linha e custa 5 PP."},
  {"e":"Ciborgue","t":"Combate","g":2,"n":"Metralhadora Portátil","c":4,"du":"Instantâneo","al":"Até 18 metros, Cone","rq":"8 Munições (Qualquer), Ação Poderosa","da":"4d6 de dano Contundente ou Perfurante","ac":"Possível","d":"Apontando uma parte escolhida do corpo para possuir essa função, você libera uma grande sequência de tiros contra seus inimigos. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. Alternativamente: Você pode focar os tiros em uma única criatura, fazendo uma jogada de ataque à distância (21 metros em linha) que causa 4d10 de dano Contundente ou Perfurante."},
  {"e":"Ciborgue","t":"Combate","g":3,"n":"Lança-Chamas","c":6,"du":"Instantâneo","al":"Até 18 metros, Cone","rq":"Ação Poderosa","da":"6d6 de dano de Fogo","ac":"Impossível","d":"Apontando uma parte escolhida do corpo para possuir essa função, você libera uma rajada de fogo contra seus inimigos. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. A criatura que não passar na primeira Salvaguarda de Destreza deve ser bem-sucedida em uma nova Salvaguarda de Constituição ou receberá a condição “Queimado”."},
  {"e":"Ciborgue","t":"Combate","g":4,"n":"Soco Foguete","c":9,"du":"Instantâneo","al":"Até 33 metros, Linha","rq":"Ação Poderosa","da":"9d10 de dano Contundente","ac":"Impossível","d":"Com um mecanismo instalado no seu braço, você realiza uma jogada de ataque à distância que projeta seu punho em alta velocidade na direção de uma criatura. O punho, conectado ao braço por uma corrente metálica com alcance máximo de 33 metros, pode prender o alvo, impondo a condição “Agarrado” caso a jogada de ataque seja bem-sucedida. Como ação bônus, você pode forçar uma criatura agarrada a realizar uma Salvaguarda de Força; caso ela falhe, será puxada para até 1,5 metro de você."},
  {"e":"Ciborgue","t":"Combate","g":5,"n":"Rocket Launcher","c":12,"du":"Instantâneo","al":"Até 33 metros, Linha","rq":"Ação Poderosa","da":"1d10 de dano Contundente + 2d10 de dano de Fogo (cada míssil)","ac":"Possível","d":"Apontando uma parte escolhida do corpo para essa função, você dispara 3 mísseis, que podem ser direcionados a alvos diferentes que estejam ao alcance da técnica e que você possa ver. Esses mísseis acertam automaticamente seus alvos (modificadores possíveis para a técnica são aplicados apenas em um dos ataques)."},
  {"e":"Ciborgue","t":"Combate","g":6,"n":"Laser Beam","c":13,"du":"Instantâneo","al":"Até 39 metros de comprimento e 1,5 metro de largura, Linha","rq":"Ação Poderosa","da":"10d8 de dano de Energia","ac":"Possível","d":"Apontando uma parte escolhida do corpo para essa função, você concentra uma grande quantidade de energia e libera um poderoso laser. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. O laser termina e explode em um ponto à sua escolha dentro da área. Todos que estiverem a até 18 metros do ponto da explosão devem fazer uma Salvaguarda de Destreza. Sofrendo 6d6 de dano de Fogo se falhar ou metade desse dano se obtiver sucesso."},
  {"e":"Ciborgue","t":"Combate","g":7,"n":"Ultra Cannon","c":20,"du":"Instantâneo","al":"Até 30 metros, Cone","rq":"Ação Poderosa","da":"17d6 de dano Trovejante","ac":"Impossível","d":"Apontando uma parte escolhida do corpo para possuir essa função, você libera uma explosão trovejante nos seus inimigos. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Constituição. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. A criatura que não passar no primeiro Teste deve ser bem-sucedida em uma nova Salvaguarda de Constituição ou receberá a condição “Atordoado”, até o final do próximo turno da criatura."},
  {"e":"Ciborgue","t":"Auxiliar","g":1,"n":"Escudo Metálico","c":2,"du":"Até o início do seu próximo turno","al":"Pessoal","rq":"Reação","da":"","ac":"","d":"Ao ser alvo de uma jogada de ataque, você pode usar sua reação para que a parte escolhida do seu corpo com esta modificação se torne um escudo de metal e aumente sua CR em +2, até o início do seu próximo turno."},
  {"e":"Ciborgue","t":"Auxiliar","g":3,"n":"Canhão De Vento","c":4,"du":"Instantâneo","al":"Toque","rq":"Ação Bônus","da":"","ac":"","d":"Apontando uma parte escolhida do corpo para possuir essa função, libera uma rajada de vento comprimido. Escolha uma criatura, que você possa tocar e realize uma jogada de ataque corpo a corpo contra ela. O impacto empurra a criatura, com categoria de tamanho Grande ou menor, para um espaço desocupado a até 12 metros de distância dela, caso ela não passe em uma Salvaguarda de Força. Durante o empurrão, se a criatura bater em um objeto ou estrutura com mais de 1,5 metro de raio, ela receberá 4d8 de dano extra. Caso a criatura não esteja em alcance corpo a corpo e a até 6 metros de distância, você pode realizar uma jogada de ataque à distância, se acertar, ela será empurrada para um espaço desocupado a até 12 metros de você, caso falhe em uma Salvaguarda de Força, sem sofrer qualquer dano. Alternativamente: Você pode gastar 2 Pontos de Poder e escolher se lançar usando esta técnica. Ao se lançar, você percorre 12 metros em linha reta para a direção desejada."},
  {"e":"Ciborgue","t":"Auxiliar","g":5,"n":"Hard Armor","c":10,"du":"Até 1 minuto","al":"Pessoal","rq":"Ação Bônus","da":"","ac":"","d":"Você fica completamente envolvido por uma armadura, durante o tempo da duração da técnica e aprimora todas os seus melhoramentos, recebendo as seguintes características: Sua Classe de Resistência muda para 25; A técnica “Laser Beam” passa a custar 10 Pontos de Poder; A forma alternativa da técnica “Canhão de Vento” passa a não custar PP; Suas jogadas de ataque corpo a corpo desarmado aumentam para 1d12."},
  {"e":"Espadachim","t":"Combate","g":1,"n":"Ittoryu - Baki","c":2,"du":"Instantâneo","al":"Até 9 metros, Linha","rq":"1 Arma Cortante, Ação Poderosa","da":"2d10 de dano Cortante","ac":"Possível","d":"Você lança, em uma jogada de ataque à distância, um projétil crescente de ar contra uma criatura a sua escolha. A próxima jogada de ataque contra essa criatura terá vantagem. <Yakkodori> No 6º nível, você pode usar esta técnica como uma de 3º Grau, seu dano aumenta para 6d10 de dano Cortante, o alcance muda para 21 metros em Linha e custa 5 PP."},
  {"e":"Espadachim","t":"Combate","g":2,"n":"Trueno Bastardo","c":4,"du":"Instantâneo","al":"Toque","rq":"1 Arma Cortante, Ação Poderosa","da":"4d10 de dano Cortante","ac":"Impossível","d":"Um corte implacável contra uma criatura com uma jogada de ataque corpo a corpo. A criatura atingida deve ser bem-sucedida em uma Salvaguarda de Constituição ou receberá a condição “Sangramento”. Alternativamente: Você pode lançar um corte voador contra seus inimigos. Toda a criatura dentro da área de um cone de 15 metros deve fazer uma Salvaguarda de Destreza, com desvantagem. Sofrendo 4d6 de dano Cortante se falhar ou metade desse dano se obtiver sucesso."},
  {"e":"Espadachim","t":"Combate","g":3,"n":"Ittoryu Iai - Shishi Sonson","c":6,"du":"Até o final do seu turno","al":"Toque","rq":"1 Arma Cortante, Ação Poderosa","da":"6d10 de dano Cortante","ac":"Possível","d":"Um ataque em alta velocidade, onde a criatura atingida com um ataque corpo a corpo só sente o golpe quando você já embainhou a arma novamente. Ao realizar esta técnica, você recebe 3 metros de deslocamento normal. <Shi Shishi Sonson> No 12º nível, você pode usar esta técnica como uma de 5º Grau, seu dano aumenta para 12d10 de dano Cortante, o aumento de deslocamento muda para 6 metros e custa 12 PP."},
  {"e":"Espadachim","t":"Combate","g":4,"n":"Ittoryu - Sanjuroku (36) Pound Hou","c":7,"du":"Instantâneo","al":"Até 27 metros, Cone","rq":"1 Arma Cortante, Ação Poderosa","da":"9d6 de dano Cortante","ac":"Possível","d":"Este ataque usa o próprio ar para aumentar a distância do alcance, realizando um balanço circular criando um projétil em espiral. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. <Sanbyakurokuju (360) Pound Ho> No 16º nível, você pode usar esta técnica como uma de 6º Grau, seu dano aumenta para 16d6 de dano Cortante, o alcance se torna 33 metros em Cone e custa 13 PP."},
  {"e":"Espadachim","t":"Combate","g":5,"n":"Biken – Blue Bird","c":10,"du":"Instantâneo","al":"Toque","rq":"1 Arma Cortante, Ação Poderosa","da":"12d10 de dano Perfurante","ac":"Possível","d":"Um ataque rápido que consiste em uma única estocada precisa, em uma jogada de ataque corpo a corpo. Alternativamente: Você pode decidir usar está técnica com sua reação ao ser alvo de uma jogada de ataque ou Teste de Salvaguarda (mesmo de técnicas). Fazendo com que o ataque seja executado com velocidade, mas seja interrompido na metade, criando uma barreira de ar à sua frente e protegendo de qualquer dano você e a área de um Cone de 6 metros, atrás de você."},
  {"e":"Espadachim","t":"Combate","g":6,"n":"Ittoryu - Dai Shinkan","c":16,"du":"Instantâneo","al":"Toque","rq":"1 Arma Cortante, Ação Poderosa","da":"13d10 de dano Cortante","ac":"Impossível","d":"Uma jogada de ataque corpo a corpo com um corte executado com tanta pressão que desestabiliza o equilíbrio do alvo. A criatura atingida deve ser bem-sucedida em uma Salvaguarda de Constituição ou receberá a condição “Atordoado”, até o final do próximo turno da criatura."},
  {"e":"Espadachim","t":"Combate","g":7,"n":"Kamusari","c":20,"du":"Instantâneo","al":"Toque","rq":"1 Arma Cortante, Ação Poderosa","da":"20d10 de dano Cortante","ac":"Possível","d":"Um ataque corpo a corpo veloz e preciso, feito com toda a força do espadachim, em uma jogada de ataque corpo a corpo. O impacto empurra a criatura, com categoria de tamanho Grande ou menor, para um espaço desocupado a até 9 metros de distância dela, caso ela não passe em uma Salvaguarda de Força. Durante o empurrão, se a criatura bater em um objeto ou estrutura com mais de 1,5 metro de raio, ela receberá 3d8 de dano extra."},
  {"e":"Espadachim","t":"Auxiliar","g":1,"n":"Kiri Shigure","c":2,"du":"Instantâneo","al":"Toque","rq":"Reação, 1 Arma Cortante","da":"","ac":"","d":"Ao realizar uma Salvaguarda, você pode executar um corte que reduz 2d8 do dano causado a você e a todas as criaturas em um cone de até 12 metros atrás de você. Caso o ataque seja totalmente reduzido, ele é refletido em um cone de 6 metros na sua frente. Toda criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza, sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. Você pode gastar 1 Ponto de Poder para adicionar 1d8 à redução de dano, até um total de 10d8. Alternativamente: Ao ser alvo de uma jogada de ataque à distância (comum ou de Técnica), você pode reduzir o ataque conforme as regras estabelecidas, defletindo e causando danos apenas à criatura atacante, desde que você consiga vê-la e ela esteja a até 9 metros de você."},
  {"e":"Espadachim","t":"Auxiliar","g":3,"n":"Clear Lance","c":6,"du":"Instantâneo","al":"Até 21 metros, Linha","rq":"Ação Bônus, 1 Arma Cortante","da":"","ac":"","d":"Usando o impulso do golpe com sua espada, você se lançar em qualquer direção, até um local desocupado à sua escolha, dentro do alcance da técnica. Esse movimento não provoca reações de nenhum tipo, mesmo aquelas que ignoram esse tipo de característica, como “Ataque de Oportunidade Superior”. Logo após usar essa característica, a próxima jogada de ataque que você fizer antes do final do seu turno terá vantagem. Alternativamente: Você pode receber apenas o deslocamento dessa técnica, gastando 2 PP."},
  {"e":"Espadachim","t":"Auxiliar","g":5,"n":"Kiai No Tate","c":10,"du":"Até o final do seu turno","al":"Pessoal","rq":"Reação","da":"","ac":"","d":"Ao ser alvo de uma jogada de ataque (comum ou de técnica) ou Salvaguarda para reduzir ou não sofrer dano, você eleva o seu espírito ao máximo e consegue resistir a qualquer dor. Diante disso, até o final do seu turno, qualquer dano causado a você não consegue diminuir os seus Pontos de Vida para menos de 1 ponto."},
  {"e":"Guerrilheiro","t":"Combate","g":1,"n":"Genkotsu Meteor","c":2,"du":"Instantâneo","al":"Até 15 metros, Linha","rq":"1 Bola de canhão, pedra ou objeto similar, Ação Poderosa","da":"2d10 de dano Contundente","ac":"Possível","d":"Você pode lançar, em uma jogada de ataque à distância, objetos do tamanho de uma bola de canhão ou pedras em direção a uma criatura, fazendo-os viajar em alta velocidade e cobrir grandes distâncias. Se o objeto tiver seu próprio valor de dano, o dano resultante prevalecerá sendo o maior entre o dano causado pelo ataque e o dano do objeto. <Ryusei Ken> No 6º nível, você pode usar essa técnica como uma técnica de 3º Grau, seu dano aumenta para 6d10 de dano Contundente, o alcance se torna 27 metros em Linha e custa 5 PP."},
  {"e":"Guerrilheiro","t":"Combate","g":2,"n":"Great Impact","c":4,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"3d10 de dano Contundente","ac":"Possível","d":"Você executa um golpe certeiro com uma jogada de ataque devastadora contra uma criatura. O impacto empurra a criatura, com categoria de tamanho Grande ou menor, para um espaço desocupado a até 6 metros de distância dela, caso ela não passe em uma Salvaguarda de Força. Durante o empurrão, se a criatura bater em um objeto ou estrutura com mais de 1,5 metro de raio, ela receberá 2d8 de dano extra."},
  {"e":"Guerrilheiro","t":"Combate","g":3,"n":"Galaxy Divide","c":1,"du":"Instantâneo","al":"Até 6 metros de raio, Esfera","rq":"Ação Poderosa","da":"1d6 de dano Contundente","ac":"Impossível","d":"Um golpe no chão que gera uma onda de choque de grande impacto. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. A área afetada por esta técnica se torna um terreno difícil e o dano em estruturas é dobrado. Ao realizar esta técnica, você pode gastar 1 Ponto de Poder para adicionar 1d6 de dano, até um dano máximo total de 6d6."},
  {"e":"Guerrilheiro","t":"Combate","g":4,"n":"Killer Bowling","c":8,"du":"Instantâneo","al":"Até 27 metros, Linha","rq":"1 criatura agarrada, pedra grande ou objeto similar, Ação Poderosa","da":"9d10 de dano Contundente","ac":"Possível","d":"Você consegue lançar, em uma jogada de ataque à distância, objetos de tamanho médio, como uma pessoa, desde que a criatura esteja sob a condição “Agarrado”, ou até mesmo arrancar um pedaço do chão e lançá-lo em direção a uma criatura, em alta velocidade e percorrendo grandes distâncias. Se o objeto tiver seu próprio valor de dano, o dano resultante prevalecerá sendo o maior entre o dano causado pelo ataque e o dano do objeto. Alternativamente: Você pode arremessar uma criatura voluntária ou um objeto de tamanho Médio (ou menor) para um local que esteja a até 120 metros de distância e que você possa ver. O dano causado à criatura ou ao objeto, dependendo de onde e como cair ou se ninguém o apanhar, será determinado pelo Narrador."},
  {"e":"Guerrilheiro","t":"Combate","g":5,"n":"Blue Hole","c":12,"du":"Instantâneo","al":"Toque","rq":"Estar em terra firme, Ação Poderosa","da":"12d10 de dano Contundente","ac":"Impossível","d":"Ao estar em solo firme, você pode agarrar uma criatura de tamanho Grande ou menor com um ataque corpo a corpo e lançá-la ao chão com força, gerando uma cratera de 3 metros de raio. A criatura atingida sofre dano e fica excluída do combate até o final do 3º turno da criatura, inalcançável a qualquer efeito de outras criaturas, até emergir da cratera."},
  {"e":"Guerrilheiro","t":"Combate","g":6,"n":"Suisei Ken","c":16,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"13d10 de dano Contundente","ac":"Impossível","d":"Uma jogada de ataque corpo a corpo poderosa contra uma criatura, a pressão criada pelo golpe cria uma onda de choque que atinge uma esfera de 10,5 metros de raio. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo 5d6 de dano Contundente se falhar ou metade desse dano se obtiver sucesso."},
  {"e":"Guerrilheiro","t":"Combate","g":7,"n":"Galaxy Impact","c":20,"du":"Instantâneo","al":"Até 30 metros, Cone","rq":"Ação Poderosa","da":"20d6 de dano Contundente","ac":"Possível","d":"Você executa um único soco, com capacidade de distorcer o ar e causar uma explosão inigualável. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. A área afetada por essa técnica se torna um terreno difícil e o dano em estruturas é dobrado. Alternativamente: Você pode focar o impacto em uma única criatura, fazendo uma jogada de ataque corpo a corpo que causa 20d10 de dano Contundente. A criatura atingida recebe a condição “Estremecido”, até o final do próximo turno dela."},
  {"e":"Guerrilheiro","t":"Auxiliar","g":1,"n":"Conselho Precioso","c":2,"du":"Até o final do seu turno ou o final do próximo turno de outra criatura","al":"Até 21 metros de você","rq":"Ação Bônus ou Reação","da":"","ac":"","d":"Utilizando seus conhecimentos aguçados de batalha, você pode rapidamente formular uma estratégia para si mesmo ou aconselhar uma criatura que esteja te ouvindo e dentro do alcance da técnica. A criatura afetada recebe 1d4, que pode ser utilizado para aumentar sua Classe de Resistência ou o valor de uma jogada de ataque, conforme o resultado do dado."},
  {"e":"Guerrilheiro","t":"Auxiliar","g":3,"n":"Seiretsu","c":4,"du":"Até 1 minuto","al":"Pessoal","rq":"Ação Bônus","da":"","ac":"","d":"Usando sua mente treinada e atingindo grande calma e concentração, você consegue entrar em um estado de puro foco, recebendo as seguintes características, enquanto a técnica durar: Vantagem em suas jogadas de ataque; Vantagem em Testes de Atributo em que você seja proficiente."},
  {"e":"Guerrilheiro","t":"Auxiliar","g":5,"n":"Comando","c":10,"du":"Até 1 minuto","al":"Até 21 metros de você","rq":"Ação Bônus","da":"","ac":"","d":"Você pode emitir um comando que auxilie um grupo de 2 a 5 criaturas (incluindo você ou não) que você possa ver, que estejam te ouvindo e que estejam dentro do alcance da técnica, a realizar uma tarefa enquanto a técnica durar ou até que a tarefa esteja completada. Enquanto a técnica estiver ativa, cada criatura afetada recebe 6d6, que podem ser usados um de cada vez para as seguintes finalidades: Aumentar a CR da criatura afetada, conforme o resultado do dado, ao ser alvo de uma jogada de ataque (comum ou de Técnica); Aumentar o valor de um Teste de Atributo, conforme o resultado do dado, ao tentar realizar uma tarefa relacionada ao comando; Aumentar o valor de uma Salvaguarda, conforme o valor do resultado do dado."},
  {"e":"Lutador","t":"Combate","g":1,"n":"Overthrow","c":2,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"2d10 de dano Contundente","ac":"Impossível","d":"Realizando uma jogada de ataque corpo a corpo, você desfere um golpe que joga uma criatura, com categoria de tamanho Grande ou menor, com toda a força contra o chão. A criatura atingida deve ser bem-sucedida em uma Salvaguarda de Constituição ou receberá a condição “Caído”."},
  {"e":"Lutador","t":"Combate","g":2,"n":"Power Shoot","c":4,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"3d10 de dano Contundente","ac":"Possível","d":"Você realiza uma jogada de ataque corpo a corpo com um chute poderoso, ao acertar o inimigo. O impacto empurra a criatura, com categoria de tamanho Grande ou menor, para um espaço desocupado a até 6 metros de distância dela, caso ela não passe em uma Salvaguarda de Força. Durante o empurrão, se a criatura bater em um objeto ou estrutura com mais de 1,5 metro de raio, ela receberá 2d8 de dano extra."},
  {"e":"Lutador","t":"Combate","g":3,"n":"Kick Course","c":6,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"5d10 de dano Contundente","ac":"Possível","d":"Um golpe de baixo para cima desferido com grande força, que lança o inimigo para uma distância de até 15 metros de altura. A criatura se mantém no alto até o final do próximo turno dela, entrando em queda livre no início do turno seguinte dela. Alternativamente: Você pode lançar uma criatura voluntária, de tamanho Médio ou menor, por até 30 metros em qualquer direção, sem causar qualquer dano a ela diretamente (danos de que queda, por exemplo, são aplicados normalmente)."},
  {"e":"Lutador","t":"Combate","g":4,"n":"Kick Overdrive","c":9,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"9d10 de dano Contundente","ac":"Possível","d":"Com uma jogada de ataque corpo a corpo você desfere inúmeros golpes. A criatura atingida deve ser bem-sucedida em uma Salvaguarda de Constituição ou perderá metade do deslocamento total, até o final do próximo turno dela. Se o resultado do teste for menor que 8 + seu modificador de Força o efeito durará até que o alvo termine um descanso longo."},
  {"e":"Lutador","t":"Combate","g":5,"n":"Rotary Pain","c":12,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"12d8 de dano Contundente","ac":"Impossível","d":"Com uma jogada de ataque corpo a corpo você agarra um objeto ou criatura Média por um dos membros e gira seu corpo, acertando outras criaturas, objetos, chão, etc. Toda a criatura a até 1,5 metro de você deve fazer uma Salvaguarda de Destreza. Sofrendo metade do dano se falhar ou nenhum dano de for bem-sucedida."},
  {"e":"Lutador","t":"Combate","g":6,"n":"Tekken","c":16,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"13d10 de dano Contundente","ac":"Impossível","d":"Você realizar um ataque rápido e preciso, sem chance de errar, contra uma criatura que recebe a condição “Atordoado”, até o final do próximo turno da criatura, sem a necessidade de uma Salvaguarda."},
  {"e":"Lutador","t":"Combate","g":7,"n":"Berserker Barrage","c":17,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"20d10 de dano Contundente","ac":"Possível","d":"Com uma jogada de ataque corpo a corpo contra uma criatura, você libera uma longa sequência de golpes poderosos com toda a sua força. Alternativamente: Quando você cai a 0 Pontos de Vida, caso não morra e não esteja com a condição “Incapacitado”, você pode usar sua reação para realizar essa técnica sem utilizar Pontos de Poder (o dano se tornará 10d10). Essa característica não poderá ser usada novamente até o término de um descanso longo e você receberá 2 Níveis de Exaustão, após o primeiro descanso."},
  {"e":"Lutador","t":"Auxiliar","g":1,"n":"Hard Block","c":2,"du":"Até o início do seu próximo turno","al":"Pessoal","rq":"Reação","da":"","ac":"","d":"Ao sofrer dano, você pode usar sua reação para reduzir os danos Contundentes, Cortantes e Perfurantes sofridos em 6d8, até o início do seu próximo turno. Você pode gastar 1 Ponto de Poder para adicionar 2d8 à redução de dano, até um total de 20d8."},
  {"e":"Lutador","t":"Auxiliar","g":3,"n":"Rage Uppercut","c":6,"du":"Instantâneo","al":"Pessoal","rq":"Reação","da":"","ac":"","d":"Ao ser alvo de uma jogada de ataque corpo a corpo de uma criatura, você pode usar sua reação para desferir um soco ascendente na cabeça ou corpo da criatura, causando 3d10 de dano Contundente e desestabilizando-a. A criatura atingida deve ser bem\u0002sucedida em uma Salvaguarda de Constituição ou receberá a condição “Atordoado”, até o final do próximo turno da criatura."},
  {"e":"Lutador","t":"Auxiliar","g":5,"n":"Dempsey Roll","c":10,"du":"Até 1 minuto","al":"Pessoal","rq":"Ação Bônus","da":"","ac":"","d":"Você assume uma postura que garante a união perfeita de esquivas e golpes. Enquanto a técnica durar, todas as suas jogadas de ataque corpo a corpo desarmado recebem vantagem e todas as jogadas de ataque corpo a corpo contra você recebem desvantagem. Além disso, enquanto essa técnica durar, você pode usar uma ação bônus para receber duas jogadas de ataque adicionais, quando usar a ação “Atacar”."},
