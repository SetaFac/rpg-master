  {"e":"Ninja","t":"Combate","g":1,"n":"Ninpo – Raisen No Jutsu","c":2,"du":"Instantâneo","al":"Até 9 metros de comprimento e 1,5 metro de largura, Linha","rq":"Ação Poderosa","da":"2d8 de dano Elétrico","ac":"Possível","d":"Usando sua arte ninja, você libera uma corrente elétrica que atravessa seus inimigos. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. <Ninpo – Raikiri Rendan> No 6º nível, você pode usar esta técnica como uma de 3º Grau, seu dano aumenta para 6d8 de dano Elétrico e custa 5 PP."},
  {"e":"Ninja","t":"Combate","g":2,"n":"Ninpo – Ryuka No Jutsu","c":3,"du":"Instantâneo","al":"Até 15 metros, Cone","rq":"Ação Poderosa","da":"4d6 de dano de Fogo","ac":"Possível","d":"Usando sua arte ninja, você pode cuspir uma gigantesca bola de fogo. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso."},
  {"e":"Ninja","t":"Combate","g":3,"n":"Hana Shuriken","c":6,"du":"Instantâneo","al":"Até 21 metros, Linha","rq":"6 shuriken, Ação Poderosa","da":"1d6 de dano Perfurante (cada shuriken)","ac":"Possível","d":"Utilizando todo o seu foco nos ataques, você lança 6 shuriken, com o máximo de eficiência, potencializando o dano e sem chance de errar, forçando os projéteis a fazerem curvas até chegarem ao alvo. As shuriken atingem criaturas à sua escolha, que você possa ver e que estejam dentro do alcance. Todos os projéteis atingem simultaneamente e você pode direciona-los para atingir uma única criatura ou várias (modificadores possíveis para a técnica são aplicados apenas em um dos ataques)."},
  {"e":"Ninja","t":"Combate","g":4,"n":"Ninpo – Kazekiri No Jutsu","c":7,"du":"Instantâneo","al":"Até 27 metros, Linha","rq":"Ação Poderosa","da":"9d10 de dano Cortante","ac":"Possível","d":"Usando sua arte ninja, você libera poderosos ventos cortantes contra uma criatura, em uma jogada de ataque à distância."},
  {"e":"Ninja","t":"Combate","g":5,"n":"Ninpo – Goukakyuu No Jutsu","c":12,"du":"Até 1 minuto","al":"Até 33 metros, Linha","rq":"Ação Poderosa","da":"5d6 de dano de Fogo","ac":"Possível","d":"Usando sua arte ninja, você libera uma bola de fogo persistente que explode em um ponto de origem escolhido dentro do limite do alcance da técnica, mantendo um fogo de 9 metros de raio. Uma criatura deve realizar uma Salvaguarda de Destreza na primeira vez que ela entrar no fogo ou que o fogo entrar no espaço dela, incluindo quando o fogo apareceu, e a cada vez que ela iniciar o turno dentro do fogo, todos esses testes sendo feitos com desvantagem. Uma criatura sofre todo o dano se falhar, ou metade desse dano se obtiver sucesso."},
  {"e":"Ninja","t":"Combate","g":6,"n":"Ninpo – Kintama-Tsubushi","c":16,"du":"Até 1 minuto","al":"Até 39 metros, Linha","rq":"Ação Poderosa","da":"10d10 de dano Contundente","ac":"Impossível","d":"Você analisa e ataca o local mais sensível e vulnerável de um inimigo, arremessando uma esfera de metal, uma pedra ou qualquer objeto similar, dentro do alcance da técnica. O alvo escolhido recebe o dano e a condição “Atordoado” automaticamente, sem a necessidade de uma jogada de ataque ou uma Salvaguarda. O alvo atordoado deve realizar uma Salvaguarda de Constituição no final de cada um dos turnos dele, enquanto a técnica durar. Se obtiver sucesso na Salvaguarda, o efeito de atordoamento termina."},
  {"e":"Ninja","t":"Combate","g":7,"n":"Ninpo – Kanashibari No Jutsu","c":20,"du":"Especial, Concentração","al":"Até 9 metros, Linha","rq":"Ação Poderosa","da":"Nenhum","ac":"Impossível","d":"Usando sua arte ninja, você escolhe uma criatura que você possa ver e que estejam dentro do alcance, para impor a condição “Paralisado”, sem que ela faça uma Salvaguarda, enquanto a técnica durar. Ao final de cada um dos seus turnos, você deve ser bem\u0002sucedido em uma Salvaguarda de Vontade CD 8, para manter esta técnica. Essa CD aumenta em +1 para cada 10 PV que a criatura afetada perdeu, desde o início dessa técnica. Enquanto a técnica durar, você também estará com a condição “Paralisado”."},
  {"e":"Ninja","t":"Auxiliar","g":1,"n":"Ninpo – Kawarimi No Jutsu","c":2,"du":"Instantâneo","al":"Até 6 metros de raio, Esfera","rq":"Reação","da":"","ac":"","d":"Instantaneamente após um ataque te atingir, você se transporta para um local que você possa ver dentro do alcance e troca de lugar com um único objeto inanimado, que não esteja preso ou amarrado, que você possa ver no alcance. O objeto alvo deve ser capaz de caber inteiro dentro do mesmo local que você estava ocupando. Junto a isso, você deve jogar um d10 para determinar o quanto de dano foi transferido ao objeto que lhe substituiu. Tendo os seguintes resultados, de acordo com o valor do resultado do dado: 1 - 5: Você sofre metade do dano + 1d10 (arredondado para baixo e não pode ser maior que o dano original). 6 - 8: Você sofre metade do dano (arredondado para baixo). 9 - 10: Você não sofre dano nenhum."},
  {"e":"Ninja","t":"Auxiliar","g":3,"n":"Ninpo – Enton No Jutsu","c":9,"du":"Até 1 minuto, Concentração","al":"Pessoal","rq":"Ação Bônus","da":"","ac":"","d":"Usando uma forma de distração, como uma bomba de fumaça, você se torna invisível, enquanto técnica durar. Qualquer coisa que você esteja vestindo ou objetos pequenos que esteja carregando ficam invisíveis enquanto estiver na sua posse. A técnica termina caso você ataque ou use outra técnica qualquer."},
  {"e":"Ninja","t":"Auxiliar","g":5,"n":"Ninpo – Bunshin No Jutsu","c":9,"du":"Até 2 minutos","al":"Até 6 metros de raio, Esfera","rq":"Ação Bônus","da":"","ac":"","d":"Dez duplicatas ilusórias de você aparecem em lugares à sua escolha dentro do alcance da técnica. Enquanto a técnica durar, os clones se movem com você e copiam as suas ações, trocando de posição, tornando impossível rastrear qual imagem é real. Você pode dissipar os clones sem usar uma ação. Cada vez que uma criatura mirar você com um ataque enquanto a técnica durar, role um d20 para determinar se o atacante, em vez de você, mira uma das suas duplicatas. Se você tiver dez clones, você deve rolar um resultado 6 ou maior para mudar o alvo do ataque para um clone. Com nove duplicatas, você deve rolar um 7 ou maior. Com oito duplicatas, você deve rolar um 8 ou maior e assim por diante. A CR de uma duplicata é igual a 10 + seu modificador de Destreza. Se um ataque atingir uma duplicata, ela é destruída. Uma duplicata só pode ser destruída por um ataque que a atinja fisicamente. Ela ignora todos os outros danos e outros tipos de efeitos. A técnica acaba quando todos os clones forem destruídos. Uma criatura não pode ser afetada por essa técnica se não puder enxergar, se ela contar com outros sentidos além da visão, como percepção às cegas, ou se ela puder perceber ilusões como falsas."},
  {"e":"Okama Kenpo","t":"Combate","g":1,"n":"Death Wink","c":2,"du":"Instantâneo","al":"Até 9 metros, Linha","rq":"Ação Poderosa","da":"2d10 de dano Contundente","ac":"Possível","d":"Piscando os olhos, cria uma rajada de ar similar a um soco, executando uma poderosa jogada de ataque à distância. Essa jogada de ataque não recebe desvantagem em alvos que estejam a 1,5 metro de você. <Galaxy Wink> No 6º nível, você pode usar esta técnica como uma de 3º Grau, seu dano aumenta para 6d6 de dano Contundente, o alcance se torna um Cone de 18 metros e custa 5 PP. Você desfere várias piscadas com os olhos, criando rajadas de ar em direção aos inimigos, como se fosse uma metralhadora. Toda a criatura, à sua escolha, dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso."},
  {"e":"Okama Kenpo","t":"Combate","g":2,"n":"Ballet Chop","c":4,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"4d10 de dano Contundente","ac":"Possível","d":"Um golpe rápido que atinge o inimigo nos olhos com uma jogada de ataque corpo a corpo na forma de um tapa, em partes sensíveis do rosto. O alvo atingido receberá desvantagem no próxima Salvaguarda que fizer até o final do seu próximo turno."},
  {"e":"Okama Kenpo","t":"Combate","g":3,"n":"Bombardier","c":6,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"6d10 de dano Contundente","ac":"Possível","d":"Uma série de ataques rápidos em uma jogada de ataque corpo a corpo com uma margem de acerto crítico 19-20. <Bombardier Arabesque> No 12º nível, você pode usar esta técnica como uma de 5º Grau, seu dano aumenta para 11d10 de dano Contundente, a margem de acerto crítico muda para 18-20 e custa 12 PP."},
  {"e":"Okama Kenpo","t":"Combate","g":4,"n":"Keri Pointe","c":9,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"8d10 de dano Contundente","ac":"Possível","d":"Você salta ao ar e chuta o inimigo realizando uma jogada de ataque corpo a corpo com ambos os pés. O impacto empurra a criatura, com categoria de tamanho Grande ou menor, para um espaço desocupado a até 9 metros de distância dela, caso ela não passe em uma Salvaguarda de Força. Durante o empurrão, se a criatura bater em um objeto ou estrutura com mais de 1,5 metro de raio, ela receberá 3d8 de dano extra."},
  {"e":"Okama Kenpo","t":"Combate","g":5,"n":"Grand Fouetté: Ano Natsu No Hi No Memoir","c":12,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"10d10 de dano Contundente","ac":"Impossível","d":"Depois de girar o corpo, você executa uma jogada de ataque corpo a corpo contra uma criatura. Se o alvo escolhido estiver com 100 Pontos de Vida ou menos, ele receberá a condição “Estremecido”, por até 1 minuto. Do contrário, essa técnica não produz esse efeito. O alvo estremecido deve realizar uma Salvaguarda de Constituição no final de cada um dos turnos dele. Se obtiver sucesso na Salvaguarda, o efeito termina."},
  {"e":"Okama Kenpo","t":"Combate","g":6,"n":"Ohikae Na Fouetté","c":16,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"13d10 de dano Contundente","ac":"Impossível","d":"Realizando uma cambalhota para trás no ar, para conseguir desferir uma jogada de ataque corpo a corpo com um poderoso chute em uma criatura. O alvo deste ataque deve fazer uma Salvaguarda de Constituição, recebendo a condição “Atordoado” até o final do seu próximo turno, se falhar."},
  {"e":"Okama Kenpo","t":"Combate","g":7,"n":"Newkama Kenpo – Yonjuyon (44) No Aesthe Ogi: Mudade Shori Ken","c":20,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"16d10 de dano Contundente","ac":"Impossível","d":"Você apunhala as suas mãos rapidamente em seu oponente, com uma força sobre-humana, em várias partes de sua cabeça em uma jogada de ataque corpo a corpo. Ao ser acertado, o alvo desta técnica deve passar em uma Salvaguarda de Constituição ou receberá a condição “Atordoado” até o final do próximo turno dele. Caso seja bem-sucedido, ele deve escolher entre se mover, realizar uma ação, ou realizar uma ação bônus; ele pode fazer apenas uma das três coisas."},
  {"e":"Okama Kenpo","t":"Auxiliar","g":1,"n":"Rolling Aesthe","c":2,"du":"Instantâneo","al":"Pessoal","rq":"Reação","da":"","ac":"","d":"Você pode usar uma reação para se jogar no chão, rolando graciosamente em desespero. Quando você for alvo de um efeito que exige uma Salvaguarda de Destreza para sofrer metade do dano, você não sofre dano algum se passar, e somente metade do dano se falhar."},
  {"e":"Okama Kenpo","t":"Auxiliar","g":3,"n":"Conforto","c":9,"du":"Até 1 minuto","al":"Toque","rq":"Ação Bônus","da":"","ac":"","d":"Você consegue motivar uma criatura, fazendo seu deslocamento aumentar em 6 metros, aumentar +1 de bônus na CR, ter vantagem em Salvaguardas de Destreza e ganhar uma ação adicional em cada um dos turnos dele. A ação pode ser usada apenas para realizar as ações de “Atacar” (um ataque, apenas), “Disparada”, “Esconder” ou “Usar um Objeto”. Quando a técnica acabar, o alvo não poderá se mover ou realizar ações até depois do seu próximo turno, à medida que uma onda de letargia toma conta dele."},
  {"e":"Okama Kenpo","t":"Auxiliar","g":5,"n":"Fúria Okama","c":10,"du":"Até 1 minuto","al":"Até 9 metros, Linha","rq":"Ação Bônus","da":"","ac":"","d":"Você encara um inimigo, que já tenha ferido você ou uma criatura aliada. A criatura alvo deve ser bem-sucedida em uma Salvaguarda de Vontade ou será afetada por esta técnica enquanto ela durar. O deslocamento do alvo afetado é reduzido pela metade, ele sofre -2 de penalidade na Classe de Resistência, -5 nas Salvaguardas de Destreza e não pode usar reações. No turno dele, ele pode usar ou uma ação ou uma ação bônus, mas não ambas. Independentemente das habilidades da criatura, ela não poderá realizar mais de um ataque corpo a corpo ou à distância durante o turno dela. A criatura perde todos os seus Pontos de Vida temporários e fica impossibilitada de recuperar Pontos de Vida, até a técnica acabar."},
  {"e":"Usuário de Rokushiki","t":"Auxiliar","g":0,"n":"Soru","c":2,"du":"Instantâneo","al":"Pessoal","rq":"Ação Bônus","da":"","ac":"","d":"O usuário aumentando explosivamente sua velocidade ao dar uma investida. Você adiciona 6 metros ao seu deslocamento normal, até o início do seu próximo turno. O deslocamento feito usando esta habilidade não sofre reações como a característica “Ataque de Oportunidade” e a próxima jogada de ataque que você fizer recebe vantagem."},
  {"e":"Usuário de Rokushiki","t":"Auxiliar","g":0,"n":"Tekkai","c":2,"du":"Até o início do seu próximo turno","al":"Pessoal","rq":"Reação","da":"","ac":"","d":"O usuário enrijece os músculos do corpo por um curto período de tempo. Quando o “Tekkai” for usado, o usuário terá seu deslocamento reduzido a 0, até o final do seu próximo turno. Você consegue endurecer o seu corpo para se proteger de danos Contundentes, Cortantes ou Perfurantes com 6d10 Pontos de Vida Temporários, que são reduzidos a cada ataque. A proteção acaba quando os danos ultrapassarem o resultado dos dados ou no início do seu próximo turno."},
  {"e":"Usuário de Rokushiki","t":"Auxiliar","g":0,"n":"Kamie","c":4,"du":"Até o início do seu próximo turno","al":"Pessoal","rq":"Reação","da":"","ac":"","d":"Esta técnica consiste em relaxar o corpo do usuário, deixando-o leve e flexível, sendo capaz de evitar os golpes do adversário mais facilmente. Usando uma reação, até o início do seu próximo turno, quando você for alvo de uma jogada de ataque, jogue um d20 adicionando seu bônus de proficiência ao resultado, se o número for maior do que o valor do dado da jogada de ataque para te acertar, você desvia e não sofre dano. Ao sofrer qualquer dano, essa técnica se encerra automaticamente."},
  {"e":"Usuário de Rokushiki","t":"Auxiliar","g":0,"n":"Geppo","c":2,"du":"Até o início do seu próximo turno","al":"Pessoal","rq":"Ação Bônus","da":"","ac":"","d":"Essa técnica permite que o usuário salte no próprio ar, ganhando deslocamento de voo igual ao seu deslocamento normal, até o início do seu próximo turno, podendo cruzar grandes distâncias sem nunca tocar o chão, ou fazer ataques rápidos e aéreos. Ao receber dano, o usuário deve fazer uma Salvaguarda de Constituição CD 17 subtraído pelo seu modificador de Constituição, para não cair."},
  {"e":"Usuário de Rokushiki","t":"Combate","g":1,"n":"Tobu Shigan","c":2,"du":"Instantâneo","al":"Até 15 metros, Linha","rq":"Ação Poderosa","da":"2d10 de dano Perfurante","ac":"Possível","d":"Um “Shigan” aprimorado, que liberar uma rajada de ar ao estalar os dedos, executa uma jogada de ataque à distância contra um adversário."},
  {"e":"Usuário de Rokushiki","t":"Combate","g":2,"n":"Rankyaku: Hakurai","c":3,"du":"Instantâneo","al":"Até 9 metros de comprimento e 1,5 metro de largura, Linha","rq":"Ação Poderosa","da":"4d8 de dano Cortante","ac":"Possível","d":"Você liberar um grande corte, contido em uma linha reta. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso."},
  {"e":"Usuário de Rokushiki","t":"Combate","g":3,"n":"Shigan: Oren","c":6,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"5d10 de dano Perfurante","ac":"Possível","d":"Uma sequência de “Shigan” em uma jogada de ataque corpo a corpo contra um inimigo. Ao ser acertado, o alvo desta técnica deve ser bem-sucedido em uma Salvaguarda de Constituição ou não poderá realizar reações até o final do próximo turno dele. Além disso, no próximo turno dele, ele deve escolher entre se mover, realizar uma ação, ou uma ação bônus; ele pode fazer apenas uma das três coisas. <Shigan: Madara> No 12º nível, você pode usar esta técnica como uma de 5º Grau, seu dano aumenta para 12d10 de dano Perfurante e custa 12 PP."},
  {"e":"Usuário de Rokushiki","t":"Combate","g":4,"n":"Rankyaku: Amanedachi","c":9,"du":"Instantâneo","al":"Até 7,5 metros de raio, Cilindro","rq":"Ação Poderosa","da":"9d6 de dano Cortante","ac":"Impossível","d":"Girando o corpo algumas vezes o usuário se torna capaz de criar um único “Rankyaku” que cobre uma grande área, tendo você como ponto de origem. Toda a criatura dentro do alcance da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. O dano causado por esta técnica é dobrado em estruturas."},
  {"e":"Usuário de Rokushiki","t":"Combate","g":5,"n":"Rokushiki Ogi – Rokuougan","c":10,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"12d10 de dano Trovejante","ac":"Possível","d":"Somente aqueles que têm o domínio do Rokushiki podem usar esta sétima habilidade. O usuário coloca seus punhos na frente do alvo e lança uma onda de choque devastadora, com uma jogada de ataque corpo a corpo."},
  {"e":"Usuário de Rokushiki","t":"Combate","g":6,"n":"Shugan","c":16,"du":"Instantâneo","al":"Toque","rq":"Ação Poderosa","da":"8d10 de dano Perfurante","ac":"Impossível","d":"Forma ofensiva definitiva do “Shigan”, acertando o corpo de uma criatura com uma jogada de ataque corpo a corpo com a mão inteira. Ao final de cada turno da criatura atingida, ela deve passar em uma Salvaguarda de Constituição para não receber 2d8 de dano Verdadeiro ou usar uma ação para cobrir o sangramento do ferimento. Esse efeito dura por 1 minuto ou até que a criatura seja devidamente tratada."},
  {"e":"Usuário de Rokushiki","t":"Combate","g":7,"n":"Rokushiki Ogi – Sai Dai Rin: Rokuogan","c":19,"du":"Instantâneo","al":"Até 30 metros, Cone","rq":"Ação Poderosa","da":"20d6 de dano Verdadeiro","ac":"Possível","d":"O aprimoramento final da técnica suprema do Rokushiki, fazendo com que libere uma onda de choque poderosa contra seus inimigos. Toda a criatura dentro do alcance da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. O dano causado por esta técnica é dobrado em estruturas."},
  {"e":"Usuário de Rokushiki","t":"Auxiliar","g":1,"n":"Zanshin","c":2,"du":"Especial (até 10 minutos)","al":"Pessoal","rq":"Ação Bônus","da":"","ac":"","d":"Você se move e deixa uma imagem residual sua em um local que você tenha acabado de sair (ou um local que tenha passado dentro do seu turno) que se mantém visível, enquanto a técnica durar ou até que alguém encoste nela. Uma criatura, que desconfie da imagem, pode perceber à distância que é uma miragem, passando em um Teste de Atributo de Vontade (Percepção) CD 15."},
  {"e":"Usuário de Rokushiki","t":"Auxiliar","g":3,"n":"Kamisori","c":6,"du":"Até o início do seu próximo turno","al":"Pessoal","rq":"Ação Bônus","da":"","ac":"","d":"União do “Soru” com o “Geppo” que aumenta em 6 metros ao seu deslocamento normal e garante deslocamento de voo igual ao seu deslocamento total. O usuário permanece no ar até o início do seu próximo turno. O deslocamento feito usando esta habilidade não sofre reações como a característica “Ataque de Oportunidade” e a próxima jogada de ataque que você fizer recebe vantagem."},
  {"e":"Usuário de Rokushiki","t":"Auxiliar","g":5,"n":"Tekkai Utsugi","c":10,"du":"Instantâneo","al":"Pessoal","rq":"Reação","da":"","ac":"","d":"Ao receber um ataque corpo a corpo, enrijecendo os músculos com tamanha força que retornando a mesma quantidade de dano causado pelo ataque e adicionando 2d8 de dano Contundente extra, encerrando o turno da criatura que atacou e não sofrendo dano algum."},
  {"e":"Usuário de Rokushiki","t":"Combate","g":3,"n":"Hissatsu - Fire Bird Star","c":6,"du":"Instantâneo","al":"Até 21 metros, Cone","rq":"Kabuto, 1 Flame Dial, Ação Poderosa","da":"6d6 de dano de Fogo","ac":"Impossível","d":"Libera uma grande rajada de fogo que voa na direção dos seus inimigos. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza, com desvantagem. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. A criatura que não passar na primeira Salvaguarda de Destreza deve ser bem-sucedida em uma nova Salvaguarda de força ou receberá a condição “Queimado”."},
  {"e":"Usuário de Rokushiki","t":"Combate","g":3,"n":"Noryoku Hunter","c":6,"du":"Instantâneo","al":"Toque ou alcance da arma","rq":"Ação Poderosa","da":"6d10 de dano Contundente, Cortante ou Perfurante","ac":"Possível","d":"Você realiza uma jogada de ataque (corpo a corpo ou à distância) que atinge o alvo de forma inesperada, deixando-o abalado. A criatura atingida fica impossibilitada de realizar qualquer Ação Poderosa ou atividade que consuma Pontos de Poder (como o uso de técnicas e características), até o final do próximo turno dela."},
  {"e":"Usuário de Rokushiki","t":"Combate","g":3,"n":"Eletrical Luna","c":6,"du":"Instantâneo","al":"Até 24 metros, Cone","rq":"Ação Poderosa","da":"6d6 de dano Elétrico","ac":"Possível","d":"Ao encostar no chão, você criar uma corrente elétrica que se espalha pelo solo e cria uma alta descarga de eletricidade. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza, com desvantagem. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso."},
  {"e":"Usuário de Rokushiki","t":"Combate","g":3,"n":"Omae Wa Mou Shindeiru","c":6,"du":"Instantâneo","al":"Toque","rq":"Arma Cortante, Ação Poderosa","da":"6d10 de dano Cortante","ac":"Impossível","d":"Você realiza uma jogada de ataque de forma extremamente rápida, fazendo com que seja quase imperceptível. A criatura atingida deve ser bem-sucedida em uma Salvaguarda de Vontade, para perceber e receber metade do dano da técnica. Caso a criatura não perceba, o dano é atrasado, até que ela receba qualquer dano posterior ou em 5 minutos. Para cada 1 minuto que o dano seja atrasado, o dano da técnica aumenta em 2 dados."}
];

/* Singularidades, defeitos e traços de espécie (Livro do Jogador V1.5b) */
const TRAIT_DATA = {
  "sing": [
    {"n":"Álter Ego Heroico","d":"Você possui uma identidade secreta, à sua escolha, que pode ser invocada sempre que estiver em perigo, desde que tenha seus trajes de herói em mãos. Enquanto estiver vestido como herói, deve proteger sua verdadeira identidade de todos. Durante até 5 minutos, enquanto estiver vestido de herói, você recebe vantagem em jogadas para determinar sua iniciativa. Caso seja o último na ordem de iniciativa, passa automaticamente a ser o primeiro. Além disso, ignora quaisquer efeitos negativos dos seus defeitos. Essa característica não poderá ser usada novamente até o término de um descanso longo."},
    {"n":"Ambição do Rei","d":"Você tem uma ambição grandiosa e inabalável, acompanhada de uma força de vontade que transcende limites. Em situações de grande estresse, você é capaz de manifestar uma aura misteriosa Você se torna capaz de manifestar o Haki do Rei, no estágio “Inexperiente”, respeitando todas as regras do Capítulo 7. Essa individualidade só está disponível com a aprovação do Narrador."},
    {"n":"Ambiente Familiar","d":"Criado em um ambiente específico, você encontra conforto e liberdade nas recordações desse lugar, destacando-se como um perito em suas particularidades, permitindo que suas habilidades se sobressaiam sempre que imerso nesses lugares. Seja nas dunas, montanhas, neve, selva, campo ou mar, escolha o cenário que mais ressoa contigo, podendo jogar novamente qualquer uma de suas jogadas. Essa característica pode ser usada até 3 vezes e você recupera todos os seus usos ao término de um descanso longo."},
    {"n":"Aura Assassina","d":"Você emana uma presença intimidadora, que não tem relação com sua aparência física, seja por ter encarado inúmeras situações mortais ou por guardar uma intensa fúria dentro de si. Enquanto estiver com todos os seus Pontos de Vida, qualquer criatura que realizar a primeira jogada de ataque contra você terá desvantagem."},
    {"n":"Aparência Inofensiva","d":"Por algum motivo você não parece perigoso, talvez seja muito pequeno, pareça fraco ou velho (você escolhe o motivo). Fazendo com que seja mais fácil pegar oponentes desprevenidos. O truque não funciona com ninguém que já tenha visto você lutar, e também não engana duas vezes a mesma pessoa. Você recebe +5 para acertar alguém que não desconfie de você, usando esta individualidade. Consegue diminuir o preconceito em 1 nível. Porém, você recebe -5 em Testes de Atributo de Presença (Intimidação)."},
    {"n":"Armadura de Músculos","d":"Você treina o seu corpo diariamente e está mais do preparado para receber golpes. Você pode substituir o modificador de Destreza adicionado à sua CR pelo modificador de Força. Mesmo quando uma característica lhe permitir usar outro modificador como a “Defesa Aprimorada”, caso nenhum deles seja o modificador de Força, você ainda pode fazer essa troca por qualquer um dos modificadores."},
    {"n":"Confiança Descabida","d":"Você possui uma técnica suprema, capaz de derrotar qualquer criatura com uma única jogada de ataque, porém, para sua execução é necessário um preparo quase impossível de realizar em um combate. Por exemplo, fazer mil flexões para aquecer o corpo, pintar um quadro para conseguir a inspiração necessária ou dançar durante 1 hora (sempre sendo necessária a aprovação do Narrador). Por mais que você não consiga realizar seu ataque definitivo, isso lhe traz um efeito psicológico de sempre achar que vai conseguir contornar as dificuldades. Dessa forma, ao ter seus Pontos de Vida reduzidos a 0 (mas não morra), você ainda vai poder executar mais 1 turno consciente – perdendo a consciência no final deste turno."},
    {"n":"Beleza Natural","d":"O personagem nasceu com uma beleza exuberante. Mesmo sem qualquer preparo, ele já é bonito o suficiente para chamar atenção e conquistar admiradores. Reduz o preconceito severo para medíocre e o medíocre para débil. Não é possível reduzir o preconceito débil com essa individualidade."},
    {"n":"Bom Senso","d":"Certas pessoas podem ter atitudes estúpidas, mas você certamente não é uma delas. Todas as vezes que o personagem for fazer alguma coisa obviamente idiota, o Narrador pode dizer que ele pretende fazer uma burrice, evitando um desfecho desagradável."},
    {"n":"Corpo Fechado","d":"Sua pele parece de aço e, por mais que esteja ferido, raramente você demonstra sinais de lesões e cortes, sendo difícil até mesmo sangrar quando cortado. Quando fizer uma Salvaguardas contra as condições “Sangramento” e “Queimadura”, você pode tornar uma falha em um sucesso. Essa característica pode ser usada uma quantidade de vezes igual ao seu bônus de proficiência e você recupera todos os seus usos ao término de um descanso longo."},
    {"n":"Corpo Vigoroso","d":"Você nasceu com um corpo muito saudável, suas feridas se curam mais rápido e aguenta uma quantidade incrível de esforço. Sempre que você passar de nível, role novamente o dado de vida para aumentar o valor máximo de Pontos de Vida e escolha o maior. Ao terminar um descanso curto, você sempre pode usar 1 dado de vida adicional."},
    {"n":"Determinação","d":"Você é dotado de grande ímpeto em atingir seus sonhos. Seu objetivo pode até mudar conforme o andar da história, mas nada irá desanimá-lo ou abalar sua fé em atingir suas ambições. Esta característica concede um bônus de +3 em jogadas de ataque, dano, Testes de Atributo e Salvaguarda, quando envolver diretamente o seu objetivo (que deve ser especificado nesta individualidade, sendo algo concreto e de fácil entendimento). Essa característica pode ser usada até 3 vezes e você recupera todos os seus usos ao término de um descanso longo."},
    {"n":"Disciplinado","d":"Dia após dia, você se dedica incansavelmente aos seus treinamentos, buscando aperfeiçoamento físico e mental. Seu comprometimento é evidenciado pela rotina rigorosa, destacando-se pela determinação em alcançar a excelência. O treino transcende a prática, tornando-se uma paixão e estilo de vida. A cada nível par de personagem, você recebe 1 Ponto de Treinamento."},
    {"n":"Estudioso","d":"Desde a infância, você nutriu uma profunda admiração pelo caminho acadêmico, dedicando considerável parte do seu tempo aos estudos formais. Você recebe o dobro do seu bônus de proficiência em uma perícia que você já seja proficiente. Escolha entre “História”, “Investigação”, “Natureza” ou “Sobrevivência”."},
    {"n":"Físico Perfeito","d":"Seu corpo está sempre bem cuidado e tem a capacidade assustadora de se recuperar de ferimentos e esforços mais leves em poucos minutos. O descanso curto, para você, tem uma duração mínima de 15 minutos."},
    {"n":"Forasteiro","d":"Você veio de um local conhecido por poucos, mesmo se fosse das ilhas do céu, seria de um local oculto para seus habitantes, com suas próprias culturas e heranças. Dessa forma, você traz consigo itens misteriosos. Escolha entre uma “Planta Mãe”, um conjunto de dials aleatórios (3 dials cotidianos, 2 dials bélicos e 1 dial restrito), ou um “Clima-Tact”. Todos os itens presentes no Capítulo 2 do Guia do Narrador."},
    {"n":"Haki da Observação Inato","d":"Você nasceu com grande talento para o Haki da Observação. Fora de batalha, você pode usar a característica “Perceber Emoção”, “Perceber Presença” e “Perceber Desafio” do Haki da Observação. Ao escolher esta individualidade, o Haki da Observação será automaticamente seu Haki principal e ao adquirir controle sobre o Haki da Observação ele recebe 5 Pontos de Ambição."},
    {"n":"Indomável","d":"O personagem tem uma reação quase bestial toda vez que tentam subjugá-lo de alguma forma. Seja por correntes, agarrões, algemas ou habilidades especiais. Toda vez que você estiver restringido de alguma forma, você dobra o seu modificador de Força nas jogadas para tentar se libertar. Você também pode escolher causar um dado de dano extra em você e na criatura que te restringiu."},
    {"n":"Instintos Animais","d":"Talvez você tenha crescido em um local com culturas tribais ou em meio aos animais, talvez tenha combatido muitas feras, durante sua vida, ou só nasceu assim. O fato é que você se parece muito com um animal e têm instintos de sobrevivência aflorados. Sempre que uma criatura assumida como inimiga estiver no seu campo de visão, você pode rolar um Teste de Atributo de Vontade (Intuição) CD 15 para saber se ele é mais fraco, igualmente forte ou mais forte que você. Além disso, sempre que uma criatura intencionar te atacar, e estiver a até 18 metros de você, você consegue sentir e identificar a localização da criatura."},
    {"n":"Integrante Fantasma","d":"Você tem uma participação sútil e calma, sempre surpreendendo os outros com a sua personalidade quase fantasmagórica, quase invisível socialmente. Desde que você não esteja interagindo diretamente com alguma situação ou combate, você pode inserir-se em qualquer interação que, à princípio, só envolvia os outros jogadores da mesa, mesmo se o Narrador não estiver ciente."},
    {"n":"Interrogador","d":"Você é perito em descobrir enganações e explorar as fraquezas de uma criatura, forçando-a a responder suas perguntas, usando meios violentos, psicológicos ou analisando o corpo (pulsação, expressões e etc.). Quando uma criatura está com a condição “Incapacitado”, ela é compelida a responder suas perguntas, e você automaticamente tem sucesso em Testes de Atributo de Vontade (Intuição) para detectar mentiras."},
    {"n":"Má Fama","d":"Você possui uma infâmia notória. Seja por falhas em missões cruciais, derrotas públicas, ou por ser um ex-criminoso em processo de reabilitação. Sua reputação é marcada por uma falta de confiança generalizada, com suspeitas consideráveis sobre suas ações, quer sejam merecidas ou não. Você pode definir uma alcunha inicial para o seu personagem (com aprovação do Narrador) e, mesmo quando derrotado, seus inimigos evitam tirar sua vida, seja por conta de estarem procurando por você no submundo ou para reivindicar alguma recompensa."},
    {"n":"Negativo","d":"Você é naturalmente negativo, sempre pessimista e esperando o pior. Quando algo dá errado, você simplesmente aceita a situação. Por definição, nada que alguém faça ou diga, nem mesmo habilidades de Akuma no Mi, pode deixá-lo mais deprimido ou desmotivado, pois não há como ficar pior do que você já é. Você é imune às condições “Empoderado”, “Enfeitiçado”, “Enfurecido”, “Letárgico” e “Sonolento”."},
    {"n":"Patrocinado","d":"Você é financiado por uma grande personalidade do mundo, poder ser um Rei, um artista renomado, um Yonkou, um integrante do Governo mundial, entre outros. Periodicamente, essa entidade fornece ajuda ou presentes. A cada nível par de personagem, chega até você um presente do seu patrono (determinado pelo Narrador), possivelmente acompanhado de um pedido de favor."},
    {"n":"Pau-Para-Toda-Obra","d":"Você buscou todas as áreas de conhecimento disponíveis para você, sabendo pelo menos o básico de cada uma dessas profissões e chegou até a praticar por um tempo cada ofício. Essa característica garante a você a possibilidade de aprender mais que uma profissão auxiliar. Além da profissão que você escolheu na criação do seu personagem, escolha 2 profissões auxiliares, exceto arqueólogo, para ter a graduação “Amador” e subdivisão “Novato”. Conforme você evolui na sua profissão principal, você também aprende um pouco mais das outras. A cada graduação que você alcança na sua profissão principal, você alcança uma nova subdivisão nas profissões auxiliares escolhidas, só podendo aprender até a subdivisão “Veterano” da graduação “Amador”, com essa característica. Nas profissões escolhidas por essa característica, o requisito de tempo necessário em livros para subir subdivisões e graduações é reduzido pela metade."},
    {"n":"Perceptivo","d":"Você possui a capacidade de perceber tudo à sua volta, mesmo que de uma forma sutil. Consegue notar mais detalhes nas situações e ambientes, percebendo pistas de que está entrando em uma armadilha. Você é imune a ser surpreendido no início de um encontro de combate e recebe vantagem em Teste de Atributo de Vontade (Percepção)."},
    {"n":"Recuperação Espantosa","d":"O personagem possui uma recuperação fora do normal, seja para dores ou para fadiga. Enquanto uma pessoa comum estaria de cama por dias, recuperando-se de uma batalha, você já está ativo e pronto para a próxima. O descanso longo, para você, tem uma duração mínima de 4 horas ou você pode optar por descansar 8 horas e recuperar 1 Nível de Exaustão adicional. Essa característica não acumula com outras que façam você recuperar Níveis de Exaustão, recuperando, no máximo, 1 Nível de Exaustão extra por descanso longo."},
    {"n":"Tesouro Precioso","d":"Você tem um objeto, à sua escolha, que precisa proteger a qualquer custo, para você, ele significa sua própria vida. Pode ser um chapéu confiado a você pelo seu salvador, uma espada de uma amiga falecida ou um mapa de um tesouro submerso. O objeto não pode ser de grande valor econômico e precisa da aprovação do Narrador. Enquanto estiver carregando seu tesouro, você recebe +1 em todas as Perícias e Salvaguardas em que for proficiente, em testes feitos com a intenção de proteger o seu tesouro, você recebe +1 adicional. Caso veja o seu tesouro sendo destruído ou danificado, você deve passar em uma Salvaguarda de Vontade CD 18, para não ficar atordoado, o teste deve ser repetido no final de cada um dos seus turnos. Caso o seu tesouro seja destruído ou desapareça, você recebe a condição “Letárgico” por 2d6 meses."},
    {"n":"Versatilidade Superior","d":"Foi ensinado a você, desde sempre, que conhecimento é poder. Levando esse ensinamento em mente, você sempre se manteve atento a tudo que pudesse aprender e ainda o faz. Você pode escolher 2 perícias quaisquer para adicionar sua proficiência, com exceção de “Haki”, “Sobrenatural” e “Sorte”."},
    {"n":"Voz de todas as Coisas","d":"Você nasceu com um poder de características únicas e muito misterioso. Em algumas situações, você é capaz de ouvir a “voz” de qualquer ser vivo e até objetos inanimados. Esse poder não necessariamente permite que você consiga se comunicar com outros seres vivos. Ao ver um objeto misterioso, textos indecifráveis ou animais raros, o Narrador pode pedir para você pode fazer Teste de Atributo de Vontade (Sobrenatural), com CD determinada por ele. Ao ser bem-sucedido, você ainda não será capaz de ler ou entender, mas você consegue receber os sentimentos que queriam ser passados."}
  ],
  "def": [
    {"n":"Chantagem","d":"Alguém de grande influência tem um segredo seu, um objeto importante ou mantém como refém uma pessoa muito importante para você (deve ser previamente combinado com o Narrador). De tempos em tempos, emissários dessa pessoa surgem para instruí-lo a cumprir demandas, as quais podem acarretar sérios perigos ou entrar em conflito com seus princípios."},
    {"n":"Churriado","d":"Você tem muitos pontos positivos, mas a força física certamente não é uma delas, e por mais que você invista seu tempo em treinar seu corpo, o resultado vai acabar sendo só uma aparência melhor. Você tem desvantagem em qualquer Testes de Atributo ou Salvaguarda de Força."},
    {"n":"Consumidor Compulsivo","d":"Você é impulsivo quando se trata de compras e gasta dinheiro de maneira descontrolada em itens que, muitas vezes, são inúteis ou prejudiciais. Sempre que entrar em uma loja ou mercado, você deve fazer uma Salvaguarda de Vontade CD 18 para evitar gastar 50% do dinheiro total que você possuir."},
    {"n":"Coração Mole","d":"Você não aguenta ver os outros sofrerem e evita qualquer situação que implique em causar dor física ou emocional em alguém que não mereça ou não possa se defender. Suas jogadas de ataque contra criaturas que possam te causar empatia recebem desvantagem."},
    {"n":"Dependente","d":"Você se sente totalmente inseguro quando não tem seus companheiros para te ajudar ou proteger, pode ser por medo, insegurança ou por sempre querer se mostrar. Enquanto não estiver com nenhum companheiro ou criatura que esteja cooperando contigo, dentro do seu raio de visão, você recebe -1 em todas as suas jogadas."},
    {"n":"Dívida de Jogo","d":"Você deve uma quantidade absurda de dinheiro para uma ou várias personalidades muito poderosas e influentes, essa quantia é algo que você talvez nunca consiga pagar, além disso, os esforços de tentar passar seus credores para trás só aumentam a vontade de tentarem te pegar. Independentemente de onde você esteja, você nunca está seguro e a qualquer momento podem surgir empregados e contratados dos seus credores para tentar te capturar."},
    {"n":"Falta de Higiene","d":"Você foge da água como se ela fosse um veneno. Sua aversão a banhos frequentes e à limpeza em geral afeta como as pessoas te veem e suas interações. Você falha automaticamente em Testes de Atributo de Presença (Persuasão)."},
    {"n":"Falta de Sorte","d":"A vida parece sempre querer rir da sua cara, não importa o quanto você tente e se prepare, alguma coisa sempre acaba dando errada. Uma vez por dia, o Narrador pode transformar uma rolagem bem-sucedida em uma falha, essa rolagem pode ser sua ou de qualquer outro, desde que seja para atrapalhar sua vida."},
    {"n":"Ganancioso","d":"Você realmente ama dinheiro, talvez, o motivo que lhe fez partir para se aventurar nos mares. Sempre que alguém falar de formas de ganhar quantidades consideráveis de dinheiro, por um pedido, uma missão ou revelando a localização de um tesouro escondido, você não consegue resistir, caso perca a oportunidade, você é acometido por uma grande depressão. Caso se recuse a ganhar, perca dinheiro ou chances de enriquecer, você recebe -1 em todas as suas jogadas de ataque, Testes de Atributo e Salvaguardas por até 1d6 dias."},
    {"n":"Hipocondríaco","d":"Quando qualquer pessoa fala de uma doença que você não conheça, mesmo se ela não existir, se você não passar em uma Salvaguarda de Constituição CD 16, logo após o próximo descanso longo, você começa a sentir os sintomas dessa doença por até 1d4 dias."},
    {"n":"Ignorante","d":"Você acha que já possui quase todo o conhecimento necessário para atingir seus objetivos e outros conhecimentos são perda de tempo. Você não consegue aprender, de forma alguma, nenhuma profissão, além da profissão escolhida na criação do seu personagem."},
    {"n":"Linhagem Demoníaca","d":"Você é filho ou descendente de qualquer grau de uma figura, conhecida em todo o mundo, considerada execrável por uma grande parte da sociedade e, talvez, até maioria. Quando àqueles que odeiam essa pessoa descobrem sua relação com ela, eles transmitem todo esse ódio para você. Você recebe preconceito severo de qualquer pessoa que odeie o seu antepassado."},
    {"n":"Medroso","d":"O medo é seu companheiro constante, qualquer coisa possivelmente assustadora o impressiona e faz com que esbugalhe os olhos e grite, mesmo que você seja capaz de fazer o mesmo ou até superar ou que a criatura seja mais fraca que você. Você é sempre o último nas ordens de iniciativa. Caso alguma outra criatura tenha esta individualidade, o Narrador decide quem irá primeiro."},
    {"n":"Monstruoso","d":"Sua aparência é repulsiva e assustadora. Você não pode sair pelas ruas como gente comum ou as pessoas ficarão assustadas e até agressivas. Você ganha 1 nível (caso não tenha) ou aumenta 1 nível de preconceito. Todos que possuem esta desvantagem, podem esconder sua monstruosidade com roupas adequadas."},
    {"n":"Mudo","d":"Um personagem mudo é incapaz de produzir fala, sendo preciso recorrer a outros meios para se comunicar, como a língua de sinais. Você falha automaticamente em Testes de Atributo que dependam da fala."},
    {"n":"Narcisista","d":"Você ama a si mesmo e está sempre cuidando da própria aparência com grande afinco. Sua aparência reflete no seu desempenho; caso não esteja arrumado, se sentindo belo, ou esteja sujo, mesmo as batalhas não serão travadas com afinco. Quando você não está arrumado ou está sujo, todos os seus Testes de Atributo sofrem uma penalidade de -1."},
    {"n":"Orgulho Cego","d":"Você é incapaz de ignorar provocações e insultos de qualquer tipo direcionados a você, seus companheiros ou entes queridos, independentemente do quão a situação seja inapropriada para isso, podendo partir para a violência caso fique muito irritado. Você falha automaticamente em Salvaguardas contra Testes de Atributo de Sabedoria (Provocação) e não pode ser acalmado por Testes de Atributo."},
    {"n":"Pacifista","d":"Você adota uma postura pacifista em sua abordagem à vida, buscando solucionar conflitos por meio do diálogo e da compreensão. Evita o uso da violência sempre que possível, priorizando a paz e a harmonia em suas interações. Você só consegue executar ações que possam causar dano quando um aliado estiver com menos de 50% de Pontos de Vida ou alguma criatura não combatente estiver com risco de vida. Quando sozinho, você sempre se rende ou busca o caminho da não violência."},
    {"n":"Paranoico","d":"Você não confia em ninguém, nem em seus amigos. Nunca pede e nem aceita nenhuma ajuda, nem mesmo o tratamento de seus ferimentos. Não consegue descansar ou dormir direito: mesmo que esteja em uma estalagem ou outro lugar que parece ser totalmente seguro. Você precisa de, no mínimo, 2 horas para se acalmar e achar que está tudo certo, para começar um descanso curto ou longo."},
    {"n":"Rosto Debochado","d":"Sua cara incita o ódio e parece que sempre está fazendo graça às custas de todo mundo. Sempre que um encontro se iniciar, quando não fizer diferença para as criaturas inimigas qual alvo escolher, elas sempre escolherão você."},
    {"n":"Sedutor Incorrigível","d":"Você não consegue resistir a fazer tentativas casuais para seduzir qualquer pessoa que se encaixe em seus critérios de parceiro sexual, mesmo que você possa não querer ter um relacionamento sério (ou qualquer relacionamento). No entanto, isso não significa que você seja um bom sedutor. Enquanto estiver na presença de seu interesse amoroso, você não consegue usar sua concentração para manter técnicas e características."},
    {"n":"Senso de Direção Ruim","d":"Você é tão ruim com senso de direção que pode se perder em um corredor sem portas ou janelas e não importa se seus amigos estiverem de olho em você, no primeiro deslize, você pode sumir da vista deles, como mágica. Sempre que você não estiver em um encontro e se deslocar de um lugar para o outro, andando ou correndo, você deve jogar um d6. Em um resultado 3 ou menor, você se perde e pode parar a até 500 metros de distância do ponto de partida. Caso você esteja acompanhado, você pode jogar o d6 duas vezes e escolher o resultado."},
    {"n":"Sinceridade Excessiva","d":"Você é incapaz de mentir, seja por valores morais ou simplesmente dificuldade em ocultar a verdade. E por mais que você se esforce para contar uma mentira, sempre será óbvio que não se trata da verdade. Você falha automaticamente em Testes de Atributo de Presença (Enganação)."},
    {"n":"Sonolência","d":"Por algum motivo, você está sempre com sono, não importa se dormiu normalmente no dia anterior ou se acabou de acordar. No início de um encontro de combate, você deve rolar 1d6, e em um resultado 3 ou menor, você passa a primeira rodada do combate com a condição “Inconsciente”. Esse teste pode ser solicitado pelo Narrador em qualquer outro momento também."},
    {"n":"Sósia","d":"Você é parecido com a descrição de outra pessoa, o que causa a confusão de identidades. Isso pode provocar inúmeras situações desagradáveis, ou mesmo perigosas, principalmente se o seu “outro eu” tiver péssima reputação ou estiver sendo procurado por algum crime."},
    {"n":"Teimoso","d":"Uma vez que você decide algo ou concorda com um plano, suas convicções são totalmente apostadas nisso. Fazendo com que seja algo absoluto no seu entendimento. Sempre que você decide recuar ou mudar o que estava previamente decidido, você perde 1 Ponto no seu valor de Atributo de Vontade. Cada ponto perdido será recuperado após se passar 1 semana."},
    {"n":"Trapalhão","d":"Sempre que você se move, sai esbarrando em tudo pela sua frente ou tropeça no nada, não consegue carregar qualquer coisa sem que tudo acabe no chão. Ao realizar uma falha crítica em uma jogada de ataque, você não só erra o golpe como também desencadeia um dos seguintes efeitos, de acordo com o Narrador: Acerta a si mesmo ou um aliado próximo, causando até 5 pontos de dano na criatura; Deixa a arma cair no chão; Tropeça e recebe a condição “Caído”. TRAUMA PROFUNDO/FOBIA --------------------------------------------------------------------------------------------- Em seu passado você passou por uma situação traumática irrecuperável, desde uma perda terrível, ter sofrido agressões ou qualquer evento negativamente marcante. Toda vez que você se depara com uma situação semelhante ou possui um gatilho que traga suas memórias à tona, você é tomado por perturbações nítidas que pode te impedir de realizar ações ou comprometer sua concentração, devendo fazer uma Salvaguarda de Vontade CD 15, se passar no teste, você supera momentaneamente o trauma, se falhar, todos os seus Testes de Atributo sofrem -1 de penalidade, durante 1 minuto. Após esse tempo, você pode repetir o teste."},
    {"n":"Vício","d":"Você é viciado em alguma substância que precisa estar presente no seu sangue. Desde álcool, nicotina, açúcar, drogas ilícitas, alimentos comuns ou compostos mais simples. Sempre que você ignora o vício, o personagem deve arcar com as consequências da abstinência, que varia de acordo com o seu tempo de privação. Conforme o tempo passa, os efeitos se acumulam. Ao final de um dia sem consumir a substância do seu vício, você não consegue se concentrar e recebe desvantagem nas jogadas para determinar sua iniciativa. Ao final de dois dias, você não recebe nenhum benefício ao terminar um descanso curto. Independentemente de estar em privação ou do tipo de vício, sua saúde está comprometida. Você recebe -1 em Salvaguardas de Constituição."},
    {"n":"Voz Fina","d":"Você possui uma voz tão fina que chega a ser engraçada, e não importa o quanto tente engrossar ou disfarçar. Também não importa o seu tamanho ou aparência; nada impede que quem ouça sua voz a ache engraçada. Você falha automaticamente em Testes de Atributo de Presença (Intimidação)."}
  ],
  "sp": [
    {"s":"Anões","c":"Benefício Da Espécie","n":"Corpo Pequeno","d":"Enquanto o anão e seus mestiços permanecerem na categoria de tamanho Miúdo, eles se beneficiam das seguintes características:"},
    {"s":"Anões","c":"Benefício Da Espécie","n":"Estômago Pequeno","d":"Itens consumíveis e alimentos feitos para criaturas de tamanho Médio ou maior podem ser usados em metade da quantidade usual para garantir os mesmos bônus."},
    {"s":"Anões","c":"Benefício Da Espécie","n":"Piscar","d":"Você pode desaparecer da visão de todos e reaparecer em um local desocupado à sua escolha, a até 9 metros de distância de sua posição inicial. Essa característica pode ser usada até 3 vezes e você recupera todos os seus usos ao término de um descanso longo."},
    {"s":"Anões","c":"Benefício Da Espécie","n":"Andar das Fadas","d":"Desde que não estejam sob a condição “Impedido”, anões recebem vantagem em Testes de Destreza (Furtividade) quando não estiverem em um encontro de batalha. Dentro de um encontro, podem tentar se esconder mesmo a plena vista, usando uma ação bônus, desde que haja um local que proporcione cobertura total."},
    {"s":"Anões","c":"Benefício Da Espécie","n":"Hóspede Feérico","d":"Enquanto o anão e seus mestiços mantiverem a categoria de tamanho Miúdo, podem ocupar o mesmo espaço de criaturas de categoria de tamanho maiores. Se movimentando apenas através do corpo da criatura e sendo movidos junto com ela. Enquanto estiver compartilhando o espaço da criatura, não será possível ser alvejado por jogadas de ataque ou Salvaguardas (comum ou de Técnicas). Entretanto, não poderá usar ações poderosas e sofrerão metade de todo o dano direcionado à criatura que estiverem compartilhando o espaço. O dano sofrido pelo anão ignora as características que alterem o dano sofrido pelo hospedeiro, como invulnerabilidades, resistências e etc."},
    {"s":"Anões","c":"Dificuldade Da Espécie","n":"Ingenuidade Anormal","d":"Anões são muito ingênuos e recebem -10 em Testes de Atributo de Vontade (Intuição)."},
    {"s":"Celestiais","c":"Benefício Da Espécie","n":"Herança Cultural","d":"Um celestial conhece e se torna proficiente com todos os tipos de dials e suas funcionalidades. No início do jogo, à escolha do jogador, o personagem recebe 3 dials cotidianos de tipos diferentes e mais 1 dial bélico, presentes no Guia do Narrador. Além disso, escolhe 2 Perícias para adicionar sua proficiência, à sua escolha, com exceção de “Sobrenatural” e “Sorte”. No lugar de uma dessas perícias, você pode escolher receber a Singularidade “Haki da Observação Inato” e receber 15 Pontos de Ambição, que só poderão ser investidos no Haki da Observação, logo após despertar o uso do Haki."},
    {"s":"Celestiais","c":"Dificuldade Da Espécie","n":"Anjos Caídos","d":"Por estarem, a gerações, acostumados com atmosferas menos densas, altitudes mais baixas podem distorcer o senso de equilíbrio dos celestiais. Dessa maneira, você recebe -2 em Testes de Atributo de Destreza (Acrobacia), desde que não esteja a mais de 5.000 metros do nível do mar."},
    {"s":"Celestiais","c":"Variante Da Espécie","n":"Benefício da Espécie (Sacerdote Celestial)","d":"O celestial recebe +5 em Testes de Atributo de Presença (Atuação). SHANDIANS -------------------------------------------- ----------------------------------------------------------------- Os Shandians encontraram seu lar no Mar Azul, na ilha de Jaya, mas um fenômeno marinho levou toda a tribo, junto com metade da ilha, para os mares do céu. Após isso, os Skypeans tomaram suas terras, e uma guerra se iniciou desde então. Os Shandians usam vestimentas tribais e se ornamentam com pinturas e tatuagens por todo o corpo. Eles têm grande apreço pelo treinamento físico e pelo espírito de guerreiro."},
    {"s":"Celestiais","c":"Variante Da Espécie","n":"Benefício da Espécie (Guerreiro Celestial)","d":"O celestial recebe +5 em Testes de Atributo de Força (Atletismo). SKYPEANS -------------------------------------------------- --------------------------------------------------------- Os Skypeans são o povo mais pacato que vive nas ilhas do céu, possuindo diversas leis. Usam dials para tarefas diárias, como cozinhar e andar de barco. Para se cumprimentarem, dizem “Heso” (umbigo), e seus penteados tradicionalmente são moldados para parecerem duas antenas com bolinhas nas pontas. Eles também tendem a ter a cor de pele mais clara do que a dos Shandians."},
    {"s":"Celestiais","c":"Variante Da Espécie","n":"Benefício da Espécie (Diplomata Celestial)","d":"O celestial recebe +5 em Testes de Atributo de Presença (Persuasão)."},
    {"s":"Gigantes","c":"Benefício Da Espécie","n":"Força Colossal","d":"O gigante se torna proficiente e dobra o bônus de proficiência em qualquer Salvaguarda ou Teste de Atributo de Força. Além disso, características e técnicas que se limitam a afetar apenas criaturas Grandes ou menores podem afetar também criaturas e alvos Enormes."},
    {"s":"Gigantes","c":"Benefício Da Espécie","n":"Corpo Assustador","d":"Os gigantes naturalmente impõem suas presenças àqueles ao seu redor. Recebem +2 em Testes de Atributo de Presença (Intimidação)."},
    {"s":"Gigantes","c":"Dificuldade Da Espécie","n":"Necessidades Gigantescas","d":"O corpo colossal dos gigantes gera a necessidade de recursos igualmente grandes. O gigante precisa de uma quantidade de alimento e líquido 5 vezes maior que a de um humano (o suficiente para mantê-lo alimentado, mas não para saciar sua fome de verdade) e ocupa o espaço de 20 tripulantes em um navio."},
    {"s":"Humanos","c":"Benefício Da Espécie","n":"Adaptação","d":"O humano escolhe 3 Perícias para adicionar sua proficiência, à sua escolha, com exceção de “Haki”, “Sobrenatural” e “Sorte”."},
    {"s":"Humanos","c":"Dificuldade Da Espécie","n":"Aspectos Humanos","d":"A humanidade é imensa e plural, sendo capazes de inúmeros feitos, mas também incontáveis defeitos. Você deve escolher uma das seguintes falhas de caráter para o seu personagem:"},
    {"s":"Humanos","c":"Dificuldade Da Espécie","n":"Ganância","d":"Desde que você esteja na frente de um tesouro ou algum tesouro esteja relacionado a algum Teste de Atributo ou Salvaguarda você recebe -2 no Teste."},
    {"s":"Humanos","c":"Dificuldade Da Espécie","n":"Gula","d":"É necessário o dobro de comida e água para você não sofrer as consequências de falta de alimentação."},
    {"s":"Humanos","c":"Dificuldade Da Espécie","n":"Inveja","d":"Quando uma ou mais criaturas são bem-sucedidas em um Teste de Atributo ou Salvaguarda que você falhou, durante a mesma rodada, você recebe -2 no seu próximo Teste de Atributo, até o final do dia."},
    {"s":"Humanos","c":"Dificuldade Da Espécie","n":"Ira","d":"Você falha automaticamente em qualquer Salvaguarda contra Provocação."},
    {"s":"Humanos","c":"Dificuldade Da Espécie","n":"Luxúria","d":"Criaturas do sexo que o seu personagem sinta atração recebem +2 em Testes Resistidos contra você."},
    {"s":"Humanos","c":"Dificuldade Da Espécie","n":"Preguiça","d":"Você leva o dobro do tempo para terminar um descanso curto e recebe o dobro de Níveis de Exaustão, por não realizar um descanso longo."},
    {"s":"Humanos","c":"Dificuldade Da Espécie","n":"Orgulho","d":"Você recebe -1 em Testes de Atributo de Presença."},
    {"s":"Humanos","c":"Dificuldade Da Espécie","n":"Regra Opcional","d":"Alternativamente, você pode escolher receber apenas uma perícia do Benefício da Espécie “Adaptação” e não receber a Dificuldade da Espécie “Aspectos Humanos”."},
    {"s":"Humanos","c":"Humanos Comuns","n":"Benefício da Espécie (Aptidão Natural)","d":"Você escolhe uma perícia na qual possa usar o seu bônus de proficiência e dobra o seu bônus de proficiência. HUMANOZARRÕES ------------------------------___---------------------------------------------------------------------- São humanas comuns que possuem corpos que atingem proporções absurdas. Existem casos de humanozarrões com mais de 8 metros, o que pode chegar a assustar até os pais, se tiverem uma estatura comum."},
    {"s":"Humanos","c":"Humanos Comuns","n":"Benefício da Espécie (Colosso)","d":"Seu tamanho aumenta para Grande e você recebe +2 em Salvaguardas de Força."},
    {"s":"Humanos","c":"Tribo Braços Longos","n":"Benefício da Espécie (Braços Especiais)","d":"Recebe alcance de 3 metros em jogadas de ataque corpo a corpo, quando utilizando os braços e recebem +2 Em Testes de Atributo de Destreza (Prestidigitação). 22"},
    {"s":"Humanos","c":"Tribo Kujas","n":"Cobra Companheira","d":"Toda kuja recebe em seu nascimento uma cobra para acompanhá-la por toda sua vida. Você escolhe o nome da cobra e ela entende tudo que você falar, podendo realizar pequenas tarefas, como trazer uma toalha para o seu banho, por exemplo. Ela não recebe dano de nenhuma jogada de ataque ou Salvaguarda que não tenha ela explicitamente como alvo do atacante. Ela é totalmente obediente a você e renunciaria até a própria vida se ordenada. Quando em combate, a cobra age no mesmo turno que você. Essa cobra tem as características presentes na ficha abaixo “Cobra Bélica”."},
    {"s":"Humanos","c":"Tribo Kujas","n":"Cobra Bélica Nível de Desafio","d":"1 Experiência: 200"},
    {"s":"Humanos","c":"Tribo Kujas","n":"Classe de Resistência","d":"15"},
    {"s":"Humanos","c":"Tribo Kujas","n":"Pontos de Vida","d":"39 (7d8+7)"},
    {"s":"Humanos","c":"Tribo Kujas","n":"Deslocamento","d":"9 metros"},
    {"s":"Humanos","c":"Tribo Kujas","n":"Bônus de Proficiência","d":"+2"},
    {"s":"Humanos","c":"Tribo Kujas","n":"Tamanho","d":"1,5 metro (Pequeno) FOR 11 (0) DES 20 (+5) CON 13 (+1) SAB 10 (0) PRE 10 (0) VON 10 (0) Características"},
    {"s":"Humanos","c":"Tribo Kujas","n":"Classificação","d":"Tipo B, Comum."},
    {"s":"Humanos","c":"Tribo Kujas","n":"Invulnerabilidade à Condição","d":"Envenenado."},
    {"s":"Humanos","c":"Tribo Kujas","n":"Perícia","d":"Furtividade +7."},
    {"s":"Humanos","c":"Tribo Kujas","n":"Salvaguarda","d":"Destreza +7."},
    {"s":"Humanos","c":"Tribo Kujas","n":"Aspectos Agarrador","d":"A cobra bélica tem vantagem nas jogadas de ataque contra qualquer criatura agarrada por ela. Ações"},
    {"s":"Humanos","c":"Tribo Kujas","n":"Picada","d":"Ataque Corpo a corpo: +7 para atingir, alcance 1,5 metro, um alvo."},
    {"s":"Humanos","c":"Tribo Kujas","n":"Acerto","d":"10 (2d4+5) de dano de Veneno"},
    {"s":"Humanos","c":"Tribo Kujas","n":"Efeito","d":"O alvo deve ser bem-sucedido em uma Salvaguarda de Constituição CD 16 ou receberá a condição “Envenenado” por 1 minuto. Até a duração do veneno acabar, o alvo receberá 1d4 no final de cada um de seus turnos. O alvo pode repetir a Salvaguarda no final de cada um dos turnos dele, terminando o envenenamento sobre si com um sucesso e não sofrendo mais os seus efeitos, durante as próximas 24 horas, após o sucesso."},
    {"s":"Humanos","c":"Usando Sua Cobra","n":"Arco de Cobra","d":"As kujas comandam suas cobras para assumir o formato de um arco e podem usar flechas para realizar uma jogada de ataque à distância com arma, recebendo os seguintes benefícios: Pode ser adicionado o bônus de proficiência em suas jogadas de ataque; O modificador da jogada de ataque e de dano pode ser alterado para o seu atributo primário; As jogadas de ataque e de dano recebem +2."},
    {"s":"Humanos","c":"Usando Sua Cobra","n":"Restringir","d":"As kujas podem comandar suas cobras para se prenderem nos membros de uma criatura Grande ou menor e se tornarem algemas tão duras quanto o aço, a criatura fica com a condição “Incapacitado” ou com a condição “Agarrado” e pode tentar encerrar as condições com uma Salvaguarda de Força CD 16, no início de cada um dos seus turnos. Para isso, a cobra deve acertar uma jogada de ataque corpo a corpo e substituir o dano por essa característica e, até que encerre o agarramento, fica com a condição “Impedido”."},
    {"s":"Humanos","c":"Tribo Pernas Longas","n":"Benefício da Espécie (Pernas Especiais)","d":"Alcance de 3 metros em jogadas de ataque corpo a corpo, quando utilizando as pernas e seu deslocamento normal se torna 12 metros. 23"},
    {"s":"Humanos","c":"Tribo Pescoço De Cobra","n":"Benefício da Espécie (Pescoço Esticado)","d":"Alcance de 3 metros em jogadas de ataque corpo a corpo, quando utilizando a cabeça e +2 em Testes de Atributo de Vontade (Percepção) que dependam da visão. TRIBO DOS 3 OLHOS ------------------------------------------------------------------------------------------------------ Como o nome sugere, os membros da Tribo dos Três Olhos possuem um 3º olho em suas testas, além dos dois olhos comuns dos humanos. É dito que são capazes de alcançar o “verdadeiro despertar” com seu terceiro olho, que supostamente vem com a capacidade de ouvir a “Voz de Todas as Coisas”."},
    {"s":"Humanos","c":"Tribo Pescoço De Cobra","n":"Benefício da Espécie (Abrir os Olhos)","d":"O uso do terceiro olho possui uma conexão mística com o destino. Como resultado, você recebe proficiência em Testes de Atributo de Vontade – Escolha entre Haki, Sobrenatural ou Sorte."},
    {"s":"Lunarianos","c":"Benefício Da Espécie","n":"Heat","d":"Uma vez por rodada, usando uma ação bônus, o lunariano pode adicionar 1d10 de dano de Fogo em uma jogada de ataque (comum ou de Técnica). Essa característica pode ser usada uma quantidade de vezes igual ao seu nível de personagem e você recupera todos os seus usos ao término de um descanso longo. Alternativamente, você pode usar essa característica de forma conjunta com a sua jogada de ataque ou técnica, sem necessidade de uma ação bônus. Essa forma alternativa pode ser usada até 5 vezes, respeitado o uso limitado pelo seu nível de personagem e você recupera todos os seus usos ao término de um descanso longo. Por exemplo, se você tiver 10 usos disponíveis e optar por usar a forma alternativa 5 vezes, ainda terá 5 usos restantes para o uso padrão com ação bônus. Só é possível usar o Heat uma vez por rodada, independentemente de ter sido utilizado na forma padrão ou na alternativa. Essa limitação também se aplica a características semelhantes, como o Benefício da Espécie “Electro” dos Minks ou a Manifestação de Poder Especial “Potencializador Ofensivo” da Akuma no Mi."},
    {"s":"Lunarianos","c":"Benefício Da Espécie","n":"Manipulação do Fogo","d":"Enquanto o fogo nas suas costas se mantém, você pode exercer os seguintes benefícios com as chamas: Recebe resistência a dano de fogo; Seu corpo ilumina até 6 metros com luz direta e mais 3 metros com penumbra; Você pode usar sua ação para manipular uma esfera de fogo, movendo-a para qualquer lugar a até 6 metros de você, que emite a mesma luz que você. Essa esfera se apaga ao encostar em criaturas, causando 1d4 de dano de Fogo ou ao encostar em objetos, causando combustão em objetos inflamáveis."},
    {"s":"Lunarianos","c":"Dificuldade Da Espécie","n":"Cabeça à Prêmio","d":"O Governo Mundial busca capturar ou exterminar qualquer membro da Espécie lunariana, estando dispostos a recompensar com fortunas qualquer pessoa que possa lhes conceder mesmo pistas do paradeiro de um. Portanto, se você mostrar sua aparência em público, o Narrador deve jogar 1d12, em um valor 6 ou menor, em algum momento do dia seguinte, irá surgir um grupo do Governo Mundial ou Marinha para te capturar."},
    {"s":"Mestiços","c":"Benefício Da Espécie","n":"Dois Mundos","d":"De acordo com as Espécies que o seu personagem pertença, você pode escolher receber uma dentre as características “Ancestralidade” ou “Traço Cultural”, ambas descritas mais abaixo. Caso as duas Espécies de origem tenham a mesma característica, você não pode escolher uma diferente, mantendo a mesma das Espécies de origem."},
    {"s":"Mestiços","c":"Benefício Da Espécie","n":"Miscigenação","d":"Você escolhe 1 “Benefício da Espécie” de cada uma das 2 Espécies a que o seu personagem pertença. Os benefícios das “Variantes da Espécie” também contam como a escolha dessa característica."},
    {"s":"Minks","c":"Benefício Da Espécie","n":"Electro","d":"Uma vez por rodada, usando uma ação bônus, o mink pode adicionar 1d10 de dano Elétrico em uma jogada de ataque (comum ou de Técnica). Essa característica pode ser usada uma quantidade de vezes igual ao seu nível de personagem e você recupera todos os seus usos ao término de um descanso longo. Alternativamente, você pode usar essa característica de forma conjunta com a sua jogada de ataque ou técnica, sem necessidade de uma ação bônus. Essa forma alternativa pode ser usada até 5 vezes, respeitado o uso limitado pelo seu nível de personagem e você recupera todos os seus usos ao término de um descanso longo. Por exemplo, se você tiver 10 usos disponíveis e optar por usar a forma alternativa 5 vezes, ainda terá 5 usos restantes para o uso padrão com ação bônus. Só é possível usar o Electro uma vez por rodada, independentemente de ter sido utilizado na forma padrão ou na alternativa. Essa limitação também se aplica a características semelhantes, como o Benefício da Espécie “Heat” dos Lunarianos ou a Manifestação de Poder Especial “Potencializador Ofensivo” da Akuma no Mi."},
    {"s":"Minks","c":"Dificuldade Da Espécie","n":"Instintos Animalescos","d":"Para todo mink existe algum objeto que o faz perder o controle de alguma forma. Por exemplo, um mink coelho, ao ver uma cenoura, se sente impelido a deixar de fazer o que estava fazendo e ir morder a cenoura. Nesses casos, o mink deve fazer uma Salvaguarda de Vontade CD 15 para não sucumbir aos seus instintos e ficar 1d4 turnos “distraído” (condição “Atordoado”), ou até que receba dano."},
    {"s":"Minks","c":"Variante Da Espécie","n":"Benefício da Espécie (Corpo Leve)","d":"Seu deslocamento normal se torna 12 metros e seu deslocamento de escalada se torna 9 metros (caso receba outro deslocamento, prevalece o maior). MEÃOS--------------------------------------------------------------------------- São minks que possuem um corpo médio e proporcional, muito semelhante ao dos humanos comuns, só sendo distinguido pela quantidade de pelo, garras ou chifres. Um mink meão tem um corpo que lhe permite escolher entre ser rápido ou forte."},
    {"s":"Minks","c":"Variante Da Espécie","n":"Benefício da Espécie (Estamina Animal)","d":"Seu deslocamento normal se torna 18 metros (caso receba outro deslocamento, prevalece o maior)."},
    {"s":"Minks","c":"Robustos","n":"Benefício da Espécie (Pisada Firme)","d":"Seu deslocamento normal se torna 12 metros e não pode ser reduzido por terreno difícil (caso receba outro deslocamento, prevalece o maior). 28"},
    {"s":"Povo do Mar","c":"Benefício Da Espécie","n":"Força Superior","d":"O povo do mar se torna proficiente e adiciona mais a metade do bônus de proficiência (arredondado para baixo) em Salvaguardas e Testes de Atributo de Força."},
    {"s":"Povo do Mar","c":"Dificuldade Da Espécie","n":"Criatura do Mar","d":"O povo do mar possui brânquias e pulmões, possibilitando uma respiração em ambientes com água ou ar. As brânquias se fecham em contato com o ar, fazendo com que sufoquem, caso esteja submerso. Porém, precisam de duas vezes mais água que humanos em um dia normal e quatro vezes mais em um dia quente, para não receber/aumentar 1 Nível de Exaustão ao final de cada dia."},
    {"s":"Povo do Mar","c":"Variante Da Espécie","n":"Benefício da Espécie (Corpo Marinho)","d":"De acordo com a criatura do mar que o personagem tenha como ancestral, o homem-peixe pode escolher 1 Traço Comum das Akuma no Mi Zoan (ignorando o requisito de forma original, híbrida ou animal), presentes no Capítulo 6, ou criadas pelo jogador, mas devem ser aprovadas pelo Narrador. SIRENO ----------------------------------- ------------- --------------------------- Os sirenos, sempre possuem as características dos animais marinhos mais acentuadas da cintura para baixo, normalmente não se diferenciando muito de um humano comum em sua parte superior."},
    {"s":"Povo do Mar","c":"Variante Da Espécie","n":"Benefício da Espécie (Natação Superior)","d":"Os sirenos recebem 18 metros de nado e podem usar a ação “Disparada” como ação bônus, enquanto estiverem nadando."}
  ]
};
const BG_DATA = [
  {"n":"Artista","a":"pre","p":"Escolha duas entre Acrobacia, Atuação, História, Persuasão, Prestidigitação, Provocação.","f":[{"n":"Rock Star","d":"Dentro de centros urbanos, é possível se conectar com grupos de artistas, para realizar apresentações (oficiais ou clandestinas). No início de cada dia, desde que use 2 horas do seu tempo com esse objetivo, você pode rolar um Teste de Atributo de Vontade (Sorte), com a CD definida pelo Narrador, para marcar um encontro noturno e se apresentar. Você deve ser bem-sucedido em um Teste de Atributo de Presença (Atuação) CD 15 para receber como cachê 3d10 x 10.000 bellys ou 2d10 x 5.000 bellys, em uma falha. Além disso, adiciona 1.000 bellys para cada nível de personagem que você tiver. O show só acaba no amanhecer do dia seguinte e você sofre os efeitos de um dia sem realizar um descanso longo. Essa característica não poderá ser usada novamente até o término de um descanso longo."}]},
  {"n":"Criminoso","a":"des","p":"Escolha duas entre Enganação, Furtividade, Intimidação e Prestidigitação.","f":[{"n":"Contatos","d":"Dentro de qualquer local frequentada por criminosos, como áreas mais pobres de cidades, prisões, mercados negros e etc. Pelo preço certo, você consegue arrumar contatos para as mais variadas necessidades. Por exemplo, obter informações de difícil acesso, contratar pessoas com habilidades únicas, conseguir documentos falsos, sequestros, assassinatos e muitos outros serviços, desde que você seja bem-sucedido em um Teste de Atributo de Vontade (Sorte), com a CD definida pelo Narrador. Essa característica não poderá ser usada novamente até o término de um descanso longo."}]},
  {"n":"Escravo","a":"con","p":"Escolha duas entre Atletismo, Intuição, Percepção e Sobrevivência.","f":[{"n":"Esperança","d":"Devido ao seu passado difícil, quando deparado com qualquer situação desesperadora, você consegue se manter firme para buscar alguma solução. Você pode pedir ao Narrador uma pista ou ajuda na resolução de qualquer dificuldade, desde que passe em um Teste de Atributo de Vontade (Sorte), com a CD definida pelo Narrador. Essa característica não poderá ser usada novamente até o término de um descanso longo."}]},
  {"n":"Família D.","a":"von","p":"Escolha duas entre Haki, Intimidação, Intuição e Percepção.","f":[{"n":"Vontade Dos D.","d":"O Governo Mundial teme suas ações, por conta disso, seus atos notórios sempre receberam mais atenção que o comum, fazendo com que sua recompensa aumente muito mais que o normal. Além disso, a sua forte determinação cria um laço especial com as pessoas, mesmo sem querer. Ao zarpar de uma ilha, que esteja em gratidão com você, você pode fazer um Teste de Atributo de Vontade (Sorte), com a CD definida pelo Narrador, ao ser bem-sucedido, até 3 habitantes podem querer fazer parte da sua tripulação. Caso o seu personagem morra, o novo personagem criado poderá herdar sua vontade, mantendo características do antigo personagem à sua escolha, como: Pontos de Vida relacionado ao Estilo de Combate (caso escolha um com mesmo tipo de dado de vida), Akuma no Mi, treinamentos, equipamentos, dinheiro e nível. Sendo obrigatório escolher esse antecedente novamente."}]},
  {"n":"Marinheiro","a":"for","p":"Escolha duas entre Acrobacia, Atletismo, Investigação e Sobrevivência.","f":[{"n":"Carteirada","d":"Ao interagir com marinheiros, mesmo sendo uma interação turbulenta, como estar sendo detido, mantido prisioneiro, interrogado ou avistado em alto mar. Você pode fazer um Teste de Atributo de Vontade (Sorte), com a CD definida pelo Narrador, para ver se consegue usar sua antiga influência ou encontrar um antigo conhecido para fazer vista grossa sobre seus crimes ou captura. Essa característica não poderá ser usada novamente até o término de um descanso longo."}]},
  {"n":"Nobre","a":"sab","p":"Escolha duas entre História, Intuição, Investigação,","f":[{"n":"Influência","d":"Ao interagir com outros nobres ou membros da alta sociedade, você pode usar sua influência para conseguir favores como entrada livre em áreas privadas, dinheiro emprestado, pedir que alguém ateste suas palavras ou audiências privadas com outros nobres, desde que você passe em um Teste de Atributo de Vontade (Sorte), com a CD definida pelo Narrador. Essa característica não poderá ser usada novamente até o término de um descanso longo."}]},
  {"n":"Órfão","a":"for","p":"Escolha duas entre Atletismo, Furtividade, Intuição e Sobrevivência.","f":[{"n":"Malandragem","d":"Dentro de centros urbanos, desde que você seja bem-sucedido em um Teste de Atributo de Vontade (Sorte), com a CD definida pelo Narrador, você pode reconhecer os padrões e caminhos secretos típicos, conseguindo encontrar passagens em meio ao tecido urbano que os outros jamais notariam, podendo viajar entre quaisquer dois pontos da cidade, duas vezes mais rápido do que o seu deslocamento permite. Além disso, o mesmo teste pode ser usado para encontrar comida e água para si mesmo e para até cinco outras pessoas uma vez por dia, desde que seja possível."}]},
  {"n":"Político","a":"pre","p":"Escolha duas entre Atuação, Enganação, História, Intuição, Persuasão e Provocação.","f":[{"n":"Discurso","d":"Ao confrontar uma pessoa hostil fora de combate, desde que você seja bem-sucedido em um Teste de Atributo de Vontade (Sorte), com a CD definida pelo Narrador, você pode convence-la a te ajudar. A pessoa se aliará a você por até 24 horas, enquanto os objetivos dela não forem totalmente contrários aos seus. Essa característica não poderá ser usada novamente até o término de um descanso longo."}]},
  {"n":"Revolucionário","a":"des","p":"Escolha duas entre Acrobacia, Atletismo, História e Persuasão.","f":[{"n":"Herói do Povo","d":"Devido seu passado turbulento, sua identidade pode ser facilmente percebida, desta forma, desde que você seja bem\u0002sucedido em um Teste de Atributo de Vontade (Sorte), com a CD definida pelo Narrador, você é capaz de encontrar um lugar para se esconder, descansar ou se recuperar em meio às pessoas que simpatizam com a causa revolucionária, a não ser que tenha se mostrado uma ameaça para eles. Eles o protegerão da lei ou de qualquer outra pessoa que o procure, embora não estejam dispostos a arriscar suas vidas por você."}]},
  {"n":"Sacerdote","a":"sab","p":"Escolha duas entre História, Percepção, Persuasão e Sobrenatural.","f":[{"n":"Fiéis","d":"Ao adentrar em locais povoados, você pode fazer um Teste de Atributo de Vontade (Sorte), com a CD definida pelo Narrador. Sendo bem\u0002sucedido, você pode encontrar até 3 pessoas que já foram ajudadas por você. Eles são plebeus capazes de realizar qualquer tarefa mundana, mas que não lutarão por você, não o seguirão em áreas evidentemente perigosas e o abandonarão se forem ameaçados ou abusados com frequência."}]},
  {"n":"Sobrevivente","a":"von","p":"Escolha duas entre História, Intuição, Percepção e Sobrevivência.","f":[{"n":"Reputação","d":"Quando estiver em qualquer povoado civilizado, você pode fazer um Teste de Atributo de Vontade (Sorte), com a CD definida pelo Narrador, e saber se os locais conhecem o seu passado. Ao ser bem-sucedido no teste, você consegue sair impune a crimes menores, como se recusar a pagar por comida em uma taverna ou arrombar portas de uma loja local, pois a maioria das pessoas terá medo ou pena de relatar a sua atividade às autoridades."}]},
  {"n":"Tenryuubito","a":"con","p":"Escolha duas entre História, Intimidação, Investigação e Natureza.","f":[{"n":"Costas Quentes","d":"Ao interagir com membros do Governo Mundial ou do alto escalão da Marinha, você pode tentar usar suas conexões com os Nobres Mundiais para publicar ou alterar notícias dos jornais, solicitar ataques contra tripulações inimigas (fornecendo as informações necessárias), criar distrações e etc. Desde que seja bem-sucedido em um Teste de Atributo de Vontade (Sorte), com a CD definida pelo Narrador. Essa característica não poderá ser usada novamente até o término de um descanso longo. 5.7 – TREINAMENTO"}]}
];
