/* ---------- modal ---------- */
function modal({ title, body, actions = [{ label: t('close') }], wide, xl, onClose }) {
  const close = () => {
    ovl.remove();
    document.removeEventListener('keydown', esc);
    onClose && onClose();
  };
  const esc = e => {
    if (e.key === 'Escape' && !e.defaultPrevented) {
      e.stopPropagation();
      close();
    }
  };
  const dlg = h(
    'div.dlg' + (wide ? '.wide' : '') + (xl ? '.xl' : ''),
    { role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h(
      'h3',
      h('span', title),
      h(
        'button.btn.ghost.sm.ibtn',
        { onclick: close, 'aria-label': t('close'), style: { color: 'inherit' } },
        '✕'
      )
    ),
    h('div.db', body),
    actions.length
      ? h(
          'div.df',
          actions.map(a =>
            h(
              'button.btn' + (a.primary ? '.primary' : '') + (a.danger ? '.danger' : ''),
              {
                type: 'button',
                onclick: async () => {
                  if (a.onClick) {
                    const r = await a.onClick(close);
                    if (r === false) return;
                  }
                  close();
                },
              },
              a.label
            )
          )
        )
      : null
  );
  const ovl = h(
    'div.ovl',
    {
      onmousedown: e => {
        if (e.target === ovl) close();
      },
    },
    dlg
  );
  document.body.append(ovl);
  document.addEventListener('keydown', esc);
  const first = dlg.querySelector('input,select,textarea');
  if (first && !wide) first.focus();
  return { close, el: dlg };
}
function ask(msg, okLabel) {
  return new Promise(res => {
    let done = false;
    const m = modal({
      title: t('app'),
      body: h('p', { style: { margin: 0 } }, msg),
      actions: [
        {
          label: t('cancel'),
          onClick: () => {
            done = true;
            res(false);
          },
        },
        {
          label: okLabel || t('ok'),
          primary: true,
          onClick: () => {
            done = true;
            res(true);
          },
        },
      ],
      onClose: () => {
        if (!done) res(false);
      },
    });
  });
}
function promptDlg(title, label, value = '') {
  return new Promise(res => {
    let done = false;
    const inp = h('input', { type: 'text', value });
    const m = modal({
      title,
      body: h('label.f', label, inp),
      actions: [
        {
          label: t('cancel'),
          onClick: () => {
            done = true;
            res(null);
          },
        },
        {
          label: t('ok'),
          primary: true,
          onClick: () => {
            done = true;
            res(inp.value);
          },
        },
      ],
      onClose: () => {
        if (!done) res(null);
      },
    });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        done = true;
        res(inp.value);
        m.close();
      }
    });
    inp.select();
  });
}
function pop(anchor, content) {
  document.querySelectorAll('.pop').forEach(p => p.remove());
  const p = h('div.pop', content);
  document.body.append(p);
  const r = anchor.getBoundingClientRect();
  p.style.top = r.bottom + window.scrollY + 6 + 'px';
  p.style.left = Math.max(8, Math.min(window.innerWidth - p.offsetWidth - 8, r.right - p.offsetWidth)) + 'px';
  const off = e => {
    if (!p.contains(e.target) && e.target !== anchor) {
      p.remove();
      document.removeEventListener('mousedown', off);
      document.removeEventListener('keydown', k);
    }
  };
  const k = e => {
    if (e.key === 'Escape') {
      p.remove();
      document.removeEventListener('mousedown', off);
      document.removeEventListener('keydown', k);
    }
  };
  setTimeout(() => {
    document.addEventListener('mousedown', off);
    document.addEventListener('keydown', k);
  }, 0);
  p.close = () => {
    p.remove();
    document.removeEventListener('mousedown', off);
    document.removeEventListener('keydown', k);
  };
  return p;
}

function applyPrefs() {
  const p = Store.data.prefs,
    d = document.documentElement;
  LANG = p.lang === 'en' || p.lang === 'de' ? p.lang : 'pt';
  d.lang = { pt: 'pt-BR', en: 'en', de: 'de' }[LANG];
  let th = p.theme || (App.tpl && App.tpl.theme) || 'carta';
  if (!THEMES.find(x => x.id === th)) th = 'carta';
  d.dataset.theme = th;
  d.dataset.font = p.font || '';
  d.dataset.radius = p.radius || '';
  d.dataset.dens = p.dens || '';
  d.style.setProperty('--fs', (p.size || 15) + 'px');
  if (p.accent) {
    const c = p.accent,
      n = parseInt(c.slice(1), 16),
      L = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    d.style.setProperty('--accent', c);
    d.style.setProperty('--accent-ink', L > 0.6 ? '#111' : '#fff');
    d.style.setProperty(
      '--seal-bg',
      `radial-gradient(circle at 35% 30%, color-mix(in srgb, ${c} 70%, white), ${c} 55%, color-mix(in srgb, ${c} 70%, black))`
    );
    d.style.setProperty('--seal-ink', L > 0.6 ? '#111' : '#fff');
  } else ['--accent', '--accent-ink', '--seal-bg', '--seal-ink'].forEach(k => d.style.removeProperty(k));
}

          .replace(/(\s*·\s*)+$/, '')

        const c = App.rt.get(id),
          m = App.rt.get(id + '_max');

        bar.firstChild.style.width = pct + '%';
        bar.style.setProperty(
          '--c',
          pct <= 25 && src.kind !== 'pp' ? 'var(--bad)' : src.kind === 'pp' ? 'var(--pp)' : 'var(--hp)'
        );
      });
      return h('div.hbar', h('div.row', lab, num), bar);
    });
    const chips = h(
      'div.chips',
      (hd.stats || []).map(s => {
        const val = h('b');
        App.hudBinds.push(() => {
          try {
            val.textContent = App.rt.fmt(App.rt.evalF(s.f), s.fmt || 'num');
          } catch (e) {}
        });
        return h('div.chip', h('small', tr(s.label)), val);
      })
    );
    stick.append(h('div#hud', av, who, bars, h('div.sp'), chips));
  }
  const tabs = h(
    'div#tabs',
    { role: 'tablist' },
    App.tpl.tabs.map(tb =>
      h(
        'button.tab',
        {
          role: 'tab',
          'aria-selected': String(tb.id === App.tab),
          onclick: () => {
            App.tab = tb.id;
            App.ch.tab = tb.id;
            saveSoon();
            renderChar();
          },
        },
        tr(tb.title)
      )
    )
  );
  if (App.edit) tabs.append(...tabEditButtons());
  stick.append(tabs);
  if (App.edit)
    stick.append(
      h(
        'div.ebar',
        h('b', '✎ ' + t('editLayout')),
        h(
          'span',
          LANG === 'pt'
            ? 'Passe o mouse sobre um bloco para editar, mover, redimensionar ou excluir. Arraste pelo cabeçalho para reordenar.'
            : 'Hover a block to edit, move, resize or delete. Drag its header to reorder.'
        ),
        h('div.sp'),
        h('button.btn', { onclick: toggleEdit }, '✓ ' + t('doneEdit'))
      )
    );
  v.append(stick, h('main#main'));
  renderTab();
  App.refresh();
  UI_saved(Store.ok);

function buildDice() {
  const log = h('div#dlog');
  const inp = h('input', { type: 'text', placeholder: t('rollExpr'), style: { flex: 1 }, class: 'in' });
  const go = () => {
    const e = inp.value.trim();
    if (e) Roller.roll(e, e);
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') go();
  });
  const adv = h(
    'div.seg',
    [
      [0, t('normal')],
      [1, t('advantage')],
      [-1, t('disadv')],
    ].map(([v, l]) =>
      h(
        'button',
        {
          type: 'button',
          'aria-pressed': String(Roller.adv === v),
          onclick: e => {
            Roller.adv = v;
            [...e.currentTarget.parentElement.children].forEach(b => b.setAttribute('aria-pressed', 'false'));
            e.currentTarget.setAttribute('aria-pressed', 'true');
          },
        },

      )

    h(
      'div.dh',
      h('span', { style: { flex: 1 } }, '🎲 ' + t('rolls')),

          h('button.btn', { type: 'button', onclick: () => Roller.roll('d' + f, '1d' + f) }, 'd' + f)
        )

      h(
        'div',

        inp,
        h('button.btn.primary', { onclick: go }, t('roll'))

      h('div.lbl.muted', t('history')),

  );
  renderDiceLog();

async function exportBackup() {
  const imgs = {};
  for (const sc of (Store.data.vtt && Store.data.vtt.scenes) || [])
    if (sc.bg && sc.bg.imgId) {
      const r = await DB.get('img', sc.bg.imgId);

    }
  download(
    'forja-backup-' + new Date().toISOString().slice(0, 10) + '.json',

function exportBackupOld() {

    'forja-backup-' + new Date().toISOString().slice(0, 10) + '.json',
    JSON.stringify({ app: 'forja', ver: 1, kind: 'backup', data: Store.data })
  );
}
function registerTpl(tp) {
  const ex = getTpl(tp.id);
  if (!ex) {
    tp.builtin = false;
    tp.imported = true;
    Store.data.systems[tp.id] = tp;
    return tp.id;
  }
  if (hash(JSON.stringify(strip(ex))) === hash(JSON.stringify(strip(tp)))) return tp.id;
  const nid = tp.id + '~' + hash(JSON.stringify(strip(tp))).slice(0, 6);
  if (!getTpl(nid)) {
    tp.id = nid;
    tp.name =
      typeof tp.name === 'object'
        ? { pt: tp.name.pt + ' (importado)', en: (tp.name.en || tp.name.pt) + ' (imported)' }
        : tp.name + ' (importado)';
    tp.builtin = false;
    tp.imported = true;
    Store.data.systems[nid] = tp;
  }
  return nid;
}
function importObj(o, opt = {}) {
  if (!o || o.app !== 'forja') {
    toast(t('badFile'));
    return;
  }
  if (o.kind === 'char' && o.char && o.tpl) {
    const tid = registerTpl(o.tpl);
    const ch = o.char;
    const src = ch.srcId || ch.id;
    ch.srcId = src;
    const old = opt.update ? Object.values(Store.data.chars).find(c => c.srcId === src) : null;
    ch.id = old ? old.id : uid();
    if (old && old.gm) ch.gm = old.gm;
    ch.tplId = tid;
    ch.updated = Date.now();
    ch.v = ch.v || {};
    ch.g = ch.g || {};
    Store.data.chars[ch.id] = ch;
    Store.save();
    if (opt.quiet) return { id: ch.id, updated: !!old, name: ch.name };
    toast(t('imported', ch.name || t('unnamed')));
    openChar(ch.id);
  } else if (o.kind === 'encounter' && Array.isArray(o.npcs)) {
    Store.data.encounters = Store.data.encounters || [];
    Store.data.encounters.push({
      id: uid(),
      name: o.name || 'Encontro',
      npcs: o.npcs.map(n => ({ ...n, id: undefined })),
      sheets: (o.sheets || []).map(x => {
        const tid = registerTpl(x.tpl);
        return { char: { ...x.char, tplId: tid }, tpl: undefined };
      }),
    });
    Store.save();
    if (opt.quiet) return { enc: true, name: o.name };
    toast('Encontro importado: ' + (o.name || ''));
    renderMesa();
  } else if (o.kind === 'system' && o.tpl) {
    const id = registerTpl(o.tpl);
    Store.save();
    toast(t('importedTpl', tr(getTpl(id).name)));
    App.ch ? null : renderHome();
  } else if (o.kind === 'backup' && o.data) {
    Object.assign(Store.data.chars, o.data.chars || {});
    Object.assign(Store.data.systems, o.data.systems || {});
    const have = new Set(Store.data.vtt.scenes.map(x => x.id));
    ((o.data.vtt && o.data.vtt.scenes) || []).forEach(x => {
      if (!have.has(x.id)) Store.data.vtt.scenes.push(x);
    });
    Object.entries(o.images || {}).forEach(([id, d]) =>
      DB.put('img', { id, blob: dataToBlob(d), w: 0, h: 0 })
    );
    Store.save();
    toast(t('saved'));
    goHome();
  } else if (o.kind === 'scene' && o.scene) {
    importScene(o);
  } else if (o.kind === 'scenes' && o.list) {
    importScenes(o);
  } else toast(t('badFile'));
}
async function importFile(f) {
  const n = f.name.toLowerCase();
  if (n.endsWith('.xlsx') || n.endsWith('.xlsm')) return importXlsx(f);
  try {
    importObj(JSON.parse(await f.text()));
  } catch (e) {
    toast(t('badFile'));
  }
}

/* ---------- arrastar arquivo ---------- */
function setupDrop() {
  let n = 0;
  window.addEventListener('dragenter', e => {
    if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) {
      n++;
      document.body.classList.add('drag');
    }
  });
  window.addEventListener('dragleave', () => {
    n = Math.max(0, n - 1);
    if (!n) document.body.classList.remove('drag');
  });
  window.addEventListener('dragover', e => {
    if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault();
  });
  window.addEventListener('drop', e => {
    if (e.dataTransfer && e.dataTransfer.files.length) {
      e.preventDefault();
      n = 0;
      document.body.classList.remove('drag');
      importFile(e.dataTransfer.files[0]);
    }
  });
}

/* ---------- catálogo de técnicas ---------- */
function techCatalog(b) {
  const rt = App.rt,
    L = b.id;
  const norm = x =>
    String(x || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  const names = [...new Set(TECH_DATA.map(x => x.e))];
  const cur = norm(rt.get('estilo'));
  let style = names.find(n => cur && norm(n) === cur) || names[0],
    kind = '',
    q = '';
  const sel = h(
    'select',
    {
      onchange: e => {
        style = e.target.value;
        draw();
      },
    },
    names.map(n => h('option', { value: n, selected: n === style }, n))
  );
  const ksel = h(
    'select',
    {
      onchange: e => {
        kind = e.target.value;
        draw();
      },
    },
    [
      ['', 'Todas'],
      ['Combate', 'Combate'],
      ['Auxiliar', 'Auxiliar'],
    ].map(([v, l]) => h('option', { value: v }, l))
  );
  const search = h('input', {
    type: 'search',
    placeholder: 'Buscar…',
    oninput: e => {
      q = norm(e.target.value);
      draw();
    },
  });
  const list = h('div', {
    style: { display: 'grid', gap: '8px', marginTop: '10px', maxHeight: '55vh', overflow: 'auto' },
  });
  const draw = () => {
    list.replaceChildren();
    TECH_DATA.filter(
      x => x.e === style && (!kind || x.t === kind) && (!q || norm(x.n + ' ' + x.d).includes(q))
    ).forEach(x => {
      const add = () => {
        rt.addRow(L, {
          nome: x.n,
          grau: x.g || 1,
          custo: x.c,
          tipo: x.t,
          duracao: x.du,
          alcance: x.al,
          requisito: x.rq,
          dano: x.da && !/^nenhum/i.test(x.da) ? x.da : '',
          desc: x.d,
        });
        changed();
        App.rerender();
        toast(x.n + ' adicionada');
      };
      list.append(
        h(
          'div.cardi',
          { style: { padding: '8px 10px' } },
          h(
            'div',
            { style: { display: 'flex', gap: '8px', alignItems: 'baseline' } },
            h('b', x.n),
            h(
              'span',
              { style: { opacity: 0.7, fontSize: '.85em' } },
              (x.g ? x.g + 'º grau · ' : '') + x.t + ' · ' + x.c + ' PP' + (x.da ? ' · ' + x.da : '')
            ),
            h('button.btn.sm.primary', { type: 'button', style: { marginLeft: 'auto' }, onclick: add }, '＋')
          ),
          h(
            'div',
            { style: { fontSize: '.85em', opacity: 0.85, marginTop: '4px' } },
            x.d.length > 260 ? x.d.slice(0, 260) + '…' : x.d
          )
        )
      );
    });
    if (!list.children.length) list.append(h('p', 'Nada encontrado.'));
  };
  draw();
  modal({
    title: '📖 Catálogo de técnicas',
    wide: true,
    body: h(
      'div',
      h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } }, sel, ksel, search),
      list
    ),
  });
}

/* ---------- catálogo de singularidades / defeitos / traços de espécie ---------- */
function traitCatalog(b) {
  const rt = App.rt,
    L = b.id,
    k = b.catalog;
  const norm = x =>
    String(x || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  let data = TRAIT_DATA[k],
    q = '',
    sp = '';
  if (k === 'tr') sp = 'Gerais';
  if (k === 'sp') {
    const cur = norm(rt.get('especie')),
      names = [...new Set(data.map(x => x.s))];
    sp = names.find(n => cur && norm(n).startsWith(norm(cur).slice(0, 4))) || names[0];
  }
  const sel =
    k === 'sp' || k === 'tr'
      ? h(
          'select',
          {
            onchange: e => {
              sp = e.target.value;
              draw();
            },
          },
          [...new Set(data.map(x => x.s))].map(n => h('option', { value: n, selected: n === sp }, n))
        )
      : null;
  const search = h('input', {
    type: 'search',
    placeholder: 'Buscar…',
    oninput: e => {
      q = norm(e.target.value);
      draw();
    },
  });
  const list = h('div', {
    style: { display: 'grid', gap: '8px', marginTop: '10px', maxHeight: '55vh', overflow: 'auto' },
  });
  const draw = () => {
    list.replaceChildren();
    data
      .filter(x => (!sp || x.s === sp) && (!q || norm(x.n + ' ' + x.d).includes(q)))
      .forEach(x => {
        const add = () => {
          rt.addRow(
            L,
            k === 'tr' ? { nome: x.n, custo: x.pt, efeito: x.c + '. ' + x.d } : { nome: x.n, efeito: x.d }
          );
          changed();
          App.rerender();
          toast(x.n + ' adicionado');
        };
        list.append(
          h(
            'div.cardi',
            { style: { padding: '8px 10px' } },
            h(
              'div',
              { style: { display: 'flex', gap: '8px', alignItems: 'baseline' } },
              h('b', x.n),
              x.c ? h('span', { style: { opacity: 0.7, fontSize: '.85em' } }, x.c) : null,
              h(
                'button.btn.sm.primary',
                { type: 'button', style: { marginLeft: 'auto' }, onclick: add },
                '＋'
              )
            ),
            h(
              'div',
              { style: { fontSize: '.85em', opacity: 0.85, marginTop: '4px' } },
              x.d.length > 320 ? x.d.slice(0, 320) + '…' : x.d
            )
          )
        );
      });
    if (!list.children.length) list.append(h('p', 'Nada encontrado.'));
  };
  draw();
  modal({
    title: '📖 ' + tr(b.title),
    wide: true,
    body: h('div', h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } }, sel, search), list),
  });
}

/* ---------- catálogo do próprio sistema (Forja Texto) ---------- */
function customCatalog(b) {
  const rt = App.rt,
    L = b.id,
    data = (App.tpl.catalogs || {})[b.catalogRef] || [];
  const norm = x =>
    String(x || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  let q = '';
  const search = h('input', {
    type: 'search',
    placeholder: 'Buscar…',
    oninput: e => {
      q = norm(e.target.value);
      draw();
    },
  });
  const list = h('div', {
    style: { display: 'grid', gap: '8px', marginTop: '10px', maxHeight: '55vh', overflow: 'auto' },
  });
  const labelOf = id => {
    const c = (b.columns || []).find(c => c.id === id);
    return c ? tr(c.label) || id : id;
  };
  const draw = () => {
    list.replaceChildren();
    data
      .filter(e => !q || norm(e.n + ' ' + Object.values(e.d).join(' ')).includes(q))
      .forEach(e => {
        const nameCol =
          (b.columns || []).find(c => c.id === (b.titleField || 'nome')) ||
          (b.columns || []).find(c => c.kind === 'text');
        const long = Object.entries(e.d).filter(
          ([k, v]) => typeof v === 'string' && v.length > 40 && k !== (nameCol && nameCol.id)
        );
        const short = Object.entries(e.d).filter(([k, v]) => !long.some(l => l[0] === k));
        const add = () => {
          const init = { ...e.d };
          if (nameCol) init[nameCol.id] = e.n;
          rt.addRow(L, init);
          changed();
          App.rerender();
          toast(e.n + ' adicionado');
        };
        list.append(
          h(
            'div.cardi',
            { style: { padding: '8px 10px' } },
            h(
              'div',
              { style: { display: 'flex', gap: '8px', alignItems: 'baseline', flexWrap: 'wrap' } },
              h('b', e.n),
              h(
                'span',
                { style: { opacity: 0.7, fontSize: '.85em' } },
                short.map(([k, v]) => labelOf(k) + ': ' + v).join(' · ')
              ),
              h(
                'button.btn.sm.primary',
                { type: 'button', style: { marginLeft: 'auto' }, onclick: add },
                '＋'
              )
            ),
            long.map(([k, v]) =>
              h(
                'div',
                { style: { fontSize: '.85em', opacity: 0.85, marginTop: '4px' } },
                v.length > 280 ? v.slice(0, 280) + '…' : v
              )
            )
          )
        );
      });
    if (!list.children.length) list.append(h('p', 'Nada encontrado.'));
  };
  draw();
  modal({ title: '📖 ' + b.catalogRef, wide: true, body: h('div', search, list) });
}

/* ---------- mesa do mestre ---------- */
const MESA = { turn: -1, round: 1, filter: '' };
const ROLES = {
  pj: ['Jogador', 'var(--good, #2e7d32)'],
  npc: ['NPC', 'var(--accent2, #c9a24b)'],
  inimigo: ['Inimigo', 'var(--bad, #b3322a)'],
};
const CONDS = [
  'Caído',
  'Agarrado',
  'Atordoado',
  'Amedrontado',
  'Cego',
  'Envenenado',
  'Enfurecido',
  'Imobilizado',
  'Incapacitado',
  'Inconsciente',
  'Sonolento',
  'Sangrando',
  'Queimando',
];
function mesaEnts() {
  const gmOf = c => (
    (c.gm = c.gm || { init: null, conds: [], note: '' }),
    (c.gm.role = c.gm.role || 'pj'),
    c.gm
  );
  const chars = Object.values(Store.data.chars).sort((a, b) => {
    const ia = gmOf(a).init,
      ib = gmOf(b).init;
    if (ia != null || ib != null)
      return (ib ?? -999) - (ia ?? -999) || (a.name || '').localeCompare(b.name || '');
    return (a.name || '').localeCompare(b.name || '');
  });
  const npcs = (Store.data.npcs = Store.data.npcs || []);
  const ents = [
    ...chars.map(c => ({ k: 'pc', o: c, init: gmOf(c).init, name: c.name || '' })),
    ...npcs.map(n => ({ k: 'npc', o: n, init: n.init ?? null, name: n.name || '' })),
  ];
  const roleOf = e => (e.k === 'pc' ? gmOf(e.o).role : e.o.role || 'inimigo');
  ents.sort((a, b) =>
    a.init != null || b.init != null
      ? (b.init ?? -999) - (a.init ?? -999) || a.name.localeCompare(b.name)
      : a.k === b.k
        ? a.name.localeCompare(b.name)
        : a.k === 'pc'
          ? -1
          : 1
  );
  return { gmOf, chars, npcs, ents, roleOf };
}
function renderMesa() {
  App.ch = null;
  App.tpl = null;
  App.rt = null;
  App.binds = [];
  App.hudBinds = [];
  Store.data.cur = null;
  Store.save();
  buildTop();
  const v = $('#view');
  v.replaceChildren();
  const { gmOf, chars, npcs, ents, roleOf } = mesaEnts();
  const shown = () => ents.filter(e => !MESA.filter || roleOf(e) === MESA.filter);
  const rollInit = () => {
    npcs.forEach(n => {
      n.init = rnd(20) + (n.bonus || 0);
    });
    chars.forEach(c => {
      const tp = getTpl(c.tplId);
      let b0 = 0;
      if (tp) {
        const rt = new RT(tp, c);
        for (const k of ['iniciativa', 'des_mod', 'agi_mod']) {
          try {
            const x = Formula.num(rt.get(k), true);
            if (isFinite(x) && rt.get(k) !== undefined) {
              b0 = x;
              break;
            }
          } catch (e) {}
        }
      }
      gmOf(c).init = rnd(20) + b0;
    });
    MESA.turn = 0;
    MESA.round = 1;
    Store.save();
    renderMesa();
  };
  const next = () => {
    if (!ents.length) return;
    MESA.turn++;
    if (MESA.turn >= ents.length) {
      MESA.turn = 0;
      MESA.round++;
    }
    renderMesa();
  };
  const pick = () => {
    const i = h('input', {
      type: 'file',
      accept: '.json',
      multiple: true,
      style: { display: 'none' },
      onchange: async () => {
        let n = 0,
          u = 0,
          e2 = 0;
        for (const f of i.files) {
          try {
            const r = importObj(JSON.parse(await f.text()), { update: true, quiet: true });
            if (r) {
              if (r.enc) e2++;
              else {
                n++;
                if (r.updated) u++;
              }
            }
          } catch (e) {}
        }
        i.remove();
        toast(
          n || e2
            ? (n ? n + ' ficha(s) importada(s)' + (u ? ' (' + u + ' atualizada(s))' : '') : '') +
                (e2 ? (n ? ' · ' : '') + e2 + ' encontro(s) importado(s)' : '')
            : t('badFile')
        );
        renderMesa();
      },
    });
    document.body.append(i);
    i.click();
  };
  const restAll = async () => {
    if (!(await ask('Aplicar descanso longo em todas as fichas?', 'Descansar'))) return;
    chars.forEach(c => {

function npcDialog(done) {
  const f = (l, el) => h('label.f', l, el);

    hp = h('input', { type: 'number', value: 20 }),
    def = h('input', { type: 'number', value: 12 }),

  const role = h(
    'select',
    h('option', { value: 'inimigo' }, 'Inimigo'),
    h('option', { value: 'npc' }, 'NPC (aliado ou neutro)')
  );
  const mode = h(
    'select',
    h('option', { value: 'quick' }, 'Rápida (nome, vida, CR e iniciativa)'),
    ...allTpls().map(tp => h('option', { value: tp.id }, 'Ficha completa — ' + tr(tp.name)))
  );
  const quickBox = h(
    'div',
    h('div.row2', f('PV máximo', hp), f('CR (defesa)', def)),
    f('Bônus de iniciativa', bonus)
  );
  mode.addEventListener('change', () => {
    quickBox.style.display = mode.value === 'quick' ? '' : 'none';
  });

    title: '👹 Novo inimigo / NPC',
    body: h(
      'div',
      f('Nome', name),
      h('div.row2', f('Tipo', role), f('Quantidade (cria cópias numeradas)', qty)),
      f('Modelo de ficha', mode),
      quickBox
    ),
    actions: [
      { label: t('cancel') },
      {
        label: 'Criar',
        primary: true,
        onClick: () => {
          const nm = name.value.trim() || (role.value === 'npc' ? 'NPC' : 'Inimigo'),
            q = Math.max(1, Math.min(20, parseInt(qty.value) || 1)),
            mx = Math.max(1, parseInt(hp.value) || 1);
          for (let i = 1; i <= q; i++) {
            const nome = q > 1 ? nm + ' ' + i : nm;
            if (mode.value === 'quick')
              Store.data.npcs.push({
                id: uid(),
                name: nome,
                role: role.value,
                hp: mx,
                max: mx,
                def: parseFloat(def.value) || 10,
                bonus: parseFloat(bonus.value) || 0,
                init: null,
                conds: [],
                note: '',
              });
            else {
              const tp = getTpl(mode.value);
              const ch = {
                id: uid(),
                tplId: tp.id,
                name: nome,
                v: {},
                g: {},
                created: Date.now(),
                updated: Date.now(),
                gm: { role: role.value, init: null, conds: [], note: '' },
              };
              const tf = tp.hud && tp.hud.title;
              if (tf) ch.v[tf] = nome;
              Store.data.chars[ch.id] = ch;
            }
          }
          Store.save();
          done();
        },
      },
    ],
  });
}

/* ---------- teste em grupo ---------- */
function groupRoll(chars) {
  const norm = x =>
    String(x || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .trim();
  const opts = new Map(); // chave -> { label, group }
  const info = c => {
    const tp = getTpl(c.tplId);
    return tp ? { tp, rt: new RT(tp, c) } : null;
  };
  chars.forEach(c => {
    const it = info(c);
    if (!it) return;
    it.tp.tabs.forEach(tb =>
      tb.blocks.forEach(b => {
        if (b.type === 'attrs')
          (b.attrs || []).forEach(a => {
            const k = 'a:' + norm(tr(a.label));
            if (!opts.has(k)) opts.set(k, { label: tr(a.label), group: 'Atributos' });
          });
        if (
          b.type === 'list' &&
          b.rows &&
          (b.columns || []).some(col => col.kind === 'calc' && (col.roll || col.d20))
        )
          b.rows.forEach(r => {
            if (!r.label) return;
            const k = 'l:' + norm(tr(r.label));
            if (!opts.has(k)) opts.set(k, { label: tr(r.label), group: tr(b.title) });
          });
      })
    );
  });
  const modOf = (c, key) => {
    const it = info(c);
    if (!it) return null;
    const name = key.slice(2);
    for (const tb of it.tp.tabs)
      for (const b of tb.blocks) {
        if (key[0] === 'a' && b.type === 'attrs') {
          const a = (b.attrs || []).find(a => norm(tr(a.label)) === name);
          if (a) return Formula.num(it.rt.get(a.id + '_mod'), true);
        }
        if (key[0] === 'l' && b.type === 'list' && b.rows) {
          const tr0 = b.rows.find(r => norm(tr(r.label)) === name);
          if (!tr0) continue;
          const row = it.rt.rows(b.id).find(r => String(r.key) === String(tr0.key)) || tr0;
          const col =
            (b.columns || []).find(c2 => c2.id === 'total') ||
            [...(b.columns || [])].reverse().find(c2 => c2.kind === 'calc');
          if (col) return Formula.num(it.rt.colVal(b.id, row, col), true);
        }
      }
    return null;
  };
  const sel = h(
    'select',
    { style: { minWidth: '220px' } },
    [...new Set([...opts.values()].map(o => o.group))].map(g =>
      h(
        'optgroup',
        { label: g },
        [...opts].filter(([k, o]) => o.group === g).map(([k, o]) => h('option', { value: k }, o.label))
      )
    )
  );
  const cd = h('input', { type: 'number', placeholder: 'CD (opcional)', style: { width: '120px' } });
  const adv = h(
    'select',
    h('option', { value: '0' }, 'Normal'),
    h('option', { value: '1' }, 'Vantagem'),
    h('option', { value: '-1' }, 'Desvantagem')
  );
  const out = h('div', { style: { marginTop: '12px' } });
  const go = () => {
    const key = sel.value;
    if (!key) return;
    const dc = cd.value === '' ? null : parseFloat(cd.value),
      A = parseInt(adv.value);
    const rows = chars
      .map(c => {
        const m = modOf(c, key);
        if (m === null) return null;
        const r1 = rnd(20),
          r2 = rnd(20);
        const r = A === 1 ? Math.max(r1, r2) : A === -1 ? Math.min(r1, r2) : r1;
        return { name: c.name || t('unnamed'), r, r1, r2, m, tot: r + m, role: (c.gm && c.gm.role) || 'pj' };
      })
      .filter(Boolean)
      .sort((a, b) => b.tot - a.tot);
    const lbl = sel.options[sel.selectedIndex].textContent;
    [...rows]
      .reverse()
      .forEach(x =>
        Roller.push({
          title: x.name + ' — ' + lbl + (dc != null ? ' (CD ' + dc + ')' : ''),
          expr: '',
          total: x.tot,
          detail:
            'd20: ' +
            (A ? x.r1 + '/' + x.r2 + ' → ' : '') +
            x.r +
            (x.m ? (x.m > 0 ? ' + ' : ' − ') + Math.abs(x.m) : ''),
          crit: x.r === 20,
          fail: x.r === 1,
          adv: A,
        })
      );
    out.replaceChildren(
      rows.length
        ? h(
            'table',
            { style: { width: '100%', borderCollapse: 'collapse' } },
            h(
              'tr',
              ['Quem', 'Dado', 'Bônus', 'Total', dc != null ? 'Resultado' : ''].map(x =>
                h(
                  'th',
                  { style: { textAlign: 'left', padding: '4px 8px', fontSize: '.8em', opacity: 0.7 } },
                  x
                )
              )
            ),
            rows.map(x =>
              h(
                'tr',
                { style: { borderTop: '1px solid var(--line, #8884)' } },
                h('td', { style: { padding: '4px 8px' } }, x.name),
                h(
                  'td',
                  { style: { padding: '4px 8px' } },
                  (A ? x.r1 + ' / ' + x.r2 + ' → ' : '') + x.r + (x.r === 20 ? ' ★' : x.r === 1 ? ' ✕' : '')
                ),
                h('td', { style: { padding: '4px 8px' } }, (x.m >= 0 ? '+' : '') + x.m),
                h('td', { style: { padding: '4px 8px', fontWeight: 700 } }, x.tot),
                h(
                  'td',
                  {
                    style: {
                      padding: '4px 8px',
                      color: dc == null ? '' : x.tot >= dc ? 'var(--good, #2e7d32)' : 'var(--bad, #c0392b)',
                    },
                  },
                  dc == null ? '' : x.tot >= dc ? '✓ passou' : '✗ falhou'
                )
              )
            )
          )
        : h('p.muted', 'Nenhuma ficha tem esse teste.')
    );
  };
  if (!opts.size) {
    toast('Importe ou crie fichas primeiro.');
    return;
  }
  modal({
    title: '🎯 Teste em grupo',
    wide: true,
    body: h(
      'div',
      h(
        'div',
        { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', alignItems: 'center' } },
        sel,
        adv,
        cd,
        h('button.btn.primary', { type: 'button', onclick: go }, '🎲 Rolar para todos')
      ),
      h(
        'p.muted',
        { style: { fontSize: '.85em' } },
        'Rola um d20 para cada ficha da mesa, somando o bônus da perícia ou atributo escolhido.'
      ),
      out
    ),
  });
}

function printMesa(ents) {
  const root = $('#printroot');
  if (!root) return;
  const rows = ents
    .map((e, i) => {
      if (e.k === 'npc') {
        const n = e.o;
        return [
          i + 1,
          n.name,
          ROLES[n.role || 'inimigo'][0],
          'Ficha rápida',
          'PV ' + n.hp + '/' + n.max,
          'CR ' + (n.def ?? '—'),
          n.init ?? '',
          (n.conds || []).join(', '),
          n.note || '',
        ];
      }
      const c = e.o,
        tp = getTpl(c.tplId);
      if (!tp) return null;
      const rt = new RT(tp, c),
        hd = tp.hud || {};
      const g = c.gm || {};
      const res = (hd.resources || [])
        .map(id => {
          const src = rt.res[id];
          return src
            ? (src.label || id) + ' ' + rt.fmt(rt.get(id), 'num') + '/' + rt.fmt(rt.get(id + '_max'), 'num')
            : '';
        })
        .filter(Boolean)
        .join('  ');
      const st = (hd.stats || [])
        .map(x => {
          let v = '—';
          try {
            v = rt.fmt(rt.evalF(x.f), x.fmt || 'num');
          } catch (er) {}
          return tr(x.label) + ' ' + v;
        })
        .join('  ');
      return [
        i + 1,
        c.name || t('unnamed'),
        ROLES[g.role || 'pj'][0],
        tr(tp.name),
        res,
        st,
        g.init ?? '',
        (g.conds || []).join(', '),
        g.note || '',
      ];
    })
    .filter(Boolean);
  const head = [
    '#',
    'Nome',
    'Papel',
    'Sistema',
    'Recursos',
    'Defesa / destaques',
    'Inic.',
    'Condições',
    'Notas',
  ];
  const cell = (x, th) =>
    h(
      th ? 'th' : 'td',
      {
        style: {
          border: '1px solid #444',
          padding: '4px 6px',
          textAlign: 'left',
          fontSize: '11px',
          verticalAlign: 'top',
        },
      },
      String(x)
    );
  root.replaceChildren(
    h(
      'section.pg',
      h('h2', { style: { margin: '0 0 8px' } }, 'Mesa do mestre — ' + new Date().toLocaleDateString('pt-BR')),
      h(
        'table',
        { style: { width: '100%', borderCollapse: 'collapse' } },
        h(
          'tr',
          head.map(x => cell(x, true))
        ),
        rows.map(r =>
          h(
            'tr',
            r.map(x => cell(x))
          )
        )
      )
    )
  );
  const after = () => {
    root.replaceChildren();
    window.removeEventListener('afterprint', after);
  };
  window.addEventListener('afterprint', after);
  setTimeout(() => window.print(), 50);
}

/* ===== Editor livre de layout + criador de sistemas ===== */
const SPANS = [3, 4, 5, 6, 7, 8, 9, 12];
function reindexRT() {
  App.rt = new RT(App.tpl, App.ch);
}
function commitTpl(rerender = true) {
  if (!App.tpl.builtin) Store.data.systems[App.tpl.id] = App.tpl;
  Store.save();
  reindexRT();
  if (rerender) renderChar();
}
function forkTpl() {
  const c = clone(App.tpl);
  c.id = 'my-' + uid();
  c.builtin = false;
  delete c.imported;
  c.rev = 1;
  c.name =
    typeof c.name === 'object'
      ? {
          pt: tr({ pt: c.name.pt }) + ' (' + STR.pt.copyOf + ')',
          en: (c.name.en || c.name.pt) + ' (' + STR.en.copyOf + ')',
        }
      : c.name + ' (' + t('copyOf') + ')';
  Store.data.systems[c.id] = c;
  App.ch.tplId = c.id;
  App.tpl = c;
  reindexRT();
  Store.save();
}
async function ensureEditable() {
  if (!App.tpl.builtin) return true;
  if (!(await ask(t('forkQ', tr(App.tpl.name) + ' (' + t('copyOf') + ')')))) return false;
  forkTpl();
  return true;
}
async function toggleEdit() {
  if (!App.edit) {
    if (!(await ensureEditable())) return;
    App.edit = true;
  } else App.edit = false;
  document.body.classList.toggle('editing', App.edit);
  renderChar();
}

/* ---------- ferramentas por bloco ---------- */
function moveBlock(tab, i, j) {
  if (j < 0 || j >= tab.blocks.length || i === j) return;
  const [x] = tab.blocks.splice(i, 1);
  tab.blocks.splice(j, 0, x);
  commitTpl();
}
function addEditTools(w, b, i, tab) {
  const btn = (ic, title, fn) =>
    h(
      'button.btn',
      {
        type: 'button',
        title,
        'aria-label': title,
        onclick: e => {
          e.stopPropagation();
          fn();
        },
      },
      ic
    );
  const handle = h(
    'button.btn',
    {
      type: 'button',
      title: LANG === 'pt' ? 'Arrastar' : 'Drag',
      draggable: 'true',
      style: { cursor: 'grab' },
    },
    '⠿'
  );
  handle.addEventListener('dragstart', e => {
    App.dragIdx = i;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', 'blk');
    e.dataTransfer.setDragImage(w, 20, 10);
  });
  const grow = d => {
    const cur = b.span || 12;
    let ix = SPANS.findIndex(s => s >= cur);
    if (ix < 0) ix = SPANS.length - 1;
    ix = Math.max(0, Math.min(SPANS.length - 1, ix + d));
    b.span = SPANS[ix];
    commitTpl();
  };
  w.prepend(
    h(
      'div.etool',
      handle,
      btn('◀', t('moveL'), () => moveBlock(tab, i, i - 1)),
      btn('▶', t('moveR'), () => moveBlock(tab, i, i + 1)),
      btn('−', t('narrower'), () => grow(-1)),
      btn('+', t('wider'), () => grow(1)),
      btn('✎', t('edit'), () => editBlock(tab, i)),
      btn('⎘', t('dup'), () => {
        const c = clone(b);
        c.id = (b.id || 'b') + '_' + uid().slice(-3);
        renameIds(c);
        tab.blocks.splice(i + 1, 0, c);
        commitTpl();
      }),

function enableDrag(grid, tab) {
  [...grid.children].forEach((blk, i) => {
    if (blk.dataset.i === undefined) return;
    blk.addEventListener('dragover', e => {
      if (App.dragIdx !== undefined) {
        e.preventDefault();
        blk.classList.add('dragover');
      }
    });
    blk.addEventListener('dragleave', () => blk.classList.remove('dragover'));
    blk.addEventListener('drop', e => {
      e.preventDefault();
      blk.classList.remove('dragover');
      const from = App.dragIdx;
      App.dragIdx = undefined;
      if (from !== undefined) moveBlock(tab, from, i);
    });
  });
}

function i18nInput(val, set, ph) {
  if (val && typeof val === 'object') {
    const a = h('input', {
      type: 'text',
      value: val.pt ?? '',
      placeholder: 'PT',
      oninput: () => {
        val.pt = a.value;
        set(val);
      },
    });
    const b = h('input', {
      type: 'text',
      value: val.en ?? '',
      placeholder: 'EN',
      oninput: () => {
        val.en = b.value;
        set(val);
      },
    });
    return h('div', { style: { display: 'grid', gap: '2px' } }, a, b);
  }
  return h('input', {
    type: 'text',
    value: val ?? '',
    placeholder: ph || '',
    oninput: e => set(e.target.value),
  });
}
function optsToStr(o) {
  if (o === '@attrs') return '@attrs';
  if (!Array.isArray(o)) return '';
  return o.map(x => (typeof x === 'object' ? x.v + ':' + tr(x.l) : x)).join(', ');
}
function strToOpts(s) {
  s = s.trim();
  if (s === '@attrs') return '@attrs';
  if (!s) return undefined;
  return s
    .split(',')
    .map(x => x.trim())
    .filter(Boolean)
    .map(x => {
      const m = /^(.+?):(.+)$/.exec(x);
      if (m) {
        const n = parseFloat(m[1]);
        return { v: isNaN(n) || String(n) !== m[1].trim() ? m[1].trim() : n, l: m[2].trim() };
      }
      return x;
    });
}
function cellInput(col, row) {
  const v = row[col.k];
  const set = x => {
    if (x === '' || x === undefined) delete row[col.k];
    else row[col.k] = x;
  };
  switch (col.t) {
    case 'i18n':
      return i18nInput(v, x => {
        row[col.k] = x;
      });
    case 'num':
      return h('input', {
        type: 'number',
        value: v ?? '',
        oninput: e => set(e.target.value === '' ? undefined : parseFloat(e.target.value)),
      });
    case 'bool':
      return h('input', {
        type: 'checkbox',
        checked: !!v,
        onchange: e => {
          if (e.target.checked) row[col.k] = true;
          else delete row[col.k];
        },
      });
    case 'sel':
      return h(
        'select',
        { onchange: e => set(e.target.value) },
        col.opts.map(o => h('option', { value: o, selected: (v ?? col.opts[0]) === o }, o))
      );
    case 'opts':
      return h('input', {
        type: 'text',
        value: optsToStr(v),
        placeholder: 'a, b, c  |  1:um, 2:dois  |  @attrs',
        oninput: e => {
          const o = strToOpts(e.target.value);
          if (o === undefined) delete row[col.k];
          else row[col.k] = o;
        },
      });
    case 'extra': {
      const ex = { ...row };
      (col.skip || []).forEach(k => delete ex[k]);
      return h('input', {
        type: 'text',
        value: Object.keys(ex).length ? JSON.stringify(ex) : '',
        placeholder: '{"attr":"for"}',
        oninput: e => {
          Object.keys(row).forEach(k => {
            if (!(col.skip || []).includes(k)) delete row[k];
          });
          try {
            if (e.target.value.trim()) Object.assign(row, JSON.parse(e.target.value));
            e.target.style.borderColor = '';
          } catch (er) {
            e.target.style.borderColor = 'var(--bad)';
          }
        },
      });
    }
    case 'formula':
      return h('input', {
        type: 'text',
        value: v ?? '',
        class: 'mono',
        spellcheck: 'false',
        oninput: e => {
          set(e.target.value);
          try {
            if (e.target.value) Formula.parse(e.target.value, false);
            e.target.style.borderColor = '';
            e.target.title = '';
          } catch (er) {
            e.target.style.borderColor = 'var(--bad)';
            e.target.title = er.message;
          }
        },
      });
    default:
      return h('input', { type: 'text', value: v ?? '', oninput: e => set(e.target.value) });
  }
}

function editBlock(tab, i) {
  const b = tab.blocks[i];
  const draft = clone(b);
  const sc = blockSchema(draft);
  const pt = LANG === 'pt';
  const form = h('div');
  const grid = h('div.row2');
  sc.top.forEach(f => {
    const lab = h('label.f', f.l);
    let inp;
    if (f.t === 'i18n') inp = i18nInput(draft[f.k], x => (draft[f.k] = x));
    else if (f.t === 'num')
      inp = h('input', {
        type: 'number',
        value: draft[f.k] ?? '',
        min: f.min,
        max: f.max,
        oninput: e => {
          if (e.target.value === '') delete draft[f.k];
          else draft[f.k] = parseFloat(e.target.value);
        },
      });
    else if (f.t === 'bool') {
      inp = h('input', {
        type: 'checkbox',
        checked: !!draft[f.k],
        onchange: e => (draft[f.k] = e.target.checked),
        style: { width: 'auto' },
      });
      lab.style.flexDirection = 'row';
      lab.style.alignItems = 'center';
      lab.style.gap = '8px';
      lab.prepend(inp);
      grid.append(lab);
      return;
    } else if (f.t === 'sel')
      inp = h(
        'select',
        { onchange: e => (draft[f.k] = e.target.value) },
        f.opts.map(o => h('option', { value: o, selected: (draft[f.k] ?? f.opts[0]) === o }, o))
      );
    else if (f.t === 'area') {
      inp = h('textarea', { rows: 5, oninput: e => (draft[f.k] = e.target.value) });
      inp.value = typeof draft[f.k] === 'object' ? tr(draft[f.k]) : (draft[f.k] ?? '');
      lab.style.gridColumn = '1 / -1';
    } else if (f.t === 'formula')
      inp = h('input', {
        type: 'text',
        value: draft[f.k] ?? '',
        style: { fontFamily: 'var(--font-mono)' },
        oninput: e => {
          draft[f.k] = e.target.value;
          try {
            Formula.parse(e.target.value, false);
            e.target.style.borderColor = '';
          } catch (er) {
            e.target.style.borderColor = 'var(--bad)';
          }
        },
      });
    else
      inp = h('input', {
        type: 'text',
        value: draft[f.k] ?? '',
        oninput: e => (draft[f.k] = e.target.value),
      });
    lab.append(inp);
    grid.append(lab);
  });
  form.append(grid);
  for (const r of sc.rows) {
    if (!draft[r.key]) {
      if (r.optional) {
        form.append(
          h(
            'div',
            { style: { marginBottom: '10px' } },
            h(
              'button.btn.sm',
              {
                type: 'button',
                onclick: e => {
                  draft[r.key] = [];
                  e.target.parentElement.replaceWith(rowsEditor(r.l, draft[r.key], r.cols, r.mk));
                },
              },
              '＋ ' + r.l
            )
          )
        );
      }
      continue;
    }
    form.append(rowsEditor(r.l, draft[r.key], r.cols, r.mk));
  }
  // JSON avançado
  const ta = h('textarea.code', { spellcheck: 'false' });
  const det = h('details', h('summary', t('adv')), ta);
  det.addEventListener('toggle', () => {
    if (det.open) ta.value = JSON.stringify(draft, null, 2);
  });
  form.append(det);
  const save = () => {
    let out = draft;
    if (det.open && ta.value.trim()) {
      try {
        out = JSON.parse(ta.value);
      } catch (e) {
        toast(t('invalid') + ': ' + e.message);
        return false;
      }
    }
    ['fields', 'columns', 'attrs'].forEach(k => {
      if (out[k])
        out[k].forEach(x => {
          if (x.id) x.id = String(x.id).trim().replace(/\s+/g, '_');
          if (x.kind === 'select' && !x.options) x.options = ['A', 'B'];
          if (x.def === '') delete x.def;
        });
    });
    tab.blocks[i] = out;
    commitTpl();
  };
  modal({
    title: t('edit') + ' — ' + (tr(b.title) || b.type),
    body: form,
    wide: true,
    actions: [{ label: t('cancel') }, { label: t('save'), primary: true, onClick: save }],
  });
}

        primary: true,
        onClick: () => {
          try {
            const o = JSON.parse(ta.value);
            if (!Array.isArray(o.tabs)) throw new Error('tabs[]');
            o.id = App.tpl.id;
            o.builtin = false;
            App.tpl = o;
            commitTpl();
          } catch (e) {
            toast(t('invalid') + ': ' + e.message);
            return false;
          }
        },
      },
    ],
  });
}

/* ===== Forja Texto: linguagem simples (em português) para montar fichas e sistemas =====
   Não é programação: cada linha descreve uma peça da ficha. O compilador transforma o texto
   no mesmo modelo (JSON) que o resto do app usa. */
const FT = (() => {
  const strip = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const KIND = {
    texto: 'text',
    numero: 'number',
    calculo: 'calc',
    marcar: 'check',
    check: 'check',
    area: 'area',
    escolha: 'select',
    rotulo: 'label',
    rolar: 'rollbtn',
  };
  const BLOCKS = new Set([
    'campos',
    'atributos',
    'recurso',
    'tabela',
    'cartoes',
    'notas',
    'aviso',
    'sorteio',
  ]);
  const TOP = new Set([
    'sistema',
    'descricao',
    'icone',
    'tema',
    'titulo',
    'subtitulo',
    'destaque',
    'barras',
    'descanso',
  ]);

  // fórmulas: modde(x) -> val(x&"_mod")
  const fx = f =>
    String(f)
      .replace(
        /nivelpor\(\s*([^,()]+?)\s*,\s*([^()]+?)\)/gi,
        (m0, v, list) =>
          '(1 + ' +
          list
            .split(/\s*,\s*/)
            .map(x => 'if(' + v + ' >= ' + x + ', 1, 0)')
            .join(' + ') +
          ')'
      )
      .replace(/modde\(\s*([^()]+?)\s*\)/gi, 'val($1&"_mod")')
      .replace(/\bvalor\(/gi, 'val(');

  // "1d20+{bonus}" -> '"1d20+" & (bonus)'
  const diceF = t0 => {
    const parts = String(t0).split(/\{([^}]+)\}/);
    return (
      parts
        .map((x, i) => (i % 2 ? '(' + fx(x) + ')' : x ? JSON.stringify(x) : ''))
        .filter(Boolean)
        .join(' & ') || '""'
    );
  };
  // separa "tudo antes do |" e as opções depois dele
  function split(rest, noFlags) {
    const i = rest.indexOf(' |');
    const main = (i < 0 ? rest : rest.slice(0, i)).trim();
    const opts = {};
    if (i >= 0) {
      const o = rest.slice(i + 2).trim();
      // key=value (valor pode ter espaços até a próxima key=) ou flag
      const re = /([\p{L}_]+)(?:=((?:(?!\s[\p{L}_]+=).)*))?/gu;
      let m;
      const words = o.split(/\s+/);
      let cur = null;
      words.forEach(w => {
        if (w === '|') {
          cur = null;
          return;
        }
        const kv = /^([\p{L}_]+)=(.*)$/u.exec(w);
        if (kv) {
          cur = strip(kv[1]);
          opts[cur] = kv[2];
        } else if (cur && opts[cur] !== true && /=/.test(o) && (noFlags || !isFlag(w, opts))) {
          opts[cur] += ' ' + w;
        } else if (cur && noFlags) {
          opts[cur] += ' ' + w;
        } else {
          opts[strip(w)] = true;
          cur = null;
        }
      });
    }
    return { main, opts };
  }
  const FLAGS = new Set([
    'grande',
    'sinal',
    'inteiro',
    'destaque',
    'rolar',
    'manual',
    'temp',
    'sem_gerador',
    'compacto',
    'fixa',
    'poder',
    'vida',
  ]);
  const isFlag = (w, opts) => FLAGS.has(strip(w));

  function compile(src) {
    const errors = [],
      warns = [];
    const err = (n, m) => errors.push({ line: n, msg: m });
    const tpl = {
      id: 'txt-' + uid(),
      rev: 1,
      builtin: false,
      name: 'Meu sistema',
      desc: '',
      icon: '✦',
      theme: 'carta',
      hud: { title: 'nome', sub: '""', resources: [], stats: [] },
      tabs: [],
    };
    const ids = new Set();
    const uniq = base => {
      let id = base || 'campo',
        n = 2;
      while (ids.has(id)) id = base + '_' + n++;
      ids.add(id);
      return id;
    };
    const fieldInfo = {};
    let tab = null,
      blk = null,
      tableKind = null;
    const checkF = (f, n) => {
      if (!f) return f;
      const g = fx(f);
      try {
        Formula.parse(g, false);
      } catch (e) {
        err(n, 'Fórmula inválida "' + f + '": ' + e.message);
      }
      return g;
    };
    const need = n => {
      if (!tab) {
        tab = { id: 'ficha', title: 'Ficha', blocks: [] };
        tpl.tabs.push(tab);
      }
    };
    const lines = String(src).replace(/\r/g, '').split('\n');
    let hudStats = [],
      hudBars = [],
      restore = null;
    const catalogs = {};
    let curCat = null;
    const catRefs = [];
    const num = (v, n, what) => {
      const x = parseFloat(String(v).replace(',', '.'));
      if (isNaN(x)) {
        err(n, what + ' precisa ser um número (recebi "' + v + '")');
        return undefined;
      }
      return x;
    };

    function fieldOf(kindWord, rest, n, inTable, scope) {
      const kind = KIND[strip(kindWord)];
      if (!kind) return null;
      const { main, opts } = split(rest);
      let label = main,
        def,
        formula,
        options;
      if (kind === 'calc') {
        const m = /^(.*?)\s*=\s*(.*)$/.exec(main);
        if (m) {
          label = m[1].trim();
          formula = m[2].trim();
        } else {
          err(n, 'cálculo precisa de "=" e uma fórmula. Ex.: calculo Total = a + b');
          formula = '0';
        }
      } else if (kind === 'select') {
        const m = /^(.*?)\s*:\s*(.*)$/.exec(main);
        if (m) {
          label = m[1].trim();
          options = m[2].trim();
        } else err(n, 'escolha precisa das opções depois de ":". Ex.: escolha Alinhamento: Bom, Neutro, Mau');
      } else {
        const m = /^(.*?)\s*=\s*(.*)$/.exec(main);
        if (m) {
          label = m[1].trim();
          def = m[2].trim();
        }
      }
      if (!label) {
        err(n, 'faltou o nome (rótulo) do campo');
        label = 'Campo';
      }
      const base = opts.id ? slug(opts.id) : slug(label);
      let fid = base;
      if (inTable) {
        let k = 2;
        while (scope.has(fid)) fid = base + '_' + k++;
        scope.add(fid);
      } else fid = uniq(base);
      const f = { id: fid, kind, label };
      if (inTable) {
        f.w = opts.px ? opts.px + 'px' : (opts.peso || '1') + 'fr';
        if (opts.compacto) f.compact = true;
      } else
        f.span = opts.largura
          ? Math.max(1, Math.min(12, parseInt(opts.largura) || 4))
          : kind === 'area'
            ? 12
            : 4;
      if (kind === 'number') {
        if (def !== undefined) {
          const d = num(def, n, 'o valor padrão');
          if (d !== undefined) f.def = d;
        }
        if (opts.min !== undefined) f.min = num(opts.min, n, 'min');
        if (opts.max !== undefined) f.max = num(opts.max, n, 'max');
      }
      if (kind === 'text' && def !== undefined) f.def = def;
      if (kind === 'check' && def) f.def = /^(sim|1|true)$/i.test(def);
      if (kind === 'area') f.rows = opts.linhas ? parseInt(opts.linhas) || 4 : 4;
      if (kind === 'select') {
        f.options = /^@atributos$/i.test(options || '')
          ? '@attrs'
          : (options || '').split(/\s*,\s*/).filter(Boolean);
        if (f.options !== '@attrs' && !f.options.length) err(n, 'escolha sem opções');
        f.blank = true;
      }
      if (kind === 'calc') {
        f.formula = checkF(formula, n);
        if (opts.manual) f.override = true;
        f.fmt = opts.sinal ? 'signed' : opts.inteiro ? 'int' : opts.texto ? 'text' : 'num';
        if (opts.destaque) f.tile = true;
        if (opts.rolar) {
          f.roll = true;
          f.d20 = true;
        }
      }
      if (kind === 'rollbtn') {
        f.expr = diceF(opts.rola || '1d20');
        f.title = label;
        f.icon = opts.icone || '🎲';
        f.w = '44px';
        if (/^\s*(1)?d20/i.test(opts.rola || '1d20')) f.d20 = true;
        try {
          Formula.parse(f.expr, false);
        } catch (e) {
          err(n, 'rola= inválido: ' + e.message);
        }
      }
      if (opts.grande) f.big = true;
      if (opts.dica) f.hint = opts.dica;
      if (!inTable) fieldInfo[f.id] = { label, fmt: f.fmt };
      return f;
    }

    lines.forEach((raw, i) => {
      const n = i + 1;
      let s = raw.replace(/\s+#.*$/, '').trim();
      if (!s || s.startsWith('#')) return;
      const m = /^([\p{L}_]+)(?:\s*:\s*|\s+)(.*)$/u.exec(s) || [s, s, ''];
      const kw = strip(m[1]),
        rest = (m[2] || '').trim();
      const hasColon = /^[\p{L}_]+\s*:/u.test(s);
      // ---- diretivas do sistema
      if (TOP.has(kw) && hasColon) {
        if (kw === 'sistema') tpl.name = rest || tpl.name;
        else if (kw === 'descricao') tpl.desc = rest;
        else if (kw === 'icone') tpl.icon = rest || tpl.icon;
        else if (kw === 'tema') {
          const th = THEMES.find(t => t.id === strip(rest) || strip(t.pt) === strip(rest));
          if (th) tpl.theme = th.id;
          else err(n, 'tema desconhecido "' + rest + '". Temas: ' + THEMES.map(t => t.id).join(', '));
        } else if (kw === 'titulo') tpl.hud.title = slug(rest);
        else if (kw === 'subtitulo') tpl.hud.sub = checkF(rest, n);
        else if (kw === 'destaque')
          hudStats = rest
            .split(/\s*,\s*/)
            .filter(Boolean)
            .map(slug);
        else if (kw === 'barras')
          hudBars = rest
            .split(/\s*,\s*/)
            .filter(Boolean)
            .map(slug);
        else if (kw === 'descanso')
          restore = rest
            .replace(/^restaurar\s*/i, '')
            .split(/\s*,\s*/)
            .filter(Boolean)
            .map(slug);
        return;
      }
      if (kw === 'catalogo' && hasColon) {
        curCat = rest.trim();
        if (!curCat) err(n, 'catalogo: precisa de um nome. Ex.: catalogo: Magias');
        else catalogs[curCat] = catalogs[curCat] || [];
        blk = null;
        return;
      }
      if (kw === 'entrada' && curCat !== null && !blk) {
        const { main, opts } = split(rest, true);
        if (!main) {
          err(n, 'entrada sem nome');
          return;
        }
        const d = {};
        Object.entries(opts).forEach(([k, v]) => {
          d[k] =
            v === true ? true : /^-?\d+([.,]\d+)?$/.test(v) ? parseFloat(String(v).replace(',', '.')) : v;
        });
        catalogs[curCat].push({ n: main, d });
        return;
      }
      if (kw === 'aba' && hasColon) {
        curCat = null;
        tab = { id: uniq('aba_' + slug(rest || 'aba')), title: rest || 'Aba', blocks: [] };
        tpl.tabs.push(tab);
        blk = null;
        return;
      }
      if (BLOCKS.has(kw) && hasColon) {
        need();
        curCat = null;
        const { main, opts } = split(rest);
        const title = main;
        const span = opts.largura ? Math.max(1, Math.min(12, parseInt(opts.largura) || 12)) : 12;
        if (kw === 'campos')
          blk = {
            type: 'fields',
            id: uniq(opts.id ? slug(opts.id) : slug(title || 'campos')),
            span,
            cols: 12,
            title: title || undefined,
            fields: [],
          };
        else if (kw === 'atributos')
          blk = {
            type: 'attrs',
            id: uniq(opts.id ? slug(opts.id) : 'atributos'),
            span: opts.largura ? span : 5,
            title: title || 'Atributos',
            attrs: [],
            mod: fx(opts.modificador || 'floor((v-10)/2)'),
            generator: !opts.sem_gerador,
            rollLabel: 'Teste de',
          };
        if (opts.padrao !== undefined) blk.def = parseFloat(opts.padrao) || 0;
        else if (kw === 'recurso') {
          const id = uniq(opts.id ? slug(opts.id) : slug(title || 'recurso'));
          blk = {
            type: 'resource',
            id,
            span: opts.largura ? span : 6,
            title: title || 'Recurso',
            label: opts.sigla || title || 'R',
            kind: opts.poder ? 'pp' : 'hp',
            max: checkF(opts.max || '10', n),
            temp: !!opts.temp,
            manualMax: true,
          };
          if (opts.max === undefined) warns.push({ line: n, msg: 'recurso sem max=. Usei 10.' });
        } else if (kw === 'tabela' || kw === 'cartoes') {
          tableKind = kw;
          blk = {
            type: 'list',
            id: uniq(opts.id ? slug(opts.id) : slug(title || 'lista')),
            span,
            title: title || 'Lista',
            columns: [],
            addLabel: opts.botao || 'Novo',
            _rows: [],
            _scope: new Set(),
          };
          if (kw === 'cartoes') {
            blk.display = 'cards';
            blk.cols = parseInt(opts.colunas) || 2;
          }
          if (opts.divisao) blk.split = parseInt(opts.divisao) || 1;
          if (opts.catalogo) {
            blk._cat = opts.catalogo.trim();
            catRefs.push([n, blk._cat]);
          }
          if (opts.soma) blk._soma = slug(opts.soma);
        } else if (kw === 'notas')
          blk = {
            type: 'fields',
            id: uniq(opts.id ? slug(opts.id) : slug(title || 'notas')),
            span,
            title: title || 'Notas',
            fields: [
              {
                id: uniq(slug(title || 'notas') + '_txt'),
                kind: 'area',
                label: '',
                span: 12,
                rows: parseInt(opts.linhas) || 8,
              },
            ],
          };
        else if (kw === 'sorteio')
          blk = {
            type: 'random',
            id: uniq(opts.id ? slug(opts.id) : slug(title || 'sorteio')),
            span: opts.largura ? span : 6,
            title: title || 'Sorteio',
            dice: opts.dado || '',
            button: opts.botao || undefined,
            entries: [],
          };
        else if (kw === 'aviso')
          blk = { type: 'note', id: uniq(slug(title || 'aviso')), span, title: title || undefined, text: '' };
        tab.blocks.push(blk);
        return;
      }
      if (!blk) {
        err(
          n,
          'linha fora de um bloco: "' + s + '". Comece com "aba:" e um bloco (ex.: "campos: Identidade").'
        );
        return;
      }
      // ---- itens do bloco corrente
      if (blk.type === 'fields') {
        if (blk.fields.length === 1 && blk.fields[0].label === '') {
          err(n, 'notas: não aceita campos. Use "campos:"');
          return;
        }
        const f = fieldOf(m[1], rest, n, false);
        if (!f) err(n, 'não entendi "' + m[1] + '". Tipos: texto, numero, calculo, marcar, area, escolha');
        else blk.fields.push(f);
      } else if (blk.type === 'attrs') {
        const w = s.split(/\s+/);
        const abbr = w[0];
        const label = w.slice(1).join(' ') || abbr;
        blk.attrs.push({ id: uniq(slug(abbr)), abbr, label });
      } else if (blk.type === 'random') {
        const mm = /^(\d+)(?:\s*-\s*(\d+))?\s*:\s*(.+)$/.exec(s);
        if (mm) {
          if (!blk.dice) {
            err(n, 'use dado=d6 (ou d20…) no cabeçalho do sorteio para usar faixas como "1-3: texto"');
            return;
          }
          blk.entries.push({ from: +mm[1], to: mm[2] ? +mm[2] : +mm[1], text: mm[3].trim() });
        } else blk.entries.push({ from: blk.entries.length + 1, to: blk.entries.length + 1, text: s });
      } else if (blk.type === 'note') {
        blk.text += (blk.text ? '\n' : '') + s;
      } else if (blk.type === 'resource') {
        err(n, 'recurso não tem itens; coloque tudo na mesma linha (ex.: recurso: Vida | sigla=PV max=10)');
      } else if (blk.type === 'list') {
        if (kw === 'coluna') {
          const m2 = /^([\p{L}_]+)\s+(.*)$/u.exec(rest);
          if (!m2) {
            err(n, 'coluna precisa de tipo e nome. Ex.: coluna texto Nome');
            return;
          }
          const c = fieldOf(m2[1], m2[2], n, true, blk._scope);
          if (!c) err(n, 'tipo de coluna desconhecido "' + m2[1] + '"');
          else {
            if (tableKind === 'cartoes') {
              c.span = c.span || 6;
              delete c.w;
            }
            blk.columns.push(c);
          }
        } else if (kw === 'linha') {
          const { main, opts } = split(rest);
          const row = { key: slug(main), label: main };
          Object.entries(opts).forEach(([k, v]) => {
            row[k] = v === true ? true : /^-?\d+(\.\d+)?$/.test(v) ? parseFloat(v) : v;
          });
          blk._rows.push(row);
        } else if (kw === 'acao') {
          if (tableKind !== 'cartoes') {
            err(n, '"acao:" só vale em cartoes. Em tabela use "coluna rolar Nome | rola=1d20+{bonus}"');
            return;
          }
          const { main: lab, opts: o } = split(rest, true);
          const a = { label: lab || 'Usar' };
          if (o.gasta) {
            const [res, cost] = String(o.gasta).split(':');
            if (!res || !cost) err(n, 'gasta= precisa de recurso:coluna. Ex.: gasta=energia:custo');
            else a.spend = { res: slug(res), cost: fx(cost.trim()) };
          }
          if (o.rola) {
            a.roll = diceF(o.rola);
            try {
              Formula.parse(a.roll, false);
            } catch (e) {
              err(n, 'rola= inválido: ' + e.message);
            }
            if (/^\s*(1)?d20/i.test(o.rola)) a.d20 = true;
          }
          if (o.titulo) a.title = slug(o.titulo);
          if (o.sobrecarga) {
            const [fld, amt, max] = String(o.sobrecarga).split(':');
            a.overload = { field: slug(fld), amount: fx(amt || '1'), max: parseInt(max) || 5 };
          }
          (blk.actions = blk.actions || []).push(a);
          blk._acts = true;
        } else if (kw === 'soma') {
          blk._soma = slug(rest);
        } else err(n, 'em tabela/cartões use "coluna ..." ou "linha ..."');
      }
    });
    // pós-processamento
    if (!tpl.tabs.length) err(1, 'a ficha está vazia. Comece com "aba: Ficha".');
    tpl.tabs.forEach(tb =>
      tb.blocks.forEach(b => {
        if (b.type === 'random') {
          if (!b.entries.length) err(0, 'o sorteio "' + b.title + '" está vazio');
          const f = parseInt(String(b.dice).replace(/\D/g, '')) || 0;
          if (f && b.entries.some(e => e.to > f))
            warns.push({ line: 0, msg: 'sorteio "' + b.title + '": há faixas acima de d' + f });
          if (f) {
            const cov = new Set();
            b.entries.forEach(e => {
              for (let k = e.from; k <= e.to; k++) cov.add(k);
            });
            const miss = [];
            for (let k = 1; k <= f; k++) if (!cov.has(k)) miss.push(k);
            if (miss.length)
              warns.push({
                line: 0,
                msg: 'sorteio "' + b.title + '": faltou cobrir ' + miss.slice(0, 6).join(', '),
              });
          }
        }
        if (b.type === 'attrs' && !b.attrs.length)
          err(0, 'bloco de atributos "' + b.title + '" sem atributos (use linhas como "FOR Força")');
        if (b.type === 'list') {
          if (!b.columns.length)
            err(0, 'a lista "' + b.title + '" não tem colunas (use "coluna texto Nome")');
          if (b._rows.length) {
            b.rows = b._rows.map(r => {
              const o = {};
              Object.entries(r).forEach(([k, v]) => {
                o[k] = v;
              });
              return o;
            });
            b.rows.forEach(r => {
              b.columns.forEach(c => {
                if (c.kind === 'label') r.label = r.label;
              });
            });
          }
          if (b._soma) b.totals = { [b._soma]: 'sum' };
          delete b._rows;
          delete b._soma;
          delete b._scope;
          if (b.display === 'cards') {
            const tf = b.columns.find(c => c.kind === 'text');
            b.titleField = tf ? tf.id : b.columns[0] && b.columns[0].id;
            b.min = 0;
          }
        }
      })
    );
    // catálogos
    Object.keys(catalogs).forEach(k => {
      if (!catalogs[k].length) warns.push({ line: 0, msg: 'o catálogo "' + k + '" está vazio' });
    });
    tpl.tabs.forEach(tb =>
      tb.blocks.forEach(b => {
        if (b._cat) {
          if (!catalogs[b._cat])
            err(
              0,
              'a lista "' +
                b.title +
                '" usa catalogo=' +
                b._cat +
                ', mas não existe "catalogo: ' +
                b._cat +
                '"'
            );
          else {
            b.catalogRef = b._cat;
            const cols = new Set((b.columns || []).map(c => c.id));
            catalogs[b._cat].forEach(e =>
              Object.keys(e.d).forEach(k => {
                const kk = slug(k);
                if (kk !== k) {
                  e.d[kk] = e.d[k];
                  delete e.d[k];
                }
                if (!cols.has(kk) && !warns.some(w => w.msg.includes('"' + kk + '" no catálogo ' + b._cat)))
                  warns.push({
                    line: 0,
                    msg: 'chave "' + kk + '" no catálogo ' + b._cat + ' não é coluna de "' + b.title + '"',
                  });
              })
            );
          }
          delete b._cat;
        }
        delete b._acts;
      })
    );
    if (Object.keys(catalogs).length) tpl.catalogs = catalogs;
    // HUD
    if (!Object.keys(fieldInfo).includes(tpl.hud.title)) {
      const first = Object.keys(fieldInfo)[0];
      warns.push({
        line: 0,
        msg: 'título: "' + tpl.hud.title + '" não existe; usei "' + (first || '') + '"',
      });
      tpl.hud.title = first || 'nome';
    }
    const resIds = [];
    tpl.tabs.forEach(tb =>
      tb.blocks.forEach(b => {
        if (b.type === 'resource') resIds.push(b.id);
      })
    );
    tpl.hud.resources = hudBars.length
      ? hudBars.filter(id => {
          if (!resIds.includes(id)) {
            warns.push({ line: 0, msg: 'barras: "' + id + '" não é um recurso' });
            return false;
          }
          return true;
        })
      : resIds;
    // atributos entram em fieldInfo? (para destaque de modificadores)
    tpl.hud.stats = hudStats
      .map(id => {
        const fi = fieldInfo[id];
        if (!fi) {
          warns.push({ line: 0, msg: 'destaque: "' + id + '" não existe' });
          return null;
        }
        return { label: fi.label, f: id, fmt: fi.fmt === 'signed' ? 'signed' : undefined };
      })
      .filter(Boolean);
    tpl.rest =
      restore && restore.length
        ? { long: { restore: restore.filter(id => resIds.includes(id)), set: {} } }
        : resIds.length
          ? { long: { restore: resIds, set: {} } }
          : undefined;
    if (!tpl.rest) delete tpl.rest;
    // subtítulo padrão
    if (tpl.hud.sub === '""') {
      /* mantém vazio */
    }
    tpl.src = String(src);
    return { tpl, errors, warns };
  }

    actions: [
      { label: t('cancel') },
      {
        label: existing ? 'Aplicar mudanças' : 'Criar sistema',
        primary: true,
        onClick: () => {
          run();
          if (last.errors.length) {
            toast('Corrija os erros antes de continuar.');
            return false;
          }
          const tp = last.tpl;
          if (existing) {
            tp.id = existing.id;

            Store.data.systems[tp.id] = tp;
            commitTpl();

          } else {
            Store.data.systems[tp.id] = tp;
            Store.save();
            newChar(tp.id);
          }
        },
      },
    ],
  });
}

async function inflateRaw(u8) {
  const ds = new DecompressionStream('deflate-raw');
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer());
}
async function readZip(buf) {
  const dv = new DataView(buf);
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 70000); i--)
    if (dv.getUint32(i, true) === 0x06054b50) {
      e = i;
      break;
    }
  if (e < 0) throw new Error('zip');
  const n = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const ent = {};
  const dec = new TextDecoder();
  for (let i = 0; i < n; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true),
      comp = dv.getUint32(p + 20, true),
      nl = dv.getUint16(p + 28, true),
      xl = dv.getUint16(p + 30, true),
      cl = dv.getUint16(p + 32, true),
      lo = dv.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(buf, p + 46, nl));
    ent[name] = { method, comp, lo };
    p += 46 + nl + xl + cl;
  }
  return {
    has: n => !!ent[n],
    names: () => Object.keys(ent),
    async text(name) {
      const z = ent[name];
      if (!z) return null;
      const nl = dv.getUint16(z.lo + 26, true),
        xl = dv.getUint16(z.lo + 28, true);
      const s = z.lo + 30 + nl + xl;
      let u8 = new Uint8Array(buf, s, z.comp);
      if (z.method === 8) u8 = await inflateRaw(u8);
      else if (z.method !== 0) throw new Error('zip method');
      return dec.decode(u8);
    },
  };
}
const xml = s => new DOMParser().parseFromString(s, 'application/xml');
const kids = (el, tag) => [...el.getElementsByTagName(tag)];
const tx = el => (el ? el.textContent : '');

function themeColors(doc) {
  const out = [];
  if (!doc) return out;
  const cs = doc.getElementsByTagName('a:clrScheme')[0];
  if (!cs) return out;
  for (const k of [
    'dk1',
    'lt1',
    'dk2',
    'lt2',
    'accent1',
    'accent2',
    'accent3',
    'accent4',
    'accent5',
    'accent6',
  ]) {
    const el = cs.getElementsByTagName('a:' + k)[0];
    if (!el) {
      out.push('000000');
      continue;
    }
    const c = el.firstElementChild;
    out.push(c.getAttribute('lastClr') || c.getAttribute('val') || '000000');
  }
  return out;
}
