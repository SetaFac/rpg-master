function resolveColor(el, theme) {
  if (!el) return null;
  let hex = null;
  if (el.hasAttribute('rgb')) hex = el.getAttribute('rgb').slice(-6);
  else if (el.hasAttribute('theme'))
    hex = theme[[1, 0, 3, 2, 4, 5, 6, 7, 8, 9][parseInt(el.getAttribute('theme'))] ?? 0] || '000000';
  else if (el.hasAttribute('indexed')) hex = INDEXED[parseInt(el.getAttribute('indexed'))] || null;
  else if (el.getAttribute('auto')) return null;
  if (!hex) return null;
  const tint = parseFloat(el.getAttribute('tint') || '0');
  if (tint) {
    const n = parseInt(hex, 16);
    const ch = [n >> 16, (n >> 8) & 255, n & 255].map(c =>
      Math.round(tint > 0 ? c + (255 - c) * tint : c * (1 + tint))
    );
    hex = ch.map(c => c.toString(16).padStart(2, '0')).join('');
  }
  return '#' + hex.toLowerCase();
}
const lum = hex => {
  if (!hex) return 1;
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
};

async function parseXlsx(buf) {
  const z = await readZip(buf);
  const wb = xml(await z.text('xl/workbook.xml'));
  const rels = xml(await z.text('xl/_rels/workbook.xml.rels'));
  const relMap = {};
  kids(rels, 'Relationship').forEach(r => (relMap[r.getAttribute('Id')] = r.getAttribute('Target')));
  const sst = [];
  const ssx = await z.text('xl/sharedStrings.xml');
  if (ssx)
    kids(xml(ssx), 'si').forEach(si => {
      let s = '';
      [...si.children].forEach(ch => {
        if (ch.tagName === 't') s += ch.textContent;
        else if (ch.tagName === 'r') kids(ch, 't').forEach(t => (s += t.textContent));
      });
      sst.push(s);
    });
  const theme = themeColors(
    (await z.text('xl/theme/theme1.xml')) ? xml(await z.text('xl/theme/theme1.xml')) : null
  );
  // estilos
  const sx = await z.text('xl/styles.xml');
  const fonts = [],
    fills = [],
    borders = [],
    xfs = [];
  if (sx) {
    const sd = xml(sx);
    const fe = sd.getElementsByTagName('fonts')[0];
    if (fe)
      [...fe.children].forEach(f =>
        fonts.push({
          b: !!f.getElementsByTagName('b')[0],
          i: !!f.getElementsByTagName('i')[0],
          sz: parseFloat(f.getElementsByTagName('sz')[0]?.getAttribute('val') || 11),
          color: resolveColor(f.getElementsByTagName('color')[0], theme),
        })
      );
    const le = sd.getElementsByTagName('fills')[0];
    if (le)
      [...le.children].forEach(f => {
        const pf = f.getElementsByTagName('patternFill')[0];
        const t = pf && pf.getAttribute('patternType');
        fills.push(pf && t === 'solid' ? resolveColor(pf.getElementsByTagName('fgColor')[0], theme) : null);
      });
    const be = sd.getElementsByTagName('borders')[0];
    if (be)
      [...be.children].forEach(b => {
        const side = n => {
          const e = b.getElementsByTagName(n)[0];
          return !!(e && e.getAttribute('style'));
        };
        borders.push({ l: side('left'), r: side('right'), t: side('top'), b: side('bottom') });
      });
    const xe = sd.getElementsByTagName('cellXfs')[0];
    if (xe)
      [...xe.children].forEach(x => {
        const al = x.getElementsByTagName('alignment')[0];
        xfs.push({
          font: +x.getAttribute('fontId') || 0,
          fill: +x.getAttribute('fillId') || 0,
          border: +x.getAttribute('borderId') || 0,
          h: al && al.getAttribute('horizontal'),
          v: al && al.getAttribute('vertical'),
          wrap: al && al.getAttribute('wrapText') === '1',
        });
      });
  }
  const sheets = [];
  for (const s of kids(wb, 'sheet')) {
    const name = s.getAttribute('name');
    let tgt =
      relMap[s.getAttribute('r:id')] ||
      relMap[s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id')];
    if (!tgt) continue;
    tgt = tgt.replace(/^\//, '');
    const path = tgt.startsWith('xl/') ? tgt : 'xl/' + tgt;
    const sd = xml(await z.text(path));
    const cells = {};
    let maxR = 0,
      maxC = 0;
    const shared = {};
    const fmtEl = sd.getElementsByTagName('sheetFormatPr')[0];
    const defW = parseFloat(
        fmtEl?.getAttribute('defaultColWidth') || fmtEl?.getAttribute('baseColWidth') || 8.43
      ),
      defH = parseFloat(fmtEl?.getAttribute('defaultRowHeight') || 15);
    const colsW = [];
    kids(sd, 'col').forEach(c =>
      colsW.push({
        min: +c.getAttribute('min'),
        max: +c.getAttribute('max'),
        w: parseFloat(c.getAttribute('width')),
        hidden: c.getAttribute('hidden') === '1',
      })
    );
    const rowsH = {};
    const hiddenRows = new Set();
    kids(sd, 'row').forEach(r => {
      const rn = +r.getAttribute('r');
      if (r.getAttribute('ht')) rowsH[rn] = parseFloat(r.getAttribute('ht'));
      if (r.getAttribute('hidden') === '1') hiddenRows.add(rn);
    });
    kids(sd, 'c').forEach(c => {
      const a = c.getAttribute('r');
      const pos = Formula.splitA1(a);
      if (!pos) return;
      const t = c.getAttribute('t');
      const fEl = c.getElementsByTagName('f')[0];
      const vEl = c.getElementsByTagName('v')[0];
      let v = null,
        f = null;
      if (t === 'inlineStr')
        v = kids(c, 't')
          .map(x => x.textContent)
          .join('');
      else if (vEl) {
        const raw = vEl.textContent;
        v =
          t === 's' ? sst[+raw] : t === 'b' ? raw === '1' : t === 'str' || t === 'e' ? raw : parseFloat(raw);
      }
      if (fEl) {
        let ft = fEl.textContent;
        if (fEl.getAttribute('t') === 'shared') {
          const si = fEl.getAttribute('si');
          if (ft) shared[si] = { f: ft, c: pos.c, r: pos.r };
          else if (shared[si])
            ft = Formula.shiftFormula(shared[si].f, pos.r - shared[si].r, pos.c - shared[si].c);
        }
        f = ft ? ft.replace(/_xlfn\./g, '').replace(/_xlws\./g, '') : null;
      }
      const sIdx = +c.getAttribute('s') || 0;
      if (v === null && !f && !sIdx) return;
      cells[a] = { v, f, s: sIdx };
      maxR = Math.max(maxR, pos.r);
      maxC = Math.max(maxC, pos.c);
    });
    const merges = kids(sd, 'mergeCell')
      .map(m => m.getAttribute('ref').split(':').map(Formula.splitA1))
      .filter(x => x.length === 2 && x[0] && x[1])
      .map(([a, b]) => [a.r, a.c, b.r, b.c]);
    merges.forEach(m => {
      maxR = Math.max(maxR, m[2]);
      maxC = Math.max(maxC, m[3]);
    });
    const dvs = [];
    kids(sd, 'dataValidation').forEach(d => {
      if (d.getAttribute('type') !== 'list') return;
      const f1 = tx(d.getElementsByTagName('formula1')[0]);
      let list = null;
      const m = /^"(.*)"$/.exec(f1);
      if (m) list = m[1].split(',');
      dvs.push({ sq: d.getAttribute('sqref').split(/\s+/), list, ref: m ? null : f1 });
    });
    sheets.push({ name, cells, merges, colsW, rowsH, hiddenRows, defW, defH, maxR, maxC, dvs });
  }
  return { sheets, sst, styles: { fonts, fills, borders, xfs } };
}

/* ---------- planilha -> modelo "grid" ---------- */
function buildGridTemplate(px, include, name, orig) {
  const report = { cells: 0, formulas: 0, bad: 0, unsup: new Set() };
  const { fonts, fills, borders, xfs } = px.styles;
  const sheetNames = new Set(px.sheets.map(s => s.name));
  const tabs = [];
  for (const sh of px.sheets) {
    if (!include.includes(sh.name)) continue;
    const refd = new Set();
    for (const a in sh.cells) {
      const f = sh.cells[a].f;
      if (!f) continue;
      try {
        const walk = n => {
          if (!n || typeof n !== 'object') return;
          if (n.n === 'ref' && (!n.sheet || n.sheet === sh.name)) refd.add(n.a);
          if (n.n === 'range' && (!n.sheet || n.sheet === sh.name)) {
            const A = Formula.splitA1(n.a),
              B = Formula.splitA1(n.b);
            if (A && B)
              for (let r = A.r; r <= B.r && r - A.r < 200; r++)
                for (let c = A.c; c <= B.c && c - A.c < 200; c++) refd.add(Formula.numToCol(c) + r);
          }
          if (n.l) walk(n.l);
          if (n.r) walk(n.r);
          if (n.x) walk(n.x);
          (n.args || []).forEach(walk);
        };
        walk(Formula.parse(f, true));
      } catch (e) {}
    }
    // refs entre planilhas
    const mergeAt = {},
      covered = new Set();
    sh.merges.forEach(m => {
      mergeAt[Formula.numToCol(m[1]) + m[0]] = m;
      for (let r = m[0]; r <= m[2]; r++)
        for (let c = m[1]; c <= m[3]; c++)
          if (!(r === m[0] && c === m[1])) covered.add(Formula.numToCol(c) + r);
    });
    // validação de dados -> opções
    const dvOpt = {};
    sh.dvs.forEach(d => {
      let list = d.list;
      if (!list && d.ref) {
        const m = /^\$?([A-Z]+)\$?(\d+):\$?([A-Z]+)\$?(\d+)$/.exec(d.ref.replace(/^'?[^!]*'?!/, ''));
        if (m) {
          list = [];
          const c1 = Formula.colToNum(m[1]),
            c2 = Formula.colToNum(m[3]);
          for (let r = +m[2]; r <= +m[4]; r++)
            for (let c = c1; c <= c2; c++) {
              const x = sh.cells[Formula.numToCol(c) + r];
              if (x && x.v !== null && x.v !== '') list.push(String(x.v));
            }
        }
      }
      if (!list) return;
      d.sq.forEach(sq => {
        const [p, q] = sq.split(':');
        const A = Formula.splitA1(p),
          B = Formula.splitA1(q || p);
        if (!A || !B) return;
        for (let r = A.r; r <= B.r; r++)
          for (let c = A.c; c <= B.c; c++) dvOpt[Formula.numToCol(c) + r] = list;
      });
    });
    const styles = [],
      styMap = {};
    const out = {};
    const styleOf = a => {
      const cell = sh.cells[a];
      const x = xfs[cell ? cell.s : 0] || {};
      const f = fonts[x.font] || {};
      const fill = fills[x.fill] || null;
      const bd = borders[x.border] || {};
      return {
        b: f.b ? 1 : 0,
        i: f.i ? 1 : 0,
        sz: f.sz,
        fg: f.color,
        bg: fill,
        h: x.h,
        v: x.v,
        wrap: x.wrap ? 1 : 0,
        bd,
      };
    };
    const addr = (r, c) => Formula.numToCol(c) + r;
    const allAddrs = new Set([...Object.keys(sh.cells), ...Object.keys(mergeAt), ...refd]);
    for (const a of allAddrs) {
      if (covered.has(a)) continue;
      const pos = Formula.splitA1(a);
      const cell = sh.cells[a] || { v: null, f: null, s: 0 };
      const m = mergeAt[a];
      let st = styleOf(a);
      if (m) {
        // bordas do perímetro da mescla
        const tr_ = styleOf(addr(m[0], m[3])),
          bl = styleOf(addr(m[2], m[1]));
        st = { ...st, bd: { l: st.bd.l, t: st.bd.t, r: tr_.bd.r, b: bl.bd.b } };
      }
      const bgl = lum(st.bg),
        fgl = lum(st.fg);
      const whiteish = c => c && lum(c) > 0.93;
      const hidden =
        cell.v !== null &&
        !cell.f &&
        ((st.fg && st.bg && Math.abs(fgl - bgl) < 0.06) || ((!st.bg || whiteish(st.bg)) && whiteish(st.fg)));
      if (hidden) continue;
      let k = null,
        t = null,
        v = cell.v;
      if (cell.f) {
        k = 'ca';
        report.formulas++;
        try {
          const ast = Formula.parse(cell.f, true);
          Formula.unsupportedFns(ast).forEach(x => report.unsup.add(x));
        } catch (e) {
          report.bad++;
        }
      } else if (typeof v === 'boolean') {
        k = 'in';
        t = 'b';
      } else if (typeof v === 'number') {
        k = 'in';
        t = 'n';
      } else if (typeof v === 'string' && v.trim() !== '') {
        if (/^[-—–]$/.test(v.trim())) {
          k = 'in';
          t = 's';
          v = '';
        } else if (
          !st.b &&
          st.bg &&
          lum(st.bg) > 0.97 &&
          st.h !== 'center' &&
          (m || st.bd.l || st.bd.r || st.bd.t || st.bd.b)
        ) {
          k = 'in';
          t = 's';
        } else {
          k = 'lb';
        }
      } else {
        // vazio
        const bigEmpty = m && (m[2] - m[0] + 1) * (m[3] - m[1] + 1) >= 2 && (!st.bg || bgl > 0.55);
        if (refd.has(a)) {
          k = 'in';
          t = 'n';
          v = null;
        } else if (bigEmpty) {
          k = 'in';
          t = 's';
          v = null;
        } else if (dvOpt[a]) {
          k = 'in';
          t = 's';
          v = null;
        }
      }
      if (!k) {
        if ((st.bd && (st.bd.l || st.bd.r || st.bd.t || st.bd.b)) || st.bg) {
          k = 'lb';
          v = '';
        } else continue;
      }
      if (dvOpt[a] && k === 'in') t = 's';
      const sk = JSON.stringify([
        st.b,
        st.i,
        st.sz,
        st.fg,
        st.bg,
        st.h,
        st.v,
        st.wrap,
        st.bd.l,
        st.bd.r,
        st.bd.t,
        st.bd.b,
      ]);
      if (styMap[sk] === undefined) {
        styMap[sk] = styles.length;
        styles.push({
          b: st.b || undefined,
          i: st.i || undefined,
          z: st.sz && st.sz !== 11 ? st.sz : undefined,
          fg: st.fg || undefined,
          bg: st.bg || undefined,
          h: st.h || undefined,
          va: st.v || undefined,
          w: st.wrap || undefined,
          bd:
            (st.bd.t ? 't' : '') + (st.bd.r ? 'r' : '') + (st.bd.b ? 'b' : '') + (st.bd.l ? 'l' : '') ||
            undefined,
        });
      }
      const o = { k, s: styMap[sk] };
      if (t) o.t = t;
      if (v !== null && v !== undefined && v !== '') o.v = v;
      if (cell.f) {
        o.f = cell.f;
        if (cell.v !== null && cell.v !== undefined) o.c = cell.v;
      }
      if (m) o.m = [m[2] - m[0] + 1, m[3] - m[1] + 1];
      if (dvOpt[a] && k === 'in') o.o = dvOpt[a];
      out[a] = o;
      report.cells++;
    }
    // larguras e alturas
    const cols = [];
    for (let c = 1; c <= sh.maxC; c++) {
      let w = sh.defW;
      for (const d of sh.colsW) if (c >= d.min && c <= d.max) w = d.hidden ? 0 : d.w;
      cols.push(Math.max(0, Math.round(w * 7 + 5)));
    }
    const rows = [];
    for (let r = 1; r <= sh.maxR; r++)
      rows.push(sh.hiddenRows.has(r) ? 0 : Math.round((sh.rowsH[r] || sh.defH) * 1.333));
    tabs.push({
      id: slug(sh.name) + '_' + tabs.length,
      title: sh.name,
      blocks: [
        {
          type: 'grid',
          id: 'g' + tabs.length,
          sheet: sh.name,
          span: 12,
          orig: !!orig,
          cols,
          rows,
          styles,
          cells: out,
        },
      ],
    });
  }
  const tpl = { id: 'xl-' + uid(), rev: 1, builtin: false, name, desc: '', icon: '▦', theme: 'carta', tabs };
  return { tpl, report };
}

async function importXlsx(file) {
  const wait = modal({ title: t('xlsxTitle'), body: h('p', t('xlsxReading')), actions: [] });
  let px;
  try {
    px = await parseXlsx(await file.arrayBuffer());
  } catch (e) {
    console.error(e);
    wait.close();
    toast(t('xlsxErr'));
    return;
  }
  wait.close();
  const nm = h('input', { type: 'text', value: file.name.replace(/\.xlsx?m?$/i, '') });
  const checks = px.sheets.map(s =>
    h(
      'label',
      { style: { display: 'flex', gap: '8px', alignItems: 'center', margin: '4px 0' } },
      h('input', { type: 'checkbox', checked: true, style: { width: 'auto' }, 'data-n': s.name }),
      s.name,
      h('span.muted', Object.keys(s.cells).length + ' ' + (LANG === 'pt' ? 'células' : 'cells'))
    )
  );
  const orig = h('input', { type: 'checkbox', style: { width: 'auto' } });
  const body = h(
    'div',
    h('label.f', t('sysName'), nm),
    h('div.lab', t('xlsxSheets')),
    h('div', { style: { margin: '6px 0 12px' } }, checks),
    h('label', { style: { display: 'flex', gap: '8px', alignItems: 'center' } }, orig, t('xlsxOrig')),
    h('p.hint', t('xlsxHelp'))
  );
  modal({
    title: t('xlsxTitle'),
    body,
    actions: [
      { label: t('cancel') },
      {
        label: t('xlsxMake'),
        primary: true,
        onClick: () => {
          const inc = checks
            .map(c => c.firstChild)
            .filter(i => i.checked)
            .map(i => i.dataset.n);
          if (!inc.length) return false;
          const { tpl, report } = buildGridTemplate(px, inc, nm.value.trim() || file.name, orig.checked);
          Store.data.systems[tpl.id] = tpl;
          Store.save();
          const ch = {
            id: uid(),
            tplId: tpl.id,
            name: nm.value.trim(),
            v: {},
            g: {},
            created: Date.now(),
            updated: Date.now(),
          };
          Store.data.chars[ch.id] = ch;
          Store.save();
          openChar(ch.id);
          toast(
            t('xlsxReport', report.cells, report.formulas) +
              (report.unsup.size ? ' · ' + t('xlsxUnsup', [...report.unsup].join(', ')) : ''),
            6500
          );
          setTimeout(() => {
            App.edit = true;
            document.body.classList.add('editing');
            renderChar();
            toast(t('xlsxHelp'), 9000);
          }, 400);
        },
      },
    ],
  });
}

/* ---------- desenho do grid ---------- */
function fmtX(v) {
  if (v === null || v === undefined) return '';
  if (Array.isArray(v)) v = v[0];
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (typeof v === 'number') return String(Math.round(v * 1e6) / 1e6);
  return String(v);
}
function renderGrid(b) {
  const rt = App.rt;
  const sheet = b.sheet;
  const wrap = h('div.xcard' + (b.orig ? '.xorig' : ''));
  const g = h('div.xgrid', {
    style: {
      gridTemplateColumns: b.cols.map(w => w + 'px').join(' '),
      gridTemplateRows: b.rows.map(x => x + 'px').join(' '),
    },
  });
  for (const a in b.cells) {
    const c = b.cells[a];
    const pos = Formula.splitA1(a);
    if (!pos) continue;
    const st = b.styles[c.s] || {};
    const rs = c.m ? c.m[0] : 1,
      cs = c.m ? c.m[1] : 1;
    const cls = ['xc'];
    if (st.b) cls.push('b');
    if (st.h === 'center' || st.h === 'centerContinuous') cls.push('ctr');
    else if (st.h === 'right') cls.push('r');
    if (st.w) cls.push('wrap');
    if (st.va === 'top') cls.push('top');
    else if (st.va === 'bottom') cls.push('bot');
    if (st.bg) {
      const l = lum(st.bg);
      if (l < 0.35) cls.push('fill-d');
      else if (l < 0.85) cls.push('fill-m');
      else if (l < 0.98) cls.push('fill-l');
    }
    if (c.k === 'ca') cls.push('cal');
    if (c.k === 'in') cls.push('in');
    if (App.edit) cls.push('k-' + (c.k === 'in' ? 'in' : c.k === 'ca' ? 'ca' : 'lb'), 'sel-edit');
    const style = { gridArea: `${pos.r} / ${pos.c} / span ${rs} / span ${cs}` };
    if (st.z) style.fontSize = Math.round(st.z * 1.1) + 'px';
    if (st.bd) {
      style.borderWidth = ['t', 'r', 'b', 'l'].map(s => (st.bd.includes(s) ? '1px' : '0')).join(' ');
      style.borderStyle = 'solid';
      style.borderColor = 'var(--line)';
    }
    if (b.orig) {
      if (st.bg) style['--bgc'] = st.bg;
      if (st.fg) style['--fgc'] = st.fg;
    }
    if (st.i) style.fontStyle = 'italic';
    const el = h('div', { class: cls.join(' '), style, 'data-a': a });
    if (c.k === 'lb') {
      el.append(h('span', fmtX(c.v)));
    } else if (c.k === 'ca') {
      const sp = h('span');
      el.append(sp);
      App.binds.push(() => {
        const v = rt.cellVal(sheet, a);
        sp.textContent = fmtX(v);
        const e = rt.errs[sheet + '!' + a];
        el.classList.toggle('err', !!e || (typeof v === 'string' && /^#[A-Z/0!?]+$/.test(v)));
        el.title = e || '';
      });
    } else if (c.k === 'in' && !App.edit) {
      const cur = rt.cellVal(sheet, a);
      let inp;
      if (c.t === 'b') {
        inp = h('input', { type: 'checkbox', checked: !!cur });
        inp.addEventListener('change', () => {
          rt.setCellG(sheet, a, inp.checked);
          changed();
        });
        el.classList.add('ctr');
        inp = h('label.chk', inp, h('i'));
      } else if (c.o) {
        inp = h(
          'select',
          h('option', { value: '' }, '—'),
          c.o.map(o => h('option', { value: o }, o))
        );
        inp.value = cur === null || cur === undefined ? '' : String(cur);
        inp.addEventListener('change', () => {
          rt.setCellG(sheet, a, inp.value);
          changed();
        });
      } else if (c.t === 'n') {
        inp = h('input', {
          type: 'number',
          step: 'any',
          value: cur === null || cur === undefined ? '' : cur,
        });
        inp.addEventListener('input', () => {
          rt.setCellG(sheet, a, inp.value === '' ? null : parseFloat(inp.value));
          changed();
        });
        inp.style.textAlign = 'center';
      } else if (rs > 2 || cs > 6) {
        inp = h('textarea', { value: cur ?? '' });
        inp.value = cur ?? '';
        inp.addEventListener('input', () => {
          rt.setCellG(sheet, a, inp.value);
          changed();
        });
      } else {
        inp = h('input', { type: 'text', value: cur ?? '' });
        inp.addEventListener('input', () => {
          rt.setCellG(sheet, a, inp.value);
          changed();
        });
      }
      el.append(inp);
    } else if (c.k === 'in') {
      el.append(h('span', c.t === 'b' ? '☐' : fmtX(c.v) || '▭'));
    }
    if (App.edit && c.k !== 'ca')
      el.addEventListener('click', () => {
        if (c.k === 'in') {
          c.k = 'lb';
          delete c.t;
        } else {
          c.k = 'in';
          c.t = typeof c.v === 'boolean' ? 'b' : typeof c.v === 'number' ? 'n' : 's';
        }
        commitTpl(false);
        App.rerender();
      });
    g.append(el);
  }
  const bar = h(
    'div',
    { style: { display: 'flex', gap: '8px', marginBottom: '8px', alignItems: 'center' } },
    h(
      'button.btn.sm',
      {
        type: 'button',
        onclick: async () => {
          if (!(await ensureEditable())) return;
          const blk = App.tpl.tabs.flatMap(x => x.blocks).find(x => x.type === 'grid' && x.sheet === sheet);
          blk.orig = !blk.orig;
          commitTpl(false);
          App.rerender();
        },
      },
      '🎨 ' + t('origColors') + (b.orig ? ' ✓' : '')
    ),
    App.edit ? h('span.hint', { style: { margin: 0 } }, t('gridEditOn')) : null
  );
  wrap.append(bar, g);
  const fit = () => {
    g.style.zoom = 1;
    const w = wrap.clientWidth - 22,
      gw = g.scrollWidth;
    if (gw > w && w > 100) g.style.zoom = (w / gw).toFixed(3);
  };
  requestAnimationFrame(() => {
    fit();
    try {
      new ResizeObserver(() => fit()).observe(wrap);
    } catch (e) {}
  });
  return wrap;
}

/* ---- banco local (IndexedDB) para arquivos grandes: áudios e imagens de cenário ---- */
const DB = {
  mem: { audio: {}, img: {} },
  _p: null,
  open() {
    return (
      this._p ||
      (this._p = new Promise(res => {
        try {
          const r = indexedDB.open('rpgmaster', 1);
          r.onupgradeneeded = () => {
            const d = r.result;
            ['audio', 'img'].forEach(s => {
              if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
            });
          };
          r.onsuccess = () => res(r.result);
          r.onerror = () => res(null);
          r.onblocked = () => res(null);
        } catch (e) {
          res(null);
        }
      }))
    );
  },
  async run(store, mode, fn) {
    const db = await this.open();
    if (!db) return null;
    return new Promise(res => {
      try {
        const tx = db.transaction(store, mode),
          rq = fn(tx.objectStore(store));
        let out = null;
        if (rq)
          rq.onsuccess = () => {
            out = rq.result;
          };
        tx.oncomplete = () => res(out);
        tx.onerror = tx.onabort = () => res(null);
      } catch (e) {
        res(null);
      }
    });
  },
  async put(store, rec) {
    this.mem[store][rec.id] = rec;
    await this.run(store, 'readwrite', s => s.put(rec));
    return rec;
  },
  async get(store, id) {
    if (this.mem[store][id]) return this.mem[store][id];
    const r = await this.run(store, 'readonly', s => s.get(id));
    if (r) this.mem[store][r.id] = r;
    return r;
  },
  async all(store) {
    const r = await this.run(store, 'readonly', s => s.getAll());
    const list = r || Object.values(this.mem[store]);
    list.forEach(x => {
      this.mem[store][x.id] = x;
    });
    return list;
  },
  async del(store, id) {
    delete this.mem[store][id];
    await this.run(store, 'readwrite', s => s.delete(id));
  },
};

/* ---- notas ---- */
const mf = n => 440 * Math.pow(2, (n - 69) / 12);

const Snd = {
  ctx: null,
  bus: {},
  vol: { master: 0.8, music: 0.7, sfx: 0.9, amb: 0.6 },
  muted: false,
  amb: null,
  mus: null,
  lib: [],
  libLoaded: false,
  ls: [],
  _nb: {},
  shots: new Set(),
  on(fn) {
    this.ls.push(fn);
  },
  emit() {
    this.ls.forEach(f => {
      try {
        f();
      } catch (e) {}
    });
  },
  loadVol() {
    const v = Store.data && Store.data.prefs && Store.data.prefs.snd;
    if (v) Object.assign(this.vol, v);
  },
  saveVol() {
    Store.data.prefs.snd = { ...this.vol };
    Store.save();
  },
  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    const c = (this.ctx = new C()),
      m = c.createGain(),
      comp = c.createDynamicsCompressor();
    m.connect(comp);
    comp.connect(c.destination);
    this.master = m;
    ['music', 'sfx', 'amb'].forEach(k => {
      const g = c.createGain();
      g.connect(m);
      this.bus[k] = g;
    });
    this.applyVol();
    return c;
  },
  applyVol() {
    if (!this.ctx) return;
    const v = this.vol;
    this.master.gain.value = this.muted ? 0 : v.master * v.master;
    ['music', 'sfx', 'amb'].forEach(k => {
      this.bus[k].gain.value = v[k] * v[k];
    });
  },
  noise(kind) {
    if (this._nb[kind]) return this._nb[kind];
    const c = this.ctx,
      n = c.sampleRate * 4,
      b = c.createBuffer(1, n, c.sampleRate),
      d = b.getChannelData(0);
    let l = 0,
      b0 = 0,
      b1 = 0,
      b2 = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === 'white') d[i] = w * 0.6;
      else if (kind === 'brown') {
        l = (l + 0.02 * w) / 1.02;
        d[i] = l * 3.5;
      } else {
        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.969 * b2 + w * 0.153852;
        d[i] = (b0 + b1 + b2 + w * 0.5362) * 0.22;
      }
    }
    return (this._nb[kind] = b);
  },
  /* oscilador com envelope */
  osc(type, f, t, dur, vol, f2, out, atk) {
    const c = this.ctx,
      o = c.createOscillator(),
      g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    atk = atk ?? Math.min(0.01, dur / 4);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(out);
    o.start(t);
    o.stop(t + dur + 0.05);
    return o;
  },
  /* ruído filtrado com envelope */
  nz(kind, t, dur, vol, ft, f0, f1, q, out, atk) {
    const c = this.ctx,
      s = c.createBufferSource(),
      f = c.createBiquadFilter(),
      g = c.createGain();
    s.buffer = this.noise(kind);
    s.loop = true;
    f.type = ft;
    f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    f.Q.value = q || 1;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + (atk ?? 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f);
    f.connect(g);
    g.connect(out);
    s.start(t, Math.random() * 2);
    s.stop(t + dur + 0.05);
    return g;
  },
  /* camada contínua de ruído (ambientes) */
  layer(A, kind, ft, freq, q, gain) {
    const c = this.ctx,
      s = c.createBufferSource(),
      f = c.createBiquadFilter(),
      g = c.createGain();
    s.buffer = this.noise(kind);
    s.loop = true;
    s.loopStart = Math.random() * 2;
    f.type = ft;
    f.frequency.value = freq;
    f.Q.value = q;
    g.gain.value = gain;
    s.connect(f);
    f.connect(g);
    g.connect(A.out);
    s.start();
    A.nodes.push(s);
    return { g, f };
  },
  lfo(A, param, rate, depth) {
    const c = this.ctx,
      o = c.createOscillator(),
      g = c.createGain();
    o.frequency.value = rate;
    g.gain.value = depth;
    o.connect(g);
    g.connect(param);
    o.start();
    A.nodes.push(o);
    return o;
  },
  drone(A, type, f, vol, detune) {
    const c = this.ctx,
      o = c.createOscillator(),
      g = c.createGain();
    o.type = type;
    o.frequency.value = f;
    g.gain.value = vol;
    o.connect(g);
    g.connect(A.out);
    o.start();
    A.nodes.push(o);
    if (detune) this.lfo(A, o.detune, 0.05 + Math.random() * 0.08, detune);
    return o;
  },
  pad(out, notes, t, dur, vol) {
    const c = this.ctx;
    notes.forEach(n => {
      [-4, 4].forEach(dt => {
        const o = c.createOscillator(),
          g = c.createGain();
        o.type = 'triangle';
        o.frequency.value = mf(n);
        o.detune.value = dt;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.35);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.15);
        o.connect(g);
        g.connect(out);
        o.start(t);
        o.stop(t + dur * 1.2);
      });
    });
  },
  pluck(out, f, t, vol, len) {
    this.osc('triangle', f, t, len || 0.7, vol, null, out, 0.004);
    this.osc('sine', f * 2, t, (len || 0.7) * 0.5, vol * 0.35, null, out, 0.004);
  },
  /* ---- efeitos sonoros ---- */
  play(id, v = 1, out) {
    const d = SFX[id];
    if (!d) return;
    const c = this.init();
    if (!c) return;
    out = out || this.bus.sfx;
    d.f(this, c.currentTime + 0.01, out, v);
  },
  /* ---- ambientes (loops gerados) ---- */
  startAmb(id) {
    const d = AMB[id],
      c = this.init();
    if (!d || !c) return;
    this.stopAmb(1);
    const g = c.createGain();
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(1, c.currentTime + 2);
    g.connect(this.bus.amb);
    const A = {
      id,
      out: g,
      nodes: [],
      timers: [],
      alive: true,
      every(min, max, fn) {
        const go = () => {
          const tm = setTimeout(
            () => {
              if (!A.alive) return;
              try {
                fn();
              } catch (e) {}
              go();
            },
            (min + Math.random() * (max - min)) * 1000
          );
          A.timers.push(tm);
        };
        go();
      },
    };
    try {
      d.mk(this, A);
    } catch (e) {
      console.error(e);
    }
    this.amb = A;
    this.emit();
  },
  stopAmb(fade = 1.5) {
    const A = this.amb;
    if (!A) return;
    this.amb = null;
    A.alive = false;
    A.timers.forEach(clearTimeout);
    const c = this.ctx,
      t = c.currentTime;
    A.out.gain.cancelScheduledValues(t);
    A.out.gain.setValueAtTime(A.out.gain.value, t);
    A.out.gain.linearRampToValueAtTime(0, t + fade);
    setTimeout(
      () => {
        A.nodes.forEach(n => {
          try {
            n.stop();
          } catch (e) {}
        });
        try {
          A.out.disconnect();
        } catch (e) {}
      },
      fade * 1000 + 200
    );
    this.emit();
  },
  /* ---- biblioteca do usuário ---- */
  async loadLib() {
    if (this.libLoaded) return this.lib;
    this.lib = (await DB.all('audio')).sort((a, b) => (a.added || 0) - (b.added || 0));
    this.libLoaded = true;
    return this.lib;
  },
  async addFiles(files, kind) {
    let n = 0;
    for (const f of files) {
      if (!/^audio\//.test(f.type) && !/\.(mp3|ogg|wav|m4a|flac|opus|aac|webm)$/i.test(f.name)) continue;
      const rec = {
        id: uid(),
        name: f.name.replace(/\.[^.]+$/, ''),
        kind,
        blob: f,
        size: f.size,
        added: Date.now() + n,
      };
      await DB.put('audio', rec);
      this.lib.push(rec);
      n++;
    }
    this.emit();
    return n;
  },
  async removeLib(id) {
    if (this.mus && this.mus.id === id) this.stopMusic(0.3);
    await DB.del('audio', id);
    this.lib = this.lib.filter(r => r.id !== id);
    this.emit();
  },
  async renameLib(id, name) {
    const r = this.lib.find(x => x.id === id);
    if (r) {
      r.name = name;
      await DB.put('audio', r);
      this.emit();
    }
  },
  url(r) {
    return r._url || (r._url = URL.createObjectURL(r.blob));
  },
  mediaNode(r, bus, loop) {
    const c = this.init(),
      el = new Audio(this.url(r));
    el.loop = !!loop;
    el.preload = 'auto';
    const src = c.createMediaElementSource(el),
      g = c.createGain();
    g.gain.value = 0;
    src.connect(g);
    g.connect(bus);
    return { el, g, src };
  },
  async playMusic(id, fade = 2) {
    await this.loadLib();
    const r = this.lib.find(x => x.id === id);
    if (!r) return;
    const c = this.init();
    if (!c) return;
    if (this.mus && this.mus.id === id && !this.mus.el.paused) return;
    this.stopMusic(fade);
    const m = this.mediaNode(r, this.bus.music, true);
    m.id = id;
    m.name = r.name;
    this.mus = m;
    try {
      await m.el.play();
    } catch (e) {
      toast(
        L3(
          'O navegador bloqueou o som. Clique de novo.',
          'The browser blocked audio. Click again.',
          'Der Browser hat den Ton blockiert. Klicke erneut.'
        )
      );
      this.mus = null;
      return;
    }
    const t = c.currentTime;
    m.g.gain.setValueAtTime(0, t);
    m.g.gain.linearRampToValueAtTime(1, t + fade);
    this.emit();
  },
  stopMusic(fade = 1.5) {
    const m = this.mus;
    if (!m) return;
    this.mus = null;
    const c = this.ctx,
      t = c.currentTime;
    m.g.gain.cancelScheduledValues(t);
    m.g.gain.setValueAtTime(m.g.gain.value, t);
    m.g.gain.linearRampToValueAtTime(0, t + fade);
    setTimeout(
      () => {
        try {
          m.el.pause();
          m.src.disconnect();
          m.g.disconnect();
        } catch (e) {}
      },
      fade * 1000 + 100
    );
    this.emit();
  },
  toggleMusic() {
    const m = this.mus;
    if (!m) return;
    if (m.el.paused) m.el.play();
    else m.el.pause();
    this.emit();
  },
  async playFile(id) {
    await this.loadLib();
    const r = this.lib.find(x => x.id === id);
    if (!r) return;
    const c = this.init();
    if (!c) return;
    const m = this.mediaNode(r, this.bus.sfx, false);
    m.g.gain.value = 1;
    this.shots.add(m);
    m.el.onended = () => {
      this.shots.delete(m);
      try {
        m.src.disconnect();
        m.g.disconnect();
      } catch (e) {}
    };
    try {
      await m.el.play();
    } catch (e) {}
  },
  stopAll() {
    this.stopAmb(0.8);
    this.stopMusic(0.8);
    this.shots.forEach(m => {
      try {
        m.el.pause();
      } catch (e) {}
    });
    this.shots.clear();
  },
  setMuted(b) {
    this.muted = b;
    this.applyVol();
    this.emit();
  },
};

/* teclas 1–9 tocam os nove primeiros efeitos quando a Mesa ou a Mesa virtual estão abertas */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || !/^[1-9]$/.test(e.key)) return;
  const tg = e.target;
  if ((tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) || (tg && tg.isContentEditable)) return;
  if (!document.querySelector('.gm-root') || document.querySelector('.ovl')) return;
  const id = Object.keys(SFX)[+e.key - 1];
  if (id) Snd.play(id);
});

/* ===== RPG Master — terreno e obstáculos da Mesa virtual (desenhados por código) ===== */
const vH = (x, y, i) => {
  const s = Math.sin(x * 127.1 + y * 311.7 + i * 74.7) * 43758.5453;
  return s - Math.floor(s);
};
function vLiquid(g, px, py, u, tm, same, x, y, c) {
  g.fillStyle = c.base;
  g.fillRect(px - 0.5, py - 0.5, u + 1, u + 1);
  if (c.glow) {
    g.fillStyle = `rgba(255,150,50,${0.14 + 0.12 * Math.sin(tm * 2 + x + y)})`;
    g.fillRect(px, py, u, u);
  }
  g.lineWidth = Math.max(1.2, u * 0.03);
  for (let i = 0; i < 3; i++) {
    const yy = py + ((i * 0.34 + tm * 0.07 * (c.speed || 1) + vH(x, y, i)) % 1) * u;
    g.strokeStyle = c.hi;
    g.globalAlpha = 0.38;
    g.beginPath();
    for (let k = 0; k <= 6; k++) {
      const xx = px + (k * u) / 6,
        yv = yy + Math.sin(k * 1.05 + tm * 1.6 + i) * u * 0.045;
      k ? g.lineTo(xx, yv) : g.moveTo(xx, yv);
    }
    g.stroke();
  }
  g.globalAlpha = 1;
  if (c.bubbles)
    for (let i = 0; i < 3; i++) {
      const ph = (tm * 0.35 + vH(x, y, i + 5)) % 1;
      g.fillStyle = c.hi;
      g.globalAlpha = (1 - ph) * 0.7;
      g.beginPath();
      g.arc(px + vH(x, y, i + 9) * u, py + u - ph * u, u * (0.04 + 0.04 * vH(x, y, i + 3)), 0, 7);
      g.fill();
    }
  g.globalAlpha = 1;
  g.lineWidth = u * 0.07;
  g.lineCap = 'round';
  [
    [0, -1, px, py, px + u, py],
    [0, 1, px, py + u, px + u, py + u],
    [-1, 0, px, py, px, py + u],
    [1, 0, px + u, py, px + u, py + u],

/* ---- imagens ---- */
const blobToData = b =>
  new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => res(null);
    r.readAsDataURL(b);
  });
function dataToBlob(d) {
  const [m, b] = String(d).split(','),
    mime = (/data:([^;]+)/.exec(m) || [, 'image/jpeg'])[1],
    bin = atob(b),
    a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type: mime });
}
const vLoadImg = src =>
  new Promise(res => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
function vPickFile(accept) {
  return new Promise(res => {
    const i = h('input', { type: 'file', accept, style: { display: 'none' } });
    let done = false;
    i.onchange = () => {
      done = true;
      res(i.files[0] || null);
      i.remove();
    };
    window.addEventListener(
      'focus',
      () =>
        setTimeout(() => {
          if (!done && !i.files.length) {
            res(null);
            i.remove();
          }
        }, 600),
      { once: true }
    );
    document.body.append(i);
    i.click();
  });
}
/* reduz e (opcional) recorta em quadrado; devolve dataURL jpeg */
async function pickImage({ max = 256, square = false, quality = 0.85 } = {}) {
  const f = await vPickFile('image/*');
  if (!f) return null;
  const img = await vLoadImg(URL.createObjectURL(f));
  if (!img) {
    toast(t('badFile'));
    return null;
  }
  let sw = img.naturalWidth,
    sh = img.naturalHeight,
    sx = 0,
    sy = 0;
  if (square) {
    const s = Math.min(sw, sh);
    sx = (sw - s) / 2;
    sy = (sh - s) / 2;
    sw = sh = s;
  }
  const k = Math.min(1, max / Math.max(sw, sh)),
    c = document.createElement('canvas');
  c.width = Math.round(sw * k);
  c.height = Math.round(sh * k);
  c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', quality);
}
async function vPickBg(max = 3200) {
  const f = await vPickFile('image/*');
  if (!f) return null;
  const img = await vLoadImg(URL.createObjectURL(f));
  if (!img) {
    toast(t('badFile'));
    return null;
  }
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)),
    c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k);
  c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
  const rec = { id: uid(), blob, w: c.width, h: c.height };
  await DB.put('img', rec);
  return rec;
}

/* ---- cenários prontos (desenhados por código, sem arquivos) ---- */
const vRng = seed => () => {
  seed |= 0;
  seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const vShade = (hex, d) => {
  const n = parseInt(hex.slice(1), 16),
    f = x => Math.max(0, Math.min(255, x + d));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
};
function vPlanks(g, w, h, R, ph, base, vary, seam, len) {
  for (let y = 0; y < h; y += ph) {
    let x = -R() * len;
    while (x < w) {
      const l = len * (0.6 + R() * 0.8),
        d = (R() - 0.5) * vary;
      g.fillStyle = vShade(base, d);
      g.fillRect(x, y, l, ph);
      g.strokeStyle = vShade(base, d - 22);
      g.globalAlpha = 0.3;
      g.lineWidth = 1;
      for (let k = 0; k < 3; k++) {
        const yy = y + R() * ph;
        g.beginPath();
        g.moveTo(x, yy);
        g.lineTo(x + l, yy + (R() - 0.5) * 5);
        g.stroke();
      }
      g.globalAlpha = 1;
      g.fillStyle = seam;
      g.fillRect(x, y, 2, ph);
      x += l;
    }
    g.fillStyle = seam;
    g.fillRect(0, y, w, 2);
  }
}
function vBlots(g, w, h, R, n, cols, rmin, rmax, a) {
  for (let i = 0; i < n; i++) {
    g.globalAlpha = a * (0.4 + R() * 0.6);
    g.fillStyle = cols[(R() * cols.length) | 0];
    g.beginPath();
    g.arc(R() * w, R() * h, rmin + R() * (rmax - rmin), 0, 7);
    g.fill();
  }
  g.globalAlpha = 1;
}
function vSpeck(g, w, h, R, n, cols, s) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = cols[(R() * cols.length) | 0];
    g.globalAlpha = 0.25 + R() * 0.5;
    g.fillRect(R() * w, R() * h, s * (0.5 + R()), s * (0.5 + R()));
  }
  g.globalAlpha = 1;
}

const vCache = { base: {}, comp: {}, img: {}, thumb: {} };

function vBgBase(sc, onload) {

      .then(r => (r ? vLoadImg(URL.createObjectURL(r.blob)) : null))
      .then(i => {

  c.height = m.h;

    g.fillRect(0, 0, m.w, m.h);

      g,
      m.w,
      m.h,
      vRng(parseInt(hash(sc.id + bg.preset), 36) | 0),
      sc.cell || 64

}

    m = vMapSize(sc);

    bg.kind,
    bg.preset,
    bg.color,
    bg.imgId,
    bg.tint,
    bg.tintA,
    bg.dark,
    m.w,
    m.h,
    sc.cell,
    sc.id,
  ].join('|');
  if (vCache.comp[key]) return vCache.comp[key];
  if (!(bg.tint && bg.tintA > 0) && !(bg.dark > 0)) {
    vCache.comp = { [key]: base };
    return base;
  }
  const c = document.createElement('canvas');
  c.width = m.w;
  c.height = m.h;

  function present(on) {
    root.classList.toggle('present', on);
    if (on) {
      S.sel = null;
      S.meas = null;
      try {
        document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      } catch (e) {}
    } else {
      try {
        document.fullscreenElement && document.exitFullscreen();
      } catch (e) {}
    }
    setTimeout(() => {
      resize();
    }, 80);
  }
  document.addEventListener('fullscreenchange', function f() {
    if (!root.isConnected) {
      document.removeEventListener('fullscreenchange', f);
      return;

    if (!document.fullscreenElement && isPresent()) present(false);
  });

  function nextTurn() {
    const { ents } = mesaEnts();
    if (!ents.length) {

        L3(
          'Nenhuma ficha na Mesa do mestre.',
          'No sheets on the GM table.',
          'Keine Bögen am Spielleiter-Tisch.'
        )
      );
      return;
    }
    MESA.turn++;
    if (MESA.turn >= ents.length) {
      MESA.turn = 0;
      MESA.round++;
    }
    const e = ents[MESA.turn],
      tk = S.sc.tokens.find(k => k.ref && k.ref.k === (e.k === 'pc' ? 'pc' : 'npc') && k.ref.id === e.o.id);
    if (tk) {
      const m = M(),
        u = S.sc.cell || 64,
        s = tk.s || 1;
      S.view.x = (tk.x + s / 2) * u - S.W / S.view.z / 2;
      S.view.y = (tk.y + s / 2) * u - S.H / S.view.z / 2;
    }
    renderSide();
    redraw();

      if (!info || info.role !== 'pj') return;
      const cx = Math.floor(tk.x + (tk.s || 1) / 2),
        cy = Math.floor(tk.y + (tk.s || 1) / 2);
      for (let dx = -4; dx <= 4; dx++)
        for (let dy = -4; dy <= 4; dy++)

    });

    save();
    syncBar();
    redraw();
  }

  async function newScene() {
    const nm = h('input', {
      type: 'text',
      placeholder: L3('Ex.: Porto de Loguetown', 'E.g. Harbor town', 'z. B. Hafenstadt'),
    });
    let pre = 'masmorra';
    const sel = h(
      'select',
      BG_ORDER.map(id => h('option', { value: id }, tr(BGS[id].n)))
    );
    sel.onchange = () => {
      pre = sel.value;
    };
    modal({
      title: L3('Nova cena', 'New scene', 'Neue Szene'),
      body: h(
        'div',
        h('label.f', L3('Nome', 'Name', 'Name'), nm),
        h('label.f', L3('Ambiente inicial', 'Starting environment', 'Start-Umgebung'), sel)
      ),
      actions: [
        { label: t('cancel'), onClick: () => syncBar() },
        {
          label: t('add'),
          primary: true,
          onClick: () => {
            const s = vNewScene(nm.value.trim(), sel.value);
            V.scenes.push(s);
            Store.save();
            renderVTT(s.id);
          },
        },
      ],
      onClose: () => syncBar(),
    });
  }
  function renderSide() {
    const tk = S.sel && S.sc.tokens.find(k => k.id === S.sel);

      renderSideRemote();
      return;
    }
    const pr = S.selP && S.sc.props.find(k => k.id === S.selP);
    if (S.tool === 'terrain' || S.tool === 'prop') {
      const isT = S.tool === 'terrain';
      side.append(
        h(
          'h4',
          isT ? '🧱 ' + L3('Terreno', 'Terrain', 'Gelände') : '🪨 ' + L3('Objetos', 'Objects', 'Objekte')

        h(
          'p.muted',

          isT
            ? L3(
                'Escolha o material e arraste no mapa para pintar. Use o pincel da barra para áreas grandes.',
                'Pick a material and drag on the map to paint. Use the brush size for big areas.',
                'Material wählen und auf der Karte ziehen. Pinselgröße für große Flächen.'

                'Escolha o objeto e clique no mapa para colocar. Arraste para mover.',
                'Pick an object and click the map to place it. Drag to move.',

      );
      const items = isT
          ? TERR_ORDER.map(id => [id, TERR[id].ic, TERR[id].n, TERR[id].col])
          : PROP_ORDER.map(id => [id, PROPS[id].ic, PROPS[id].n, null]),
        sel = isT ? S.terrSel : S.propSel;
      side.append(
        h(
          'div.snd-pads',
          items.map(([id, ic, n, col]) =>
            h(
              'button.snd-pad' + (sel === id ? '.sel' : ''),

                  sel === id
                    ? {
                        borderColor: 'var(--accent)',

                      }
                    : {},
                onclick: () => {
                  if (isT) S.terrSel = id;
                  else S.propSel = id;
                  renderSide();
                },
              },
              col
                ? h(
                    'span.ic',
                    {
                      style: { background: col, borderRadius: '6px', padding: '2px 6px', fontSize: '1.2em' },
                    },

            )

      if (isT)
        side.append(

/* ===== RPG Master — mesa online (cliente). O servidor fica no PC do mestre: servidor/servidor.js ===== */
const Net = {
  role: null,
  base: '',
  key: '',
  name: '',
  id: '',
  es: null,
  players: [],
  scene: null,
  listen: false,
  chat: [],
  shareGM: false,
  relay: false,
  status: 'off',
  hooks: {},
  last: '',
  bgSent: {},
  gmOn: false,
  clean(b) {
    b = String(b || '')
      .trim()
      .replace(/\/+$/, '');
    if (b && !/^https?:\/\//i.test(b)) b = 'http://' + b;
    return b;
  },
  async ping(base) {
    try {
      const r = await fetch(base + '/ping', { cache: 'no-store' });
      const j = await r.json();
      return j && j.app === 'rpg-master' ? j : null;
    } catch (e) {
      return null;
    }
  },
  async post(path, body, key) {
    try {
      const r = await fetch(this.base + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-key': key ?? this.key },
        body: JSON.stringify(body),
      });
      return await r.json().catch(() => ({}));
    } catch (e) {
      return null;
    }
  },
  stream(url, onHello) {
    this.close();
    const es = (this.es = new EventSource(this.base + url));
    this.status = 'connecting';
    es.onopen = () => {
      this.status = 'on';
      this.emit();
    };
    es.onerror = () => {
      this.status = es.readyState === 2 ? 'off' : 'reconnecting';
      this.emit();
    };
    es.onmessage = ev => {
      let m;
      try {
        m = JSON.parse(ev.data);
      } catch (e) {
        return;
      }
      this.handle(m, onHello);
    };
  },
  close() {
    if (this.es) {
      this.es.close();
      this.es = null;
    }
  },
  emit() {
    try {
      this.hooks.status && this.hooks.status();
      document.querySelectorAll('.net-chip').forEach(c => c._upd && c._upd());
    } catch (e) {}
  },
  async startGM(base, key) {
    base = this.clean(base);
    const info = await this.ping(base);
    if (!info)
      return L3(
        'Não encontrei o servidor nesse endereço. Ele está ligado?',
        'Server not found at that address. Is it running?',
        'Server unter dieser Adresse nicht gefunden. Läuft er?'
      );
    this.base = base;
    this.key = key.trim();
    this.role = 'gm';
    this.bgSent = {};
    this.last = '';
    return new Promise(res => {
      let done = false;
      this.stream('/events?role=gm&key=' + encodeURIComponent(this.key));
      const t = setTimeout(() => {
        if (!done) {
          done = true;
          this.leave();
          res(L3('Sem resposta do servidor.', 'No response from server.', 'Keine Antwort vom Server.'));
        }
      }, 6000);
      this._ready = e => {
        if (done) return;
        done = true;
        clearTimeout(t);
        if (e) {
          this.leave();
          res(e);
        } else {
          this.push(true);
          res(null);
        }
      };
    });
  },
  async join(base, name, pass) {
    base = this.clean(base);
    const info = await this.ping(base);
    if (!info)
      return L3(
        'Não encontrei o servidor nesse endereço.',
        'Server not found at that address.',
        'Server nicht gefunden.'
      );
    this.base = base;
    const r = await this.post('/join', { name, pass: pass || '' }, '');
    if (!r || !r.ok)
      return (r && r.erro) || L3('Não consegui entrar.', 'Could not join.', 'Beitritt fehlgeschlagen.');
    this.role = 'player';
    this.id = r.id;
    this.name = r.name;
    this.players = r.players || [];
    this.scene = null;
    return new Promise(res => {
      let done = false;
      this.stream('/events?id=' + this.id);
      const t = setTimeout(() => {
        if (!done) {
          done = true;
          this.leave();
          res(L3('Sem resposta do servidor.', 'No response from server.', 'Keine Antwort vom Server.'));
        }
      }, 6000);
      this._ready = e => {
        if (done) return;
        done = true;
        clearTimeout(t);
        if (e) {
          this.leave();
          res(e);
        } else res(null);
      };
    });
  },
  leave() {
    this.close();
    const was = this.role;
    this.role = null;
    this.scene = null;
    this.status = 'off';
    this.players = [];
    this.hooks = {};
    this.emit();
    return was;
  },
  handle(m) {
    if (m.type === 'error') {
      this._ready && this._ready(m.erro || 'Erro');
      toast(m.erro || 'Erro');
      return;
    }
    if (m.type === 'hello') {
      this.players = m.players || [];
      this.gmOn = !!m.gm;
      this._ready && this._ready(null);
      if (this.role === 'player' && m.snap) this.onSnap(m.snap);
      this.hooks.players && this.hooks.players();
      this.emit();
      return;
    }
    if (m.type === 'players') {
      this.players = m.list || [];
      this.hooks.players && this.hooks.players();
      this.emit();
      return;
    }
    if (m.type === 'gm') {
      this.gmOn = m.on;
      this.hooks.players && this.hooks.players();
      return;
    }
    if (m.type === 'snap') {
      this.onSnap(m.data);
      return;
    }
    if (m.type === 'tok') {
      const tk = this.scene && this.scene.tokens.find(k => k.id === m.tokenId);
      if (tk) {
        tk.x = m.x;
        tk.y = m.y;
        this.hooks.redraw && this.hooks.redraw();
      }
      return;
    }
    if (m.type === 'move') {
      this.hooks.move && this.hooks.move(m);
      return;
    }
    if (m.type === 'chat') {
      this.chat.push(m);
      if (this.chat.length > 80) this.chat.shift();
      this.hooks.chat && this.hooks.chat(m);
      return;
    }
    if (m.type === 'snd' && this.role === 'player' && this.listen) {
      try {
        Net.relay = false;
        if (m.act === 'play') Snd.play(m.id);
        else if (m.act === 'startAmb') Snd.startAmb(m.id);
        else if (m.act === 'stopAmb') Snd.stopAmb();
        else if (m.act === 'stopAll') Snd.stopAll();
      } catch (e) {}
    }
  },
  onSnap(sc) {
    sc.terr = sc.terr || {};
    sc.props = sc.props || [];
    sc.tokens = sc.tokens || [];
    if (
      sc.bg &&
      sc.bg.kind === 'img' &&
      !(vCache.img[sc.bg.imgId] && vCache.img[sc.bg.imgId] !== 'x') &&
      !this._loading
    ) {
      const id = sc.bg.imgId;
      if (!vCache.img[id]) {
        vCache.img[id] = 'x';
        const im = new Image();
        im.crossOrigin = 'anonymous';
        im.onload = () => {
          vCache.img[id] = im;
          vCache.comp = {};
          this.hooks.redraw && this.hooks.redraw();
        };
        im.src = this.base + '/bg/' + id;
      }
    }
    this.scene = sc;
    if (this.hooks.snap) this.hooks.snap(sc);
    else if (this.role === 'player') renderVTT(null, { remote: true });
  },
  /* --- lado do mestre --- */
  dirty() {
    if (this.role !== 'gm') return;
    clearTimeout(this._dt);
    this._dt = setTimeout(() => this.push(), 140);
  },
  async push(force) {
    if (this.role !== 'gm' || !this.es) return;
    const snap = vSnapshot();
    if (!snap) return;
    const str = JSON.stringify(snap);
    if (!force && str === this.last) return;
    this.last = str;
    if (snap.bg.kind === 'img' && !this.bgSent[snap.bg.imgId]) {
      const r = await DB.get('img', snap.bg.imgId);
      if (r) {
        await this.post('/gm', { type: 'bg', id: snap.bg.imgId, data: await blobToData(r.blob) });
        this.bgSent[snap.bg.imgId] = 1;
      }
    }
    await this.post('/gm', { type: 'snap', data: snap });
  },
  say(text, kind) {
    if (this.role === 'gm')
      this.post('/gm', { type: 'chat', from: L3('Mestre', 'GM', 'Spielleiter'), text, kind });
    else if (this.role === 'player') this.post('/act', { id: this.id, type: 'chat', text, kind });
  },
  roll(e) {
    if (!this.role || (this.role === 'gm' && !this.shareGM)) return;
    this.say(
      e.title +
        ': ' +
        e.total +
        (e.detail ? '  (' + e.detail + ')' : '') +
        (e.crit ? ' ★' : e.fail ? ' ✖' : ''),
      'roll'
    );
  },
  relaySnd(act, id) {
    if (this.role === 'gm' && this.relay && this.es) this.post('/gm', { type: 'snd', act, id });
  },
};
/* mestre: o painel de som também toca nos jogadores (efeitos e ambientes, quando ligado) */
(function () {
  const S = Snd,
    o = { play: S.play, startAmb: S.startAmb, stopAmb: S.stopAmb, stopAll: S.stopAll };
  S.play = function (...a) {
    if (a.length === 1) Net.relaySnd('play', a[0]);
    return o.play.apply(S, a);
  };
  S.startAmb = function (id) {
    Net.relaySnd('startAmb', id);
    return o.startAmb.call(S, id);
  };
  S.stopAmb = function (...a) {
    if (!a.length) Net.relaySnd('stopAmb');
    return o.stopAmb.apply(S, a);
  };
  S.stopAll = function () {
    Net.relaySnd('stopAll');
    return o.stopAll.call(S);
  };
  const sv = Store.save;
  Store.save = function () {
    const r = sv.apply(Store, arguments);
    try {
      Net.dirty();
    } catch (e) {}
    return r;
  };
  setInterval(() => {
    if (Net.role === 'gm') Net.dirty();
  }, 4000);
})();

  c._upd = () => {

    c.textContent =
      '🌐 ' +
      (Net.role === 'gm' ? L3('Online', 'Online', 'Online') : Net.name) +
      ' · ' +
      (Net.status === 'on' ? '●' : '○') +
      ' ' +
      Net.players.length;
  };
  c._upd();
  return c;
}
function defaultBase() {
  return /^https?:$/.test(location.protocol) ? location.origin : 'http://localhost:3000';
}
function onlineDialogGM() {
  const wrap = h('div'),
    base = h('input', { type: 'text', value: localStorage.getItem('rpgm.base') || defaultBase() }),
    key = h('input', {
      type: 'text',
      placeholder: 'ex.: a1b2c3',
      value: localStorage.getItem('rpgm.key') || '',
    });
  const m = modal({
    title:
      '🌐 ' +
      L3(
        'Mesa online (você é o mestre)',
        'Online table (you are the GM)',
        'Online-Tisch (du bist Spielleiter)'
      ),
    body: wrap,
    actions: [{ label: t('close') }],
  });
  const draw = () => {
    if (Net.role === 'gm' && Net.es) {
      const snd = h('input', {
          type: 'checkbox',
          checked: Net.relay,
          onchange: e => {
            Net.relay = e.target.checked;
          },
        }),
        roll = h('input', {
          type: 'checkbox',
          checked: Net.shareGM,
          onchange: e => {
            Net.shareGM = e.target.checked;
          },
        });
      wrap.replaceChildren(
        h(
          'p',
          h(
            'b',
            Net.status === 'on'
              ? '● ' + L3('Conectado', 'Connected', 'Verbunden')
              : '○ ' + L3('Reconectando…', 'Reconnecting…', 'Verbinde neu…')
          ),
          ' · ' + Net.base
        ),
        h(
          'div.sec-t',
          L3('Jogadores na mesa', 'Players at the table', 'Spieler am Tisch') +
            ' (' +
            Net.players.length +
            ')'
        ),
        Net.players.length
          ? h(
              'div.vtt-chips',
              Net.players.map(n => h('span.pill', n))
            )
          : h(
              'p.muted',
              L3(
                'Ninguém entrou ainda. Passe o endereço do servidor aos jogadores.',
                'Nobody yet. Give the server address to your players.',
                'Noch niemand. Gib den Spielern die Serveradresse.'
              )
            ),
        h(
          'label',
          { style: { display: 'flex', gap: '8px', alignItems: 'center', margin: '8px 0' } },
          snd,
          L3(
            'Tocar para os jogadores os efeitos e ambientes que eu disparar',
            'Play the effects and ambiences I trigger for the players too',
            'Meine Effekte und Ambiente auch bei den Spielern abspielen'
          )
        ),
        h(
          'label',
          { style: { display: 'flex', gap: '8px', alignItems: 'center', margin: '8px 0' } },
          roll,
          L3(
            'Mostrar minhas rolagens de dados no chat',
            'Show my dice rolls in the chat',
            'Meine Würfe im Chat zeigen'
          )
        ),
        h(
          'p.muted',
          { style: { fontSize: '.85em' } },
          L3(
            'Para os jogadores moverem os bonecos: clique no token e escolha “Controlado por”. Só o que está visível (sem névoa e sem ocultos) é enviado a eles.',
            'To let players move tokens: click a token and pick “Controlled by”. Only visible things (no fog, no hidden items) are sent to them.',
            'Damit Spieler Token bewegen: Token anklicken und „Gesteuert von“ wählen. Gesendet wird nur Sichtbares.'
          )
        ),
        h(
          'button.btn.danger',
          {
            type: 'button',
            onclick: () => {
              Net.leave();
              draw();
            },
          },
          L3('Desconectar', 'Disconnect', 'Trennen')
        )
      );
    } else {
      wrap.replaceChildren(
        h(
          'p.muted',
          { style: { marginTop: 0 } },
          L3(
            'Ligue o servidor no seu PC (arquivo Iniciar-Servidor), copie a chave que ele mostra e conecte aqui.',
            'Start the server on your PC (Iniciar-Servidor file), copy the key it shows and connect here.',
            'Starte den Server auf deinem PC (Datei Iniciar-Servidor), kopiere den Schlüssel und verbinde dich hier.'
          )
        ),
        h('label.f', L3('Endereço do servidor', 'Server address', 'Serveradresse'), base),
        h('label.f', L3('Chave do mestre', 'GM key', 'Spielleiter-Schlüssel'), key),
        h('p#neterr', { style: { color: 'var(--bad)', minHeight: '1.2em' } }),
        h(
          'button.btn.primary',
          {
            type: 'button',
            onclick: async e => {
              e.target.disabled = true;
              const r = await Net.startGM(base.value, key.value);
              e.target.disabled = false;
              if (r) {
                $('#neterr').textContent = r;
                return;
              }
              localStorage.setItem('rpgm.base', Net.base);
              localStorage.setItem('rpgm.key', Net.key);
              draw();
              buildTop();
            },
          },
          '🌐 ' + L3('Conectar', 'Connect', 'Verbinden')
        )
      );
    }
  };
  Net.hooks.players = () => {
    if (document.body.contains(wrap)) draw();
  };
  draw();
}
function joinDialog() {
  const base = h('input', {
    type: 'text',
    value: localStorage.getItem('rpgm.pbase') || defaultBase(),
    placeholder: 'http://26.0.0.1:3000',
  });
  const first = Object.values(Store.data.chars)[0],
    name = h('input', {
      type: 'text',
      value: localStorage.getItem('rpgm.pname') || (first && first.name) || '',
    }),
    pass = h('input', {
      type: 'text',
      placeholder: L3('(se o mestre pediu)', '(if the GM asked)', '(falls verlangt)'),
    });
  modal({
    title: '🌐 ' + L3('Entrar na mesa online', 'Join online table', 'Online-Tisch beitreten'),
    body: h(
      'div',
      h(
        'p.muted',
        { style: { marginTop: 0 } },
        L3(
          'Peça ao mestre o endereço do servidor (ex.: http://26.1.2.3:3000) e digite seu nome.',
          'Ask the GM for the server address (e.g. http://26.1.2.3:3000) and type your name.',
          'Frag den Spielleiter nach der Serveradresse und gib deinen Namen ein.'
        )
      ),
      h('label.f', L3('Endereço do mestre', 'GM address', 'Adresse'), base),
      h('label.f', L3('Seu nome na mesa', 'Your table name', 'Dein Name'), name),
      h('label.f', L3('Senha da mesa', 'Table password', 'Passwort'), pass),
      h('p#neterr', { style: { color: 'var(--bad)', minHeight: '1.2em' } })
    ),
    actions: [
      { label: t('cancel') },
      {
        label: L3('Entrar', 'Join', 'Beitreten'),
        primary: true,
        onClick: async () => {
          const r = await Net.join(base.value, name.value, pass.value);
          if (r) {
            toast(r, 4000);
            return false;
          }
          localStorage.setItem('rpgm.pbase', Net.base);
          localStorage.setItem('rpgm.pname', Net.name);
          buildTop();
          if (Net.scene) renderVTT(null, { remote: true });
          else waitingView();
        },
      },
    ],
  });
}
function waitingView() {
  document.querySelectorAll('.ovl').forEach(o => o.remove());
  const v = $('#view');
  v.replaceChildren(
    h(
      'div.home',
      h(
        'div.hero',
        h('h1', '🌐 ' + L3('Conectado!', 'Connected!', 'Verbunden!')),
        h(
          'p',
          L3(
            'Aguardando o mestre abrir a Mesa virtual…',
            'Waiting for the GM to open the virtual tabletop…',
            'Warte darauf, dass der Spielleiter den virtuellen Tisch öffnet…'
          )
        )
      ),
      h(
        'button.btn',
        {
          onclick: () => {
            Net.leave();
            goHome();
          },
        },
        '← ' + L3('Sair da mesa', 'Leave table', 'Tisch verlassen')
      )
    )
  );
}
</script>
</body>
</html>
