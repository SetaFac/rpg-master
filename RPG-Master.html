  {"s":"Gerais","n":"Apostador","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Sabedoria ou Vontade 16","d":"Você gosta de viver no fio da navalha, enxergando em todas as situações chances incertas que podem garantir a vitória ou a derrota. Antes de saber se uma Técnica de Combate que possua jogada de ataque acertou ou falhou, você pode escolher se arriscar e jogar um d6, recebendo as seguintes modificações, dependendo do resultado: Resultado 1 a 3: A jogada de ataque falha em acertar o alvo. Resultado 4: Escolha entre a jogada de ataque receber 1 dado de dano extra ou você recuperar 1 PP. Resultado 5: Escolha entre a jogada de ataque receber 2 dados de dano extra ou você recuperar 2 PP. Resultado 6: Escolha entre a jogada de ataque receber 3 dados de dano extra ou você recuperar 3 PP."},
  {"s":"Gerais","n":"Ator","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Sim · Req.: Sabedoria ou Presença 16","d":"Ao terminar este treinamento, você se torna a personificação do que quiser assumir o papel, tendo alta confiança na própria interpretação. Ao fazer um Teste de Atributo de Presença (Atuação), você obtém sucesso automático, no primeiro teste. Ao realizar um segundo teste, você recebe vantagem e, em um terceiro teste, recebe +2 de bônus. Essa característica se aplica em cada criatura, individualmente. Após os 3 primeiros testes, essa característica só pode ser usada novamente, com a mesma pessoa, após um intervalo de 24 horas."},
  {"s":"Gerais","n":"Bom Nadador","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Força ou Constituição 14","d":"Você se torna capaz de realizar manobras e mudar a velocidade livremente, sem perder o controle do corpo dentro d’água. Recebendo as seguintes características: Seu deslocamento de natação passa a ser de 15 metros; Você não recebe penalidades de criaturas não aquáticas; Pode manter sua respiração presa por até 10 minutos; Recebe vantagem em Salvaguardas de Constituição para manter a respiração presa, mesmo ao receber dano. Usuários que comerem uma Akuma no Mi podem trocar esse aprimoramento pela mesma quantidade de Pontos de Treinamentos gastos. Caso não tenha usado PT para aprender este treinamento, o personagem recebe o que foi usado em troca (nova escolha da característica usada, por exemplo)."},
  {"s":"Gerais","n":"Brigão Experiente","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Presença 14","d":"Você simplesmente ama brigar e provavelmente brigou a vida inteira. Chegou ao ponto que, facilmente, inicia uma briga por mero prazer. Toda vez que seu personagem incita o início de um combate com um Teste de Atributo de Sabedoria (Provocar), caso a criatura não passe neste Teste, a primeira jogada de dano de uma jogada de ataque corpo a corpo ou à distância, contra esta criatura, causará o dobro do dano."},
  {"s":"Gerais","n":"Corredor","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Força ou Constituição 15","d":"Seu personagem adquire grande disposição e fôlego acima do comum para corridas. Independente dos seus atributos físicos. Ao terminar este treino, você pode escolher uma entre as 2 seguintes opções, abaixo: Corrida de Obstáculos: Não recebe penalidade de deslocamento por terreno difícil. Corrida de Longa Distância: Seu deslocamento normal se torna 15 metros."},
  {"s":"Gerais","n":"Desarmador","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Sim · Req.: Força ou Destreza 16","d":"Com um treinamento especializado em desarmar criaturas que estejam empunhando qualquer tipo de arma, você se torna o pior pesadelo de qualquer espadachim ou atirador. Você pode fazer uma jogada de ataque corpo a corpo, que substitui uma jogada de ataque comum e tentar desarmar uma criatura alvo. Que deve fazer um Teste de Atributo de Força ou Destreza, que será comparado ao resultado da sua jogada, caso o resultado do teste da criatura alvo seja maior ou igual ao seu, ela não será desarmada. Caso o resultado seja menor, a arma que ela esteja segurando cairá em um espaço desocupado a até 1,5 metro da criatura desarmada. Quando a sua jogada de ataque (que tiver a intenção de desarmar o alvo) tiver um acerto crítico natural, o alvo será desarmado sem a necessidade de um teste e, com uma ação bônus, você pode pegar a arma para você (caso possua no mínimo uma mão livre)."},
  {"s":"Gerais","n":"Equilíbrio Perfeito","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Destreza ou Vontade 13","d":"Em condições normais, o personagem sempre consegue se manter em pé, mesmo em tremores muito intensos, independente de quão estreita é a superfície na qual ele está andando (uma corda esticada, uma saliência, um galho de árvore, etc.). Além disso, sempre que fizer uma Salvaguarda para não ser derrubado, jogue com vantagem."},
  {"s":"Gerais","n":"Improvisador","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Sabedoria 14","d":"É possível arquitetar pequenas e grandes experiências ciente (ou não) dos resultados que elas podem causar. O personagem pode resolver problemas que exijam algum material específico que ele não possui, utilizando em seu lugar algo que ele adaptou. O personagem deve primeiro descrever ao Narrador como deseja fazer tal improvisação e logo após se o Narrador aprovar ele deve fazer um Teste de Atributo de Sabedoria para ver se o improviso deu certo."},
  {"s":"Gerais","n":"Jogador Experiente","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Sim · Req.: Sabedoria ou Vontade 14","d":"O treinamento certo para ser um profissional dos jogos de azar. Podendo servir para descobrir se o jogo está sendo de alguma forma manipulado, identificar quem são os melhores piores jogadores, ou “estimar as chances” em qualquer situação delicada. Você recebe vantagem em Testes de Atributo de Vontade (Intuição) que tenham relação com jogos de azar."},
  {"s":"Gerais","n":"Ladrão","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Destreza ou Sabedoria 16","d":"O ladrão é aquele que consegue entrar em qualquer lugar, roubar qualquer objeto e ainda sair sem ser percebido. Poucas pessoas conseguem agir de maneira tão furtiva. Ao terminar este treinamento, você recebe as seguintes características: Desde que o Narrador diga que é possível, você pode fazer um Teste de Atributo de Destreza (Prestidigitação) CD 16 para tentar pegar um objeto específico na posse de uma criatura, sem que ela perceba. Em caso de falha, você pode repetir o teste para que ela não perceba a tentativa de furto; Caso exista, você pode fazer um Teste de Atributo de Vontade (Percepção) CD 14 para tentar achar um local onde os ladrões se reúnem, onde se pode comprar informações e equipamentos de difícil acesso; Você pode adicionar seu bônus de proficiência no uso de kits de disfarce, kits de falsificação e kits para abrir cadeado."},
  {"s":"Gerais","n":"Genialidade Inusitada","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Constituição ou Sabedoria 12","d":"Você aprende uma nova Técnica de Combate de 1º Grau, seja para o seu Estilo de Combate ou de Akuma no Mi (caso possua). A criação desta nova técnica deve respeitar as regras impostas no Capítulo 3 (para técnicas de Estilo de Combate) ou do Capítulo 6 (para técnicas de Akuma no Mi). Após realizar este treinamento ao menos uma vez, você pode treiná-lo novamente para receber mais técnicas ou Points, caso possua uma Zoan. Também liberando a possibilidade de aprendizado de técnicas com grau mais alto. Para aprender técnicas de grau maior que 1, as seguintes exigências devem ser cumpridas: 2º Grau/2º Point: 1 Ponto de Treinamento e 5 dias de treinamento; 3º Grau/3º Point: 2 Pontos de Treinamento e 10 dias de treinamento; 4º Grau/4º Point: 2 Pontos de Treinamento e 10 dias de treinamento; 5º Grau/5º Point: 2 Pontos de Treinamento e 10 dias de treinamento; 6º Grau: 3 Pontos de Treinamento e 15 dias de treinamento; 7º Grau: 3 Pontos de Treinamento e 15 dias de treinamento;"},
  {"s":"Gerais","n":"Soru","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Sim · Req.: Força ou Destreza 18","d":"Você pode executar a Técnica Auxiliar “Soru” do Estilo de Combate “Usuário de Rokushiki”, mantendo todas as suas características."},
  {"s":"Gerais","n":"Adepto Elemental","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Não · Req.: Sabedoria 14","d":"Você desenvolve uma grande aptidão com um elemento específico, além da capacidade de usá-lo de forma eficaz em combate. Escolha um dos seguintes tipos de dano: “Ácido”, “Elétrico”, “Fogo”, “Frio” ou “Veneno”. Uma vez por rodada, usando uma ação bônus, você pode adicionar 1d10 do tipo de dano escolhido em uma jogada de ataque (comum ou de Técnica). Essa característica pode ser usada uma quantidade de vezes igual ao seu nível de personagem e você recupera todos os seus usos ao término de um descanso longo. Alternativamente, você pode usar essa característica de forma conjunta com a sua jogada de ataque ou técnica, sem necessidade de uma ação bônus. Essa forma alternativa pode ser usada até 5 vezes, respeitado o uso limitado pelo seu nível de personagem e você recupera todos os seus usos ao término de um descanso longo. Por exemplo, se você tiver 10 usos disponíveis e optar por usar a forma alternativa 5 vezes, ainda terá 5 usos restantes para o uso padrão com ação bônus. Só é possível usar essa característica uma vez por rodada, independentemente de ter sido utilizado na forma padrão ou na alternativa. Essa limitação também se aplica a características semelhantes, como a Manifestação de Poder Especial “Potencializador Ofensivo” da Akuma no Mi. Lunarianos, Minks e seus mestiços não recebem esses benefícios. Em vez disso, o dado de dano do Heat ou do Electro é aumentado para 1d12."},
  {"s":"Gerais","n":"Alquimista","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Sim · Req.: Sabedoria 17","d":"Você recebe proficiência nos kits de veneno e herbalismo e se torna capaz de usar suas proficiências em testes específicos. Você se torna capaz de criar, extrair, identificar e manusear venenos e antídotos. Todas as informações estão presentes no Capítulo 8, mais a frente nesse livro."},
  {"s":"Gerais","n":"Botânico","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Sim · Req.: Destreza ou Sabedoria 18","d":"O personagem ganha um vasto conhecimento de grande parte da flora espalhada pelo mundo. Em Testes de Atributo de História, Intuição, Investigação, Percepção, Prestidigitação e Sobrevivência, relacionados ao mundo vegetal, o personagem pode fazer os testes com vantagem. O personagem também se torna apto a usar e cultivar as sementes Pop Green, com informações e regras presentes no Guia do Narrador."},
  {"s":"Gerais","n":"Combatente Montado","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Não · Req.: Força ou Destreza 13","d":"Você se torna um oponente perigoso de se enfrentar quando está montado, você é capaz de domar qualquer animal que não seja lendário ou abissal e que seja propício à montaria com um Teste de Atributo de Presença (Persuasão) CD 12 + o ND da criatura. Enquanto estiver montado e não estiver incapacitado, você tem vantagem nas jogadas de ataque corpo a corpo contra qualquer criatura desmontada que seja menor que a sua montaria. Você pode forçar um ataque direcionado a sua montaria para ser direcionado em você, no seu lugar. Se sua montaria for alvo de um efeito que permita a ela realizar uma Salvaguarda de Destreza para reduzir o dano à metade, ao invés disso, ela não sofre qualquer dano se for bem-sucedida na Salvaguarda, e apenas metade se falhar."},
  {"s":"Gerais","n":"Copiador","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Não · Req.: Destreza ou Sabedoria 17","d":"Você aprende a canalizar sua atenção para analisar detalhadamente outras criaturas e a movimentação de seus músculos, percebendo até mesmo pequenas peculiaridades e entendendo a força e velocidade aplicadas no processo. Após observar uma Técnica de Combate ou Técnica Auxiliar ao menos duas vezes, você é capaz de replicá-la como se fosse uma de suas próprias técnicas, desde que possua os mesmos requisitos necessários ou consiga compensá-los de alguma forma (com a aprovação do Narrador). Por exemplo, a Técnica de Combate do Brutamontes “Nari Kabura” requer um kanabo, portanto, não será possível replicá-la sem esse item ou um semelhante. Outro exemplo é a Técnica de Combate “Hiken” utilizada por usuários da Mera-Mera no Mi (Fruto da Chama). Mesmo que você não seja capaz de criar fogo, poderá replicar a técnica se tiver uma quantidade de fogo suficiente (a critério do Narrador), como através de gases inflamáveis ou materiais similares. Você consegue armazenar até 3 técnicas na memória, podendo usá-las sempre que desejar ao custo de Pontos de Poder igual ao da técnica original +1 PP. A qualquer momento, você pode escolher substituir uma das técnicas memorizadas por uma nova."},
  {"s":"Gerais","n":"Controle Corporal","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Não · Req.: Destreza ou Constituição 16","d":"Você recebe total domínio do próprio corpo, podendo manipular cada fio de cabelo. Consegue controlar seu metabolismo, tamanho corporal e seu cabelo ou pelos. Recebe as seguintes características: Você consegue controlar seu cabelo ou barba como uma mão, braço ou perna. Podendo realizar técnicas ou ataques, que tenham como alcance “Toque”; Você não recebe a condição “Impedido” sem estar também com os cabelos presos ou cortados; Você se torna capaz de controlar seu metabolismo, podendo engordar em alguns minutos, conforme ingere uma grande quantidade de alimentos, ou emagrecer instantaneamente e ficar com uma forma esbelta; Caso seja um usuário de fruto Zoan e estiver na forma híbrida, você pode modelar as proporções do seu corpo, para melhor atender certas situações. Desta forma, você pode modificar alguns atributos (Força, Destreza e Constituição), conforme modifica o próprio corpo. Usando uma ação bônus, você pode assumir as seguintes formas: Corpo Largo: Reduz 2 pontos em Destreza e aumenta 2 pontos em Força, até o máximo de 28. Seu corpo fica maior e com mais potência nos membros. Corpo Magro: Reduz 2 pontos em Força e aumenta 2 pontos em Destreza, até o máximo de 28. Seu corpo fica mais magro e suas pernas aumentam. Corpo Grande: Reduz 2 pontos em Força ou Destreza e aumenta 2 pontos em Constituição, até o máximo de 28. Seu corpo fica maior, principalmente no tronco (não altera seus Pontos de Vida)."},
  {"s":"Gerais","n":"Especialista em Combate Aéreo","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Não · Req.: Força ou Destreza 15","d":"Quando estiver no ar, se deslocar contra a gravidade, não haverá penalidade de 1,5 metro para cada 1,5 metro percorridos, você recebe vantagem em todas as suas jogadas de ataques enquanto estiver lutando no ar, em Salvaguardas de Destreza e em testes para não cair. Caso enfrente uma criatura que também esteja no ar, quando ela fizer um teste para não cair por causa de um de seus ataques, o teste é feito com desvantagem. Se você usar técnicas que gastam Pontos de Poder para receber deslocamento de voo, você pode escolher gastar 1 PP a mais para receber deslocamento de voo de 9 metros por 1 minuto e se manter no ar."},
  {"s":"Gerais","n":"Estrategista","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Não · Req.: Sabedoria ou Presença 16","d":"Você possui uma capacidade tática notável, consegue organizar melhor as tropas e fazer planos bem elaborados. Pessoas que seguem os planos feitos por você recebem um bônus de +2 em todos os Testes de Atributo e Salvaguardas enquanto os acontecimentos estiverem dentro do planejado. Este bônus é perdido quando os personagens deixam de seguir o plano ou quando os acontecimentos se desviam muito do previsto."},
  {"s":"Gerais","n":"Geppo","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Sim · Req.: Força ou Destreza 18","d":"Você pode executar a Técnica Auxiliar “Geppo” do Estilo de Combate “Usuário de Rokushiki”, mantendo todas as suas características."},
  {"s":"Gerais","n":"Kamie","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Sim · Req.: Destreza 18","d":"Você pode executar a Técnica Auxiliar “Kamie” do Estilo de Combate “Usuário de Rokushiki”, mantendo todas as suas características."},
  {"s":"Gerais","n":"Resistência à Kairoseki","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Não · Req.: Constituição ou Vontade 16","d":"Treinamento exclusivo para usuários de Akuma no Mi. Com seu vigor ou força de vontade, mesmo sobre os efeitos de kairoseki, você ainda consegue se manter forte. Quando estiver com a condição “Enfraquecido”, apenas quando for aplicada pelo contato com kairoseki (não se aplica ao mar), as características normais da condição são substituídas pelas seguintes: O deslocamento de uma criatura enfraquecida diminui em -3 metros, e ela não pode se beneficiar de qualquer bônus em seu deslocamento. Seu deslocamento de natação se torna 0; A criatura não pode usar reações; A criatura fica incapacitada de usar qualquer técnica ou característica recebida por uma Akuma no Mi; A criatura recebe desvantagem em Testes de Atributo de Força; Quando usar uma ação para realizar um ataque, a criatura não pode realizar mais de 2 ataques em uma mesma rodada; A criatura tem desvantagem em Salvaguardas de Força e Constituição; A condição encerra se a causa do enfraquecimento for removida."},
  {"s":"Gerais","n":"Tekkai","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Sim · Req.: Força ou Constituição 18","d":"Você pode executar a Técnica Auxiliar“Tekkai” do Estilo de Combate “Usuário de Rokushiki”, mantendo todas as suas características."},
  {"s":"Gerais","n":"Técnica Ás","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Não · Req.: Força ou Destreza 14","d":"Escolha uma Técnica de Combate e receba vantagem nas jogadas de ataque que fizer com ela ou imponha desvantagem em uma Salvaguarda que ela pedir. Ao usar esta técnica você também pode jogar o dado de dano duas vezes e escolher o maior."},
  {"s":"Gerais","n":"Algoz de Usuários de Akuma No Mi","pt":5,"c":"Complexos · 15 dias · 5 PT · Tutor: Não · Req.: Vontade 15","d":"Após observar e estudar profundamente sobre as Akuma no Mi, treinando sua mente para enfrentar as habilidades mais imprevisíveis e desenvolvendo estratégias para combatê-las, você recebe os seguintes benefícios: Você tem vantagem em Salvaguardas contra os efeitos e condições das Akuma no Mi provenientes de outras criaturas e pode adicionar seu bônus de proficiência a essas Salvaguardas. Sempre que falhar em uma Salvaguarda contra a habilidade de Akuma no Mi de uma criatura, você pode optar por considerá-la um sucesso. Essa característica pode ser usada até 3 vezes, e todos os seus usos são recuperados ao término de um descanso longo. Além disso, ao finalizar esse treinamento, você adquire ou encontra uma arma especial de sua escolha, projetada para combater usuários de Akuma no Mi. Essa arma é capaz de afetar esses alvos em jogadas de ataque corpo a corpo, independentemente de suas habilidades. O Narrador decide como essa arma é obtida e suas características. Por exemplo, você pode encontrar um machado com dentes de kairoseki incrustados na lâmina."},
  {"s":"Gerais","n":"Arte do Tempo","pt":5,"c":"Complexos · 15 dias · 5 PT · Tutor: Não · Req.: Sabedoria 19","d":"Você usa seu tempo lendo e aprendendo sobre os fenômenos climáticos. Após ganhar o conhecimento necessário, você começa a entender as causas e efeitos que levam à formação de nuvens, chuvas, tempestades, furacões, raios, ventos e outros fenômenos. Quando alguém faz este treinamento, se torna apto a manipular o Clima-Tact, com informações e regras presentes no Guia do Narrador."},
  {"s":"Gerais","n":"Auto-Aperfeiçoamento","pt":5,"c":"Complexos · 15 dias · 5 PT · Tutor: Não · Req.: Qualquer Atributo 16","d":"Você passa a se concentrar nas suas próprias fraquezas e em como superá-las. Ao final desse treinamento, você aprimora o seu atributo de Força, Destreza, Constituição, Sabedoria, Presença ou Vontade. O atributo recebe permanentemente um aumento de +1 e você não pode elevar um atributo em um valor maior que 20 com esse treinamento. Esse treinamento pode ser escolhido repetidamente pelo mesmo personagem."},
  {"s":"Gerais","n":"Conhecimento Celestial","pt":5,"c":"Complexos · 15 dias · 5 PT · Tutor: Não · Req.: Sabedoria 15","d":"Ao se deparar com Dials (presentes no Guia do Narrador) você facilmente entende sua engenharia e mecanismos, mesmo que essas tecnologias sejam totalmente alienígenas para você. Você sabe identificar, conhece a funcionalidade e se torna proficiente no uso de cada dial só ao examiná-los por alguns segundos. Quando você usar um dial com a propriedade “Absorção Rápida”, que exigem uma ação “Preparar” para absorver um elemento ou impacto, você pode escolher usar sua reação no lugar. Você também pode apertar o botão do dial e acionar as funções “Absorção” ou “Liberação” com uma ação bônus."},
  {"s":"Gerais","n":"Guerreiro Treinado","pt":5,"c":"Complexos · 15 dias · 5 PT · Tutor: Não · Req.: Força ou Constituição 16","d":"Ao completar este treinamento, você se torna um guerreiro de combate corpo a corpo e recebe as seguintes características: Seu ataque desarmado se torna 1d4, caso já possua ou venha a possuir um outro ataque desarmado, prevalece o maior; Você adiciona aos seus Pontos de Vida Totais um valor igual a 3 vezes o seu bônus de Proficiência; Você pode escolher dar o dano máximo de uma jogada de ataque, desde que não seja um acerto crítico. Essa característica não poderá ser usada novamente até o término de um descanso longo."},
  {"s":"Gerais","n":"Hipnotizador","pt":5,"c":"Complexos · 15 dias · 5 PT · Tutor: Não · Req.: Sabedoria ou Presença 16","d":"Você estudou a consciência humana e treinou para induzir a mente de criaturas a um estado de transe. Para isso, você desenvolveu uma forma de hipnose, atraindo totalmente a atenção do alvo de uma forma visual ou sonora, por exemplo, um pêndulo balançando ou uma música com mensagens sublinhares. Este método deve ser único e deve ser aprovado pelo Narrador. Usando uma ação, você obriga uma criatura a fazer uma Salvaguarda de Sabedoria CD 8 + seu modificador de Sabedoria + seu bônus de proficiência, se falhar, a criatura estará hipnotizada até receber algum dano, acabe a duração ou que a hipnose seja encerrada pelo hipnotizador. Você pode realizar as seguintes ações em criaturas hipnotizadas: Interrogar: O hipnotizado deve responder sinceramente caso saiba a resposta da pergunta. Iludir: Faz o hipnotizado ver, ouvir e sentir o cheiro do que você quiser, até que haja indícios de que seja falso. Comandar: Faz com que o hipnotizado obedeça a ordens simples (andar, escrever, deitar, largar algo, dormir). Alternativamente, o hipnotizador pode impor qualquer uma das condições presentes no Capítulo 10 ou criar novas condições, com a aprovação do Narrador. Em caso de criaturas voluntárias não é necessária uma Salvaguarda. A criatura hipnotizada vai ter todas as características da condição e até sofrer dano. Caso o dano reduza os Pontos de Vida da criatura a 0, a criatura cai inconsciente, mas não é possível que ela morra. Cada hipnose dura por 1 minuto e a criatura hipnotizada recebe +3 a cada novo teste contra qualquer tipo de hipnose, que dura por 24 horas. Só é possível atribuir uma condição por dia em cada criatura."},
  {"s":"Gerais","n":"Punho Bêbado","pt":5,"c":"Complexos · 15 dias · 5 PT · Tutor: Sim · Req.: Constituição 17","d":"Você treinou uma arte de combate exótica que faz com que tire proveito da aleatoriedade da embriaguez com golpes surpresa, simplesmente ficando parado ou se jogado no chão durante uma luta. Enquanto estiver embriagado você não consegue usar nenhuma característica de outros treinamentos que tenham como uma das opções de requisito Destreza ou Sabedoria. Sempre que estiver com a condição “Bêbado”, as características normais da condição são substituídas pelas seguintes: Seu deslocamento não provoca reações de nenhum tipo, mesmo as que ignorem esse tipo de característica como “Ataque de Oportunidade Superior”; Se você não possuir um ataque corpo a corpo desarmado ele se torna 1d8 + seu modificador de Destreza, caso possua, prevalece o maior; Nenhuma jogada de ataque tem vantagem contra você; Suas jogadas de ataque corpo a corpo desarmado possuem vantagem; No início de cada um dos seus turnos, você deve jogar 1d12; em um resultado 4 ou menor, você não pode usar ações, ações bônus ou se movimentar; em um resultado 8 ou menor, você segue o seu turno normalmente; em um resultado 12 ou menor, você ganha uma ação adicional. A ação pode ser usada apenas para realizar as ações de “Atacar”(um ataque corpo a corpo desarmado, apenas), “Disparada”, “Esconder” ou “Usar um Objeto”."},
  {"s":"Gerais","n":"Resistência à Kairoseki Superior","pt":5,"c":"Complexos · 15 dias · 5 PT · Tutor: Não · Req.: Constituição ou Vontade 20","d":"Treinamento disponível apenas para quem já possuir “Resistência à Kairoseki”. Você consegue treinar ainda mais seu corpo e mente contra os efeitos do kairoseki. Quando estiver com a condição “Enfraquecido”, apenas quando for aplicada pelo contato com kairoseki (Não se aplica ao mar), as características normais da condição são substituídas pelas seguintes: O deslocamento de uma criatura enfraquecida diminui em -1,5 metro. Seu deslocamento de natação se torna 0; A criatura fica incapacitada de usar qualquer técnica ou característica recebida por uma Akuma no Mi; A criatura recebe -2 em Testes de Atributo de Força; A criatura tem -2 em Salvaguardas de Força; A condição encerra se a causa do enfraquecimento for removida."},
  {"s":"Gerais","n":"Vigor Ampliado","pt":5,"c":"Complexos · 15 dias · 5 PT · Tutor: Não · Req.: Constituição ou Vontade 17","d":"Você começa a exaurir o seu corpo com frequência para criar cada vez mais uma reserva maior de energia. Seu máximo de Pontos de Poder aumenta em um valor igual ao seu nível de personagem quando você adquire esse treinamento. Toda vez que você ganhar um nível, após isso, seu máximo de Pontos de Poder aumenta em 1 PP adicional."},
  {"s":"Com Armas","n":"Bombardeador","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Destreza ou Sabedoria 16","d":"Você treina com um canhão e aprende a mirar com projéteis de grande peso, mesmo com grande vento ou com o balançar de um navio. Ao terminar esse treinamento, você se torna capaz de adicionar seu bônus de proficiência em ataques com o navio (canhões, armas e munições especiais) e com bazucas. Além disso, pode escolher uma dessas armas para substituir sua arma favorita, podendo reverter essa escolha a cada novo nível de personagem, desde que possuam o mesmo tipo de jogada de ataque (corpo a corpo ou à distância) e faça sentido."},
  {"s":"Com Armas","n":"Combatente Exótico","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Destreza ou Sabedoria 14","d":"Você começa a treinar com armas pouco conhecidas e que podem até trazer confusão aos seus inimigos. Ao terminar este treinamento, você se torna proficiente nas armas: chicote, mangual e zarabatana. Você também pode escolher uma arma cortante, de fogo, especial ou marcial qualquer para ser proficiente. Seu primeiro ataque, feito com uma dessas armas, após jogar uma jogada para definir uma ordem de iniciativa, é sempre feito com vantagem. Além disso, pode escolher uma dessas armas para substituir sua arma favorita, podendo reverter essa escolha a cada novo nível de personagem, desde que possuam o mesmo tipo de jogada de ataque (corpo a corpo ou à distância) e faça sentido."},
  {"s":"Com Armas","n":"Combatente Versátil","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Destreza ou Sabedoria 15","d":"Com este treinamento você treina sua mira e entende o funcionamento de armas de fogo. Ao terminar, todas as armas de fogo como pistolas e mosquetes são fáceis para você. Você pode adicionar seu bônus de proficiência em todas as armas de fogo e em mais 2 armas quaisquer das categorias armas cortantes, de fogo, especiais ou marciais. Além disso, pode escolher uma dessas armas para substituir sua arma favorita, podendo reverter essa escolha a cada novo nível de personagem, desde que possuam o mesmo tipo de jogada de ataque (corpo a corpo ou à distância) e faça sentido."},
  {"s":"Com Armas","n":"Arqueiro Treinado","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Destreza 14","d":"Você começa a treinar sua pontaria e destreza com arco e flecha. Ao finalizar este treinamento, você se torna capaz de adicionar o seu bônus de proficiência nas jogadas de ataque com arcos e recebe as seguintes características. Jogadas de ataque à distância com arco aumentam seu alcance para 36/45 metros; Jogadas de ataque à distância com arco ignoram meia-cobertura e cobertura de três quartos; O dano causado por flechas se torna 1d10 de dano Perfurante e ignoram resistências a esse tipo de dano; Jogadas de ataque (comum ou de Técnica) com requisito de armas à distância, podem ser executadas com arco e a munição substituída por flechas; Técnicas que possuem um arco como requisito e um único alvo adicionam o seu modificador de Destreza à jogada de dano. Quando a técnica possuir múltiplos alvos, você adiciona apenas metade do modificador (arredondado para baixo); Você pode escolher o arco para substituir sua arma favorita, podendo reverter essa escolha a cada novo nível de personagem, desde que possuam o mesmo tipo de jogada de ataque (corpo a corpo ou à distância) e faça sentido; Você recebe acesso à Técnica de Combate “Chuva de Flechas”. 1º Grau CHUVA DE FLECHAS Você dispara com grande velocidade várias fechas, fazendo inúmeras flechas caírem em uma saraivada vinda de cima. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. 2 Pontos de Poder Duração Instantâneo Alcance Até 12 metros, Cone Requisito 1 Arco, 10 Flechas, Ação Poderosa Dano 2d6 de dano Perfurante Ataque Combinado Possível"},
  {"s":"Com Armas","n":"Espadachim Treinado","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Força ou Destreza 14","d":"Após finalizar este treinamento, você recebe proficiência em todas as armas cortantes, caso não possua, com exceção do machado grande. Além disso, você recebe acesso à Técnica de Combate “Lâmina Voadora”. Você pode escolher uma dessas armas para substituir sua arma favorita, podendo reverter essa escolha a cada novo nível de personagem, desde que possuam o mesmo tipo de jogada de ataque (corpo a corpo ou à distância) e faça sentido. 1º Grau LÂMINA VOADORA Este ataque usa o próprio ar para aumentar a distância do seu alcance, realizando um balanço circular que cria um projétil em espiral na direção de uma criatura, com uma jogada de ataque à distância. 2 Ponto de Poder Duração Instantâneo Alcance Até 15 metros, Linha Requisito 1 Arma cortante, Ação Poderosa Dano 2d10 de dano Cortante Ataque Combinado Possível"},
  {"s":"Com Armas","n":"Estilingueiro Treinado","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Destreza 14","d":"Você se torna capaz de adicionar o seu bônus de proficiência nas jogadas de ataque com estilingue e elas se beneficiam das mesmas características que beneficiam qualquer arma de fogo e armas com a propriedade arremesso do seu Estilo de Combate. Além disso, recebem as seguintes características adicionais: A todo momento, você está catando pedras e objetos que servem para o seu estilingue, fazendo com que sempre tenha munição. Ao fazer uma jogada de ataque, você escolhe entre dano Contundente, Cortante ou Perfurante; Jogadas de ataque (comum ou de Técnica) com requisito de armas à distância, podem ser executadas com estilingue e suas munições; Você não recebe redução do alcance por conta do tipo de munição usada; O dano causado pelas munições do estilingue é de 1d10 de dano Contundente, Cortante ou Perfurante; Jogadas de ataque à distância com estilingue ignoram meia-cobertura e cobertura de três quartos; Técnicas que possuem um estilingue como requisito e um único alvo adicionam o seu modificador de Destreza à jogada de dano. Quando a técnica possuir múltiplos alvos, você adiciona apenas metade do modificador (arredondado para baixo); Você pode escolher o estilingue para substituir sua arma favorita, podendo reverter essa escolha a cada novo nível de personagem, desde que possuam o mesmo tipo de jogada de ataque (corpo a corpo ou à distância) e faça sentido. Você recebe acesso à Técnica de Combate “Hissatsu – Metallic Star”. 3º Grau HISSATSU – METALLIC STAR Uma jogada de ataque à distância com grande pressão concentrada contra um alvo. A criatura atingida deve ser bem-sucedida em uma Salvaguarda de Constituição ou receberá a condição “Atordoado”, até o final do próximo turno da criatura. 6 Pontos de Poder Duração Instantâneo Alcance Até 21 metros, Linha Requisito Estilingue, Ação Poderosa Dano 2d10 de dano Contundente Ataque Combinado Impossível"},
  {"s":"Com Armas","n":"Gangster","pt":1,"c":"Simples · 5 dias · 1 PT · Tutor: Não · Req.: Destreza 15","d":"Caso já possua proficiência em armas de fogo, você pode se especializar em escopetas e metralhadoras. Recebendo as seguintes características: Você ignora a propriedade “recarga” de escopetas e metralhadoras; O alcance da escopeta aumenta para um cone de 4,5 metros; O alcance da metralhadora aumenta para um cone de 9 metros; Você pode escolher o uma dessas armas para substituir sua arma favorita, podendo reverter essa escolha a cada novo nível de personagem, desde que possuam o mesmo tipo de jogada de ataque (corpo a corpo ou à distância) e faça sentido. Salvaguardas impostas por escopetas e metralhadoras causam, no mínimo, metade do dano em todas as criaturas afetadas, mesmo se uma criatura possuir características para não sofrer dano nenhum, caso passe em uma Salvaguarda. 3º Grau MY LITTLE FRIEND Ao assumir uma postura intimidadora, você realiza 3 rajadas de tiro para todas as direções. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. 5 Pontos de Poder Duração Instantâneo Alcance Até 15 metros, Cone Requisito Escopeta (30 munições esféricas) ou metralhadora (60 munições perfurantes), Ação Poderosa Dano 6d6 de dano Contundente ou Perfurante Ataque Combinado Possível"},
  {"s":"Com Armas","n":"Ceifador","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Não · Req.: Força ou Destreza 13","d":"Você aprende a realizar ataques que aproveitam a forma da foice e move o corpo acompanhando seu movimento com finesse. Ao terminar este treinamento, você se torna capaz de adicionar seu bônus de proficiência nas jogadas de ataque com foices, caso não possua. Quando você ataca uma criatura que tem pelo menos uma cabeça, com uma jogada de ataque corpo a corpo de dano cortante com a foice e o resultado for um acerto crítico natural, você corta fora uma das cabeças da criatura. A criatura morre se não puder sobreviver sem a cabeça cortada. Uma criatura é imune a esse efeito se possuir Invulnerabilidade a dano Cortante, não tiver ou precisar de uma cabeça, tiver Ações Lendárias, tiver mais de 100 Pontos de Vida durante o ataque ou o Narrador decidir que a criatura é grande demais para que o corte surta este efeito. Em vez disso, uma criatura sofre 2d10 de dano cortante extra do golpe. Ao realizar uma jogada de ataque corpo a corpo com uma foice, você pode usar uma ação bônus para atacar novamente com a parte não cortante da foice. Além disso, pode escolher a foice para substituir sua arma favorita, podendo reverter essa escolha a cada novo nível de personagem, desde que possuam o mesmo tipo de jogada de ataque (corpo a corpo ou à distância) e faça sentido."},
  {"s":"Com Armas","n":"Guerreiro Atroz","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Não · Req.: Força ou Destreza 15","d":"Você cria maior força nas mãos e aprende a manipular armas de grande peso com facilidade. Ao terminar este treinamento, você se torna capaz de adicionar seu bônus de proficiência nas jogadas de ataque com martelos de guerra, caso não possua. Ao fazer uma jogada de ataque corpo a corpo, com um martelo de guerra, contra uma criatura e o resultado do d20 for 19 ou 20, ela deve ser bem-sucedida em uma Salvaguarda de Constituição ou receberá a condição “Atordoado”, até o final do próximo turno da criatura. Além disso, você recebe acesso à Técnica de Combate “Rompe Montanhas”. Além disso, pode escolher uma dessas armas para substituir sua arma favorita, podendo reverter essa escolha a cada novo nível de personagem, desde que possuam o mesmo tipo de jogada de ataque (corpo a corpo ou à distância) e faça sentido. 1º Grau ROMPE MONTANHAS Um golpe no chão que cria uma onda de choque causando um grande impacto. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. A área afetada por esta técnica se torna um terreno difícil e o dano em estruturas é dobrado. 2 Pontos de Poder Duração Instantâneo Alcance Até 12 metros, Cone Requisito 1 Martelo de Guerra, Ação Poderosa Dano 2d6 de dano Contundente Ataque Combinado Possível"},
  {"s":"Com Armas","n":"Lutar com Machado","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Não · Req.: Força ou Destreza 15","d":"Após finalizar este treinamento, o uso do machado passa a ser natural e quase automático, se tornando uma extensão do seu próprio corpo. Recebe proficiência em ataques com um machado pequeno e com machado grande, caso não tenha. Ao arremessar um machado pequeno, você recebe 1d6 adicional de dano. Ao realizar um ataque corpo a corpo com um machado grande, você pode usar uma ação bônus para aproveitar o balanço do machado e realizar um ataque circular, realizando um ataque em todas as criaturas que estejam a até 1,5 metro de você, que sofrem apenas o dano da arma, sem o modificador, sem sofrer qualquer efeito ou dados de dano adicionais, mesmo de acertos críticos. Além disso, pode escolher uma dessas armas para substituir sua arma favorita, podendo reverter essa escolha a cada novo nível de personagem, desde que possuam o mesmo tipo de jogada de ataque (corpo a corpo ou à distância) e faça sentido."},
  {"s":"Com Armas","n":"Lanceiro Treinado","pt":3,"c":"Intermediários · 10 dias · 3 PT · Tutor: Não · Req.: Força ou Destreza 14","d":"Ao terminar um intensivo treinamento, você domina a arte da lança. Sendo muito mais mortal e aproveitando ao máximo as capacidades desta arma. Recebe proficiência em ataques com lança e tridente, caso não tenha. Você se torna capaz de arremessar, com uma ação, lanças e tridentes em uma distância de 9/15 metros, a jogada de ataque pode ser feita com modificador de Força ou Destreza e o dano deste ataque recebe 1 dado de dano Perfurante extra. Ao realizar um ataque corpo a corpo com uma lança ou tridente, você pode usar uma ação bônus para atacar novamente com a parte não cortante da lança ou tridente. Além disso, você recebe acesso à Técnica de Combate “Perfuração Giratória”. Além disso, pode escolher uma dessas armas para substituir sua arma favorita, podendo reverter essa escolha a cada novo nível de personagem, desde que possuam o mesmo tipo de jogada de ataque (corpo a corpo ou à distância) e faça sentido. 1º Grau PERFURAÇÃO GIRATÓRIA Uma estocada certeira enquanto gira em alta velocidade a lança ou tridente em direção a uma criatura. O alvo deve ser bem-sucedido em uma Salvaguarda de Constituição ou receberá a condição “Sangramento”. 2 Pontos de Poder Duração Instantâneo Alcance Toque Requisito 1 Lança ou Tridente, Ação Poderosa Dano 2d10 de dano Perfurante Ataque Combinado Impossível"},
  {"s":"Com Armas","n":"Combatente Ardiloso","pt":5,"c":"Complexos · 15 dias · 5 PT · Tutor: Não · Req.: Destreza ou Sabedoria 15","d":"Você aprende a explorar a velocidade que armas curtas proporcionam, fazendo seus ataques serem inesperados e mortais. Ao terminar este treinamento, quando estiver empunhando adagas, kunais e kogatanas, você recebe as seguintes características: Seus ataques corpo a corpo com adaga, kunai ou kogatana adquirem uma margem de acerto crítico de 18-20; Usar o alcance máximo da propriedade arremesso das armas não impõem desvantagem; Em cada um dos seus turnos, você pode realizar um ataque extra com uma ação bônus; Você pode escolher a adaga para substituir sua arma favorita, podendo reverter essa escolha a cada novo nível de personagem, desde que possuam o mesmo tipo de jogada de ataque (corpo a corpo ou à distância) e faça sentido. Você recebe acesso à Técnica de Combate “Adagas Voadoras”. 2º Grau ADAGAS VOADORAS Utilizando todo o seu foco nos ataques, você lança 3 adagas, com o máximo de eficiência e sem chance de errar, forçando os projéteis a fazerem curvas até chegarem ao alvo. Cada adaga atinge uma criatura, à sua escolha, que você possa ver, dentro do alcance. Todos os projéteis atingem simultaneamente e você pode direciona-los para atingir uma criatura ou várias (modificadores possíveis para a técnica são aplicados apenas em um dos ataques). 4 Pontos de Poder Duração Instantâneo Alcance Até 15 metros, Linha Requisito 3 adagas, Ação Poderosa Dano 1d10 de dano Perfurante (para cada adaga) Ataque Combinado Possível"},
  {"s":"Com Armas","n":"Espadachim Negro","pt":5,"c":"Complexos · 15 dias · 5 PT · Tutor: Não · Req.: Força ou Destreza 17","d":"Você cria maior força nas mãos e aprende a manipular armas de grande peso e tamanho em combate. Ao terminar este treinamento, você pode adicionar seu bônus de proficiência nas jogadas de ataque com espadas montantes, caso não possua. Ao realizar um ataque corpo a corpo com uma espada montante, você pode usar uma ação bônus para aproveitar o balanço da espada e realizar um ataque circular, realizando um ataque em todas as criaturas que estejam a até 1,5 metro de você, que sofrem apenas o dano da arma, sem o modificador, sem sofrer qualquer efeito ou dados de dano adicionais, mesmo de acertos críticos. Enquanto estiver empunhando uma espada montante, você é capaz de usar seu tamanho, peso e resistência ao seu favor, usando uma reação você recebe +3 de bônus na sua CR e em Salvaguardas de Destreza contra dano, até o final do seu próximo turno. Além disso, pode escolher a espada montante para substituir sua arma favorita, podendo reverter essa escolha a cada novo nível de personagem, desde que possuam o mesmo tipo de jogada de ataque (corpo a corpo ou à distância) e faça sentido. Treinamentos de Espécie só podem ser aprendidos por personagens pertencentes a essa espécie ou mestiços dessa espécie. ANÃO"},
  {"s":"De Espécie","n":"Pequeno Gigante","pt":1,"c":"5 dias · 1 PT · Tutor: Não · Req.: Constituição 14","d":"Ao concluir este treinamento, o dado de dano de suas jogadas de ataque corpo a corpo passa a ser um d12 (caso receba outro tipo de dado, prevalece o maior). Além disso, você aprende a usar sua agilidade de forma eficaz em combate, aumentando sua CR em +2 enquanto estiver com mais da metade de seus Pontos de Vida. Adicionalmente, sua ingenuidade e determinação permitem que você escolha ter sucesso em uma Salvaguarda qualquer. Essa característica não pode ser usada novamente até o término de um descanso longo."},
  {"s":"De Espécie","n":"Conexão com A Natureza","pt":1,"c":"5 dias · 1 PT · Tutor: Não · Req.: Sabedoria 14","d":"Ao terminar esse treinamento, anões recebem +2 em Testes de Atributo de Sabedoria (Sobrevivência) em ambientes com grande vegetação. Além disso, o anão se torna proficiente e pode usar a característica “Adestrar Animais” (Sabedoria ou Presença), presente na profissão Adestrador no Capítulo 4, para tentar convencer insetos ou outros animais não hostis a te ajudarem em uma tarefa. Adicionalmente, o anão pode escolher o Treinamento Geral “Alquimista” gastando apenas 1 Ponto de Treinamento, sem a necessidade de treinar por dias e ignorando os demais requisitos. CELESTIAIS"},
  {"s":"De Espécie","n":"Afinidade Cultural","pt":1,"c":"5 dias · 1 PT · Tutor: Não · Req.: Destreza 14","d":"Ao terminar esse treinamento, quando o celestial estiver em alturas elevadas (determinada pelo Narrador), ele recebe vantagem em Testes de Atributo de Destreza (Acrobacia) e Salvaguardas de Destreza. Além disso, os celestiais recebem uma redução de 2d6 em qualquer dano de queda. Adicionalmente, o celestial pode escolher o Treinamento Geral “Conhecimento Celestial” gastando apenas 1 Ponto de Treinamento, sem a necessidade de treinar por dias e ignorando os demais requisitos. GIGANTES"},
  {"s":"De Espécie","n":"Guerreiro Nato","pt":1,"c":"5 dias · 1 PT · Tutor: Não · Req.: Constituição 14","d":"Ao terminar esse treinamento, o dado de uma jogada de ataque corpo a corpo de um gigante se torna o d12 (caso receba outro tipo de dado, prevalece o maior). Além disso, você aprende a usar seu corpo propriamente para maior facilidade em acertar alvos próximos, adicione +1 para acertar ataques corpo a corpo. Adicionalmente, Sempre que o gigante recebe um dano com valor igual a 10 ou maior, ele recupera 1d6 + o modificador de Constituição em Pontos de Vida, desde que esteja consciente."},
  {"s":"De Espécie","n":"Resistência dos Gigantes","pt":1,"c":"5 dias · 1 PT · Tutor: Não · Req.: Constituição 14","d":"Após terminar esse treinamento, independentemente do “Estilo de Combate” escolhido em cada nível, o dado de vida de um gigante sempre será o d12. No momento que você aprende esse treinamento (caso não seja no junto com a criação da ficha) você deve jogar novamente os seus dados de vida substituindo pelo d12. Caso coma uma Akuma no Mi do tipo Zoan, se ela tiver a forma “Heavy Point”, são adicionados 3 Pontos de Vida a cada nível de personagem. Por exemplo, se estiver no 3º nível, são adicionados 9 PV aos 80 PV recebidos, resultando em 89 PV totais, com essa característica. POVO DO MAR"},
  {"s":"De Espécie","n":"Expertise Cultural","pt":1,"c":"5 dias · 1 PT · Tutor: Não · Req.: Força 14","d":"Ao terminar esse treinamento, o homem-peixe ou sireno pode adicionar seu bônus de proficiência nas jogadas de ataque com tridente. Quando totalmente debaixo d’água, recebem +1 para acertar jogadas de ataque corpo a corpo (comum ou de Técnica). Além disso, o homem-peixe ou sireno se torna proficiente e pode usar a característica “Adestrar Animais” (Sabedoria ou Presença), presente na profissão Adestrador no Capítulo 4, para tentar convencer peixes e animais marinhos não hostis a te ajudarem em uma tarefa. Adicionalmente, os olhos dos homens-peixe e sirenos se adaptam para funcionar normalmente embaixo d’água, fazendo com que consigam enxergar até 36 metros, em caso de escuridão total eles só enxergam em tons de cinza. HUMANOS"},
  {"s":"De Espécie","n":"Especialização","pt":1,"c":"5 dias · 1 PT · Tutor: Não · Req.: Sabedoria 14","d":"Ao terminar esse treinamento, o humano escolhe um atributo qualquer para aumentar em +1. Como padrão, você não pode elevar um valor de atributo acima de 20 com esse treinamento."},
  {"s":"De Espécie","n":"Iniciada em Haki (Apenas para A Variante da Espécie – Kuja)","pt":1,"c":"5 dias · 1 PT · Tutor: Não · Req.: Vontade 14","d":"Desde a infância as kujas são ensinadas sobre todas as formas de Haki e, quando mais velhas, começam seu treinamento para aprender a usá-lo. Após terminar esse treinamento, você recebe um valor de Pontos de Ambição igual ao seu nível de personagem (arredondado para baixo) e 2 Pontos de Ambição para cada nível par posterior. Não é possível receber mais de 10 Pontos de Ambição com esse treinamento e essa característica não garante o despertar do Haki."},
  {"s":"De Espécie","n":"Resiliência","pt":1,"c":"5 dias · 1 PT · Tutor: Não · Req.: Sabedoria 14","d":"Ao terminar esse treinamento, o humano escolhe 1 Salvaguarda para ser proficiente, à sua escolha."},
  {"s":"De Espécie","n":"Versatilidade Humana","pt":1,"c":"5 dias · 1 PT · Tutor: Não · Req.: Sabedoria 14","d":"Ao terminar esse treinamento, o humano adiciona metade do bônus de proficiência, arredondado para baixo, em qualquer Teste de Atributo que fizer e que ainda não possua o bônus de proficiência. LUNARIANOS"},
  {"s":"De Espécie","n":"Técnicas Inatas","pt":1,"c":"5 dias · 1 PT · Tutor: Não · Req.: Constituição 14","d":"Ao terminar esse treinamento, graças às características únicas de controle do fogo, pertencente à espécie dos lunariano, conforme você se torna mais habilidoso no controle das chamas, você recebe as Técnicas de Combate: “Hakka”, “Andon” e “Fushi”. 2º Grau HAKKA (Recebida no 3º Nível) Ao receber dano, o impacto aciona as chamas do seu corpo e libera uma explosão contra tudo ao seu redor. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. 4 Pontos de Poder Duração Instantâneo Alcance Até 6 metros, Esfera Requisito Ser lunariano ou seus mestiços, Reação Dano 3d6 de dano de Fogo Ataque Combinado Impossível 3º Grau ANDON (Recebida no 6º Nível) Você libera uma rajada de fogo contra seus inimigos. Toda a criatura dentro da área da técnica deve fazer uma Salvaguarda de Destreza. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso. Alternativamente, você pode focar o ataque em uma única criatura, fazendo uma jogada de ataque à distância (15 metros em linha) que causa 6d10 de dano de Fogo. 5 Pontos de Poder Duração Instantâneo Alcance Até 18 metros, Cone Requisito Ser lunariano ou seus mestiços, Ação Poderosa Dano 6d6 de dano de Fogo Ataque Combinado Possível 5º Grau FUSHI (Recebida no 12º Nível) Enquanto esta técnica durar, sempre que você estiver na forma “Resiliente” da característica “Corpo Forjado”, você se torna Invulnerável a qualquer tipo de dano (exceto dano Trovejante, Psíquico e Verdadeiro). 12 Pontos de Poder Duração Até 1 minuto, Concentração Alcance Pessoal Requisito Ser lunariano ou seus mestiços, Ação Bônus Dano Nenhum Ataque Combinado Impossível"},
  {"s":"De Espécie","n":"Corpo Forjado","pt":5,"c":"15 dias · 5 PT · Tutor: Não · Req.: Constituição 14","d":"Ao terminar esse treinamento, com uma ação bônus, o lunariano pode alternar entre duas formas: “Ignição” e “Resiliente”. Ignição: Enquanto nesta forma, o orbe de fogo presente nas costas do lunariano se extingui e ele recebe um aumento em sua velocidade. Ao usar a ação “Atacar” o lunariano pode realizar um ataque adicional, mas apenas uma vez por rodada; O deslocamento do lunariano se torna 15 metros (caso receba outro deslocamento, prevalece o maior); O lunariano pode usar uma ação bônus para receber vantagem na sua primeira jogada de ataque do turno. A partir do 10º nível de personagem, a vantagem ocorre sem a necessidade de uma ação bônus. Resiliente: Enquanto nesta forma, um orbe de fogo surge nas costas do lunariano e ele recebe um aumento em sua resistência. O lunariano não consegue realizar mais de 1 jogada de ataque durante seu turno nem usar ações poderosas; O lunariano reduz o primeiro dano que receber no turno em um valor igual ao dobro do seu nível de personagem; A partir do 10º nível de personagem, o lunariano recebe resistência a qualquer dano que receber (exceto dano Verdadeiro); O lunariano não consegue usar a característica “Heat” ou a Técnicas de Combate “Hakka” (recebida pelo treinamento “Técnicas Inatas”), enquanto estiver nesta forma; O lunariano não consegue se deslocar por mais de 7,5 metros, durante a rodada. MINKS"},
  {"s":"De Espécie","n":"Leão da Lua","pt":5,"c":"15 dias · 5 PT · Tutor: Sim · Req.: Constituição 14","d":"Ao terminar este treinamento, o mink consegue se manter totalmente consciente enquanto está na forma Sulong. Além disso, você recebe as seguintes características: Você recebe Invulnerabilidade a dano do tipo Elétrico e vantagem em Salvaguardas de Constituição e Vontade; Você consegue manter sua forma Sulong, de forma não desgastante, por 5 minutos, após esse tempo, a cada 1 minuto adicional você perde 2 Pontos de Poder. Caso você não possua pontos para perder, você recebe ou adiciona 1 Nível de Exaustão. Essa característica não poderá ser usada novamente até o término de um descanso curto ou longo; Você se torna capaz de se transformar ou desfazer a transformação Sulong sem precisar de uma ação, entretanto, a destransformação é considerada como o mínimo de 1 minuto do tempo contabilizado na sua transformação, mesmo que você não tenha ficado esse tempo transformado; Evitar olhar para a lua não causa desvantagem ou impede que você use sua concentração em outras técnicas ou características."},
  {"s":"De Espécie","n":"Furtividade Animal","pt":1,"c":"5 dias · 1 PT · Tutor: Não · Req.: Destreza 14","d":"Ao terminar este treinamento, nenhuma criatura consegue ter vantagens ao fazer um Teste de Atributo de Vontade (Percepção) para tentar localizar um mink, mesmo com o uso do Haki da Observação. 5.8 – CÓDIGOS DE HONRA (REGRA OPCIONAL)"}
];

/* ===== Modelo: OP RPG (One Piece, d20) — baseado na planilha "Corsa" ===== */
const T = (pt, en) => ({ pt, en: en === undefined ? pt : en });
const ATTR_IDS = ['for', 'des', 'con', 'sab', 'von', 'pre'];

function buildCorsa() {
  const A = (id, pt, en, abbr, abbrEn) => ({ id, label: T(pt, en), abbr: T(abbr, abbrEn || abbr) });
  const attrs = [
    A('for', 'Força', 'Strength', 'FOR', 'STR'),
    A('des', 'Destreza', 'Dexterity', 'DES', 'DEX'),
    A('con', 'Constituição', 'Constitution', 'CON'),
    A('sab', 'Sabedoria', 'Wisdom', 'SAB', 'WIS'),
    A('von', 'Vontade', 'Willpower', 'VON', 'WIL'),
    A('pre', 'Presença', 'Presence', 'PRE'),
  ];
  const attrSel = '@attrs';

  const species = [
    { value: 'Anões', set: { pv_especie: 10 - 2, desloc_terra: 9, desloc_nado: 4.5 } },
    { value: 'Celestiais', set: { pv_especie: 10, desloc_terra: 12, desloc_nado: 3 } },
    { value: 'Gigantes', set: { pv_especie: 20, desloc_terra: 9, desloc_nado: 3 } },
    { value: 'Humanos', set: { pv_especie: 10, desloc_terra: 9, desloc_nado: 4.5 } },
    { value: 'Lunarianos', set: { pv_especie: 16, desloc_terra: 9, desloc_nado: 3 } },
    { value: 'Mestiços', set: {} },
    { value: 'Minks', set: { pv_especie: 12, desloc_terra: 9, desloc_nado: 4.5 } },
    { value: 'Povo do Mar', set: { pv_especie: 14, desloc_terra: 9, desloc_nado: 15 } },
  ];
  species[0].set.pv_especie = 8;

  const mkStyle = (name, cat, dv, prim, cdAtr, saves) => {
    const set = { dv, estilo_cat: cat, atr_prim: prim, cd_atr: cdAtr };
    ATTR_IDS.forEach(a => (set['saves.' + a + '.prof'] = saves.includes(a)));
    return { value: name, set };
  };
  const styles = [
    mkStyle('Carateca Homem-Peixe', 'Guerreiro', 12, 'for', 'for', ['for', 'con']),
    mkStyle('Lutador', 'Guerreiro', 12, 'for', 'for', ['for', 'con']),
    mkStyle('Okama Kenpo', 'Guerreiro', 10, 'for', 'pre', ['des', 'pre']),
    mkStyle('Ninja', 'Guerreiro', 8, 'des', 'des', ['des', 'sab']),
    mkStyle('Atirador', 'Especialista', 8, 'des', 'des', ['des', 'sab']),
    mkStyle('Espadachim', 'Especialista', 10, 'for', 'for', ['des', 'von']),
    mkStyle('Brutamontes', 'Especialista', 12, 'for', 'for', ['for', 'con']),
    mkStyle('Ciborgue', 'Divergente', 12, 'sab', 'sab', ['for', 'sab']),
    mkStyle('Guerrilheiro', 'Divergente', 10, 'for', 'for', ['for', 'des']),
    mkStyle('Usuário de Rokushiki', 'Divergente', 10, 'for', 'for', ['for', 'des']),
  ];

  const skillDefs = [
    ['atletismo', 'Atletismo', 'Athletics', 'for'],
    ['acrobacia', 'Acrobacia', 'Acrobatics', 'des'],
    ['furtividade', 'Furtividade', 'Stealth', 'des'],
    ['prestidigitacao', 'Prestidigitação', 'Sleight of Hand', 'des'],
    ['historia', 'História', 'History', 'sab'],
    ['investigacao', 'Investigação', 'Investigation', 'sab'],
    ['natureza', 'Natureza', 'Nature', 'sab'],
    ['sobrevivencia', 'Sobrevivência', 'Survival', 'sab'],
    ['atuacao', 'Atuação', 'Performance', 'pre'],
    ['enganacao', 'Enganação', 'Deception', 'pre'],
    ['intimidacao', 'Intimidação', 'Intimidation', 'pre'],
    ['persuasao', 'Persuasão', 'Persuasion', 'pre'],
    ['provocacao', 'Provocação', 'Provocation', 'pre'],
    ['haki', 'Haki', 'Haki', 'von'],
    ['intuicao', 'Intuição', 'Insight', 'von'],
    ['percepcao', 'Percepção', 'Perception', 'von'],
    ['sobrenatural', 'Sobrenatural', 'Supernatural', 'von'],
    ['sorte', 'Sorte', 'Luck', 'von'],
  ];
  const dvOpts = [
    { v: 6, l: 'd6' },
    { v: 8, l: 'd8' },
    { v: 10, l: 'd10' },
    { v: 12, l: 'd12' },
  ];
  const gradeOpts = [1, 2, 3, 4, 5, 6, 7].map(n => ({ v: n, l: n + 'º' }));

  // ---------- cartões de técnica (Estilo e Akuma no Mi)
  const techCard = (id, atkVar, catalog) => ({
    catalog,
    type: 'list',
    id,
    display: 'cards',
    span: 12,
    title: T('Técnicas', 'Techniques'),
    addLabel: T('Nova técnica', 'New technique'),
    titleField: 'nome',
    min: 0,
    cols: 3,
    columns: [
      { id: 'nome', kind: 'text', label: T('Nome', 'Name'), span: 6 },
      { id: 'grau', kind: 'select', options: gradeOpts, label: T('Grau', 'Rank'), span: 2 },
      { id: 'custo', kind: 'number', label: T('Custo (PP)', 'Cost (PP)'), span: 2, min: 0 },
      {
        id: 'tipo',
        kind: 'select',
        options: ['Combate', 'Auxiliar'],
        def: 'Combate',
        label: T('Tipo', 'Type'),
        span: 2,
      },
      { id: 'duracao', kind: 'text', label: T('Duração', 'Duration'), span: 4 },
      { id: 'alcance', kind: 'text', label: T('Alcance', 'Range'), span: 4 },
      { id: 'requisito', kind: 'text', label: T('Requisito', 'Requirement'), span: 4 },
      {
        id: 'dano',
        kind: 'text',
        label: T('Dano', 'Damage'),
        span: 12,
        placeholder: 'ex.: 3d8 + 3 Cortante',
      },
      { id: 'desc', kind: 'area', label: T('Descrição / efeito', 'Description / effect'), span: 12, rows: 2 },
    ],
    actions: [
      {
        label: T('Usar', 'Use'),
        spend: { res: 'pp', cost: 'custo' },
        roll: '"1d20+" & ' + atkVar,
        title: 'nome',
        overload: { field: 'exaustao', amount: 'grau', max: 5 },
        d20: true,
      },
      { label: T('Dano', 'Damage'), roll: 'dano', title: 'nome' },
    ],
  });
  const levelTable = (id, title) => ({
    type: 'list',
    id,
    span: 12,
    title,
    columns: [
      { id: 'label', kind: 'label', label: T('Nível', 'Level'), w: '56px' },
      { id: 'grau', kind: 'label', label: T('Grau', 'Rank'), w: '56px', src: 'grau' },
      { id: 'comb', kind: 'text', label: T('Técnica de Combate', 'Combat technique'), w: '1fr' },
      {
        id: 'aux',
        kind: 'text',
        label: T('Técnica Auxiliar', 'Auxiliary technique'),
        w: '1fr',
        onlyIf: 'hasaux',
      },
    ],
    lock: 'nivel < unlock',
    rows: [
      [1, 1, 1],
      [3, 2, 0],
      [6, 3, 1],
      [9, 4, 0],
      [12, 5, 1],
      [16, 6, 0],
      [20, 7, 0],
    ].map(([n, g, aux]) => ({ key: 'n' + n, label: n + 'º', grau: g + 'º', unlock: n, hasaux: !!aux })),
  });

  const haki = (id, title, rows) => ({
    type: 'list',
    id,
    span: 12,
    title,
    split: 1,
    columns: [
      { id: 'label', kind: 'label', label: T('Talento', 'Talent'), w: '1.5fr' },
      {
        id: 'req',
        kind: 'label',
        label: T('Requisitos', 'Requirements'),
        w: '1.4fr',
        muted: true,
        src: 'req',
      },
      {
        id: 'pa',
        kind: 'calc',
        label: 'PA',
        w: '44px',
        formula: 'custo*(possui+dominado+aprimorado)',
        fmt: 'int',
      },

/* ===== Runtime: liga modelo + ficha + fórmulas ===== */
class RT {
  constructor(tpl, ch) {
    this.tpl = tpl;
    this.ch = ch;
    ch.v = ch.v || {};
    ch.g = ch.g || {};
    this.memo = new Map();
    this.errs = {};
    this.stack = [];
    this.cm = {};
    this.reindex();
  }
  invalidate() {
    this.memo.clear();
    this.errs = {};
  }

  /* ---------- índice do modelo ---------- */
  reindex() {
    this.fields = {};
    this.calcs = {};
    this.lists = {};
    this.res = {};
    this.grids = {};
    this.attrs = [];
    this.attrOpts = [];
    const regField = f => {
      if (f && f.id && !this.fields[f.id]) this.fields[f.id] = f;
      if (f && f.kind === 'calc' && f.id && !this.calcs[f.id])
        this.calcs[f.id] = { formula: f.formula, def: f };
    };
    for (const tab of this.tpl.tabs)
      for (const b of tab.blocks) {
        if (b.type === 'fields') (b.fields || []).forEach(regField);
        else if (b.type === 'attrs') {
          for (const a of b.attrs || []) {
            this.attrs.push(a);
            this.attrOpts.push({ v: a.id, l: a.abbr || a.label });
            this.fields[a.id] = this.fields[a.id] || { id: a.id, kind: 'number', def: b.def ?? 10 };
            const scope = { get: n => (n === 'v' ? this.stored(a.id) : undefined) };
            this.calcs[a.id + '_mod'] = { formula: b.mod || 'floor((v-10)/2)', scope, def: { kind: 'calc' } };
          }
        } else if (b.type === 'resource' && !b.ref) {
          this.res[b.id] = b;
          this.fields[b.id + '_temp'] = { id: b.id + '_temp', kind: 'number' };
          this.fields[b.id + '_maxman'] = { id: b.id + '_maxman', kind: 'number' };
          if (b.bonus && !this.fields[b.bonus]) this.fields[b.bonus] = { id: b.bonus, kind: 'number' };
          (b.extras || []).forEach(regField);
          this.calcs[b.id + '_max'] = { fn: () => this.maxOf(b) };
          this.calcs[b.id] = {
            fn: () => {
              const r = this.ch.v[b.id];
              return r === undefined || r === '' || r === null
                ? this.get(b.id + '_max')
                : Math.min(parseFloat(r) || 0, 99999);
            },
          };
        } else if (b.type === 'list') this.lists[b.id] = b;
        else if (b.type === 'grid') this.grids[b.sheet] = b;
      }
  }
  optionsOf(o) {
    if (o === '@attrs') return this.attrOpts.map(x => ({ v: x.v, l: tr(x.l) }));
    return (o || []).map(x =>
      typeof x === 'object' ? { v: x.v, l: tr(x.l ?? x.v) } : { v: x, l: String(x) }
    );
  }

  /* ---------- leitura ---------- */
  stored(id) {
    const f = this.fields[id];
    if (!f) return 0;
    let raw = this.ch.v[id];
    const k = f.kind;
    if (raw === undefined || raw === '' || raw === null) {
      if (f.def !== undefined) raw = f.def;
      else return k === 'number' ? 0 : k === 'check' ? false : '';
    }
    if (k === 'number') {
      const n = parseFloat(raw);
      return isNaN(n) ? 0 : n;
    }
    if (k === 'check') return !!raw;
    return raw;
  }
  err(key, msg) {
    this.errs[key] = msg;
  }
  get(name, scope) {
    if (scope) {
      const r = scope.get(name);
      if (r !== undefined) return r;
    }
    if (name.indexOf('.') > 0) return this.dotted(name);
    if (this.calcs[name]) return this.calc(name);
    if (this.fields[name]) return this.stored(name);
    return 0;
  }
  evalF(src, scope) {
    if (src === undefined || src === null || src === '') return '';
    const ast = Formula.parse(String(src), false);
    return Formula.evaluate(ast, {
      lenient: true,
      ident: n => this.get(n, scope),
      ref: () => null,
      range: () => [],
    });
  }
  calc(name) {
    if (this.memo.has(name)) return this.memo.get(name);
    if (this.stack.includes(name)) {
      this.err(name, 'Referência circular');
      return 0;
    }
    const c = this.calcs[name];
    let val = 0;
    this.stack.push(name);
    try {
      if (c.fn) val = c.fn();
      else {
        const ov = c.def && c.def.override ? this.ch.v[name + '__ov'] : undefined;
        if (ov !== undefined && ov !== '' && !isNaN(parseFloat(ov))) val = parseFloat(ov);
        else val = this.evalF(c.formula, c.scope);
      }
    } catch (e) {
      this.err(name, e.message || String(e));
      val = 0;
    }
    this.stack.pop();
    this.memo.set(name, val);
    return val;
  }
  maxOf(b) {
    const man = parseFloat(this.ch.v[b.id + '_maxman']);
    if (man > 0) return man;
    let base = 0;
    try {
      base = Formula.num(this.evalF(b.max), true);
    } catch (e) {
      this.err(b.id + '_max', e.message);
    }
    if (b.maxMin !== undefined) base = Math.max(b.maxMin, base);
    return base + (b.bonus ? this.stored(b.bonus) : 0);
  }

  /* ---------- listas ---------- */
  listArr(L) {
    let a = this.ch.v[L];
    if (!Array.isArray(a)) {
      a = [];
      const b = this.lists[L];
      for (let i = 0; i < ((b && b.seed) || 0); i++) a.push({});
      this.ch.v[L] = a;
    }
    return a;
  }
  rows(L) {
    const b = this.lists[L];
    if (!b) return [];
    if (b.rows) return b.rows.map(def => ({ key: def.key, def }));
    return this.listArr(L).map((o, i) => ({ key: i, ix: i, def: null }));
  }
  rawCell(L, row, colId) {
    const b = this.lists[L];
    let d;
    if (b.rows) {
      const m = this.ch.v[L];
      d = m && !Array.isArray(m) ? m[row.key] : undefined;
    } else d = this.listArr(L)[row.ix];
    return d ? d[colId] : undefined;
  }
  setCell(L, row, colId, v) {
    const b = this.lists[L];
    if (b.rows) {
      let m = this.ch.v[L];
      if (!m || Array.isArray(m)) m = this.ch.v[L] = {};
      (m[row.key] = m[row.key] || {})[colId] = v;
    } else {
      const a = this.listArr(L);
      (a[row.ix] = a[row.ix] || {})[colId] = v;
    }
    this.invalidate();
  }
  addRow(L, init) {
    this.listArr(L).push(init || {});
    this.invalidate();
  }
  delRow(L, ix) {
    this.listArr(L).splice(ix, 1);
    this.invalidate();
  }
  moveRow(L, ix, d) {
    const a = this.listArr(L);
    const j = ix + d;
    if (j < 0 || j >= a.length) return;
    [a[ix], a[j]] = [a[j], a[ix]];
    this.invalidate();
  }
  colMap(L) {
    return this.cm[L] || (this.cm[L] = Object.fromEntries(this.lists[L].columns.map(c => [c.id, c])));
  }
  rowScope(L, row) {
    const cm = this.colMap(L);
    return {
      get: n => {
        const c = cm[n];
        if (c) return this.colVal(L, row, c);
        if (row.def && n in row.def && n !== 'key') {
          const x = row.def[n];
          return x !== null && typeof x === 'object' ? tr(x) : x;
        }
        if (n === 'index') return row.ix === undefined ? 0 : row.ix + 1;
        return undefined;
      },
    };
  }
  colVal(L, row, col) {
    const k = col.kind;
    if (k === 'calc') {
      const key = L + '|' + row.key + '|' + col.id;
      if (this.memo.has(key)) return this.memo.get(key);
      if (this.stack.includes(key)) {
        this.err(key, 'Referência circular');
        return 0;
      }
      this.stack.push(key);
      let val = 0;
      try {
        val = this.evalF(col.formula, this.rowScope(L, row));
      } catch (e) {
        this.err(key, e.message || String(e));
      }
      this.stack.pop();
      this.memo.set(key, val);
      return val;
    }
    if (k === 'label') {
      const src = col.src || 'label';
      const x = row.def ? row.def[src] : undefined;
      return x === undefined ? '' : tr(x);
    }
    let raw = this.rawCell(L, row, col.id);
    if (raw === undefined || raw === '' || raw === null) {
      const d = row.def && row.def[col.id] !== undefined ? row.def[col.id] : col.def;
      if (d !== undefined) raw = d;
      else return k === 'number' ? 0 : k === 'check' ? false : '';
    }
    if (k === 'number') {
      const n = parseFloat(raw);
      return isNaN(n) ? 0 : n;
    }
    if (k === 'check') return !!raw;
    return raw;
  }
  dotted(name) {
    const p = name.split('.');
    const b = this.lists[p[0]];
    if (!b) return 0;
    const cm = this.colMap(p[0]);
    if (p.length === 2) {
      const c = cm[p[1]];
      if (!c) return [];
      return this.rows(p[0]).map(r => this.colVal(p[0], r, c));
    }
    if (p.length === 3) {
      const r = this.rows(p[0]).find(r => String(r.key) === p[1]);
      const c = cm[p[2]];
      return r && c ? this.colVal(p[0], r, c) : 0;
    }
    return 0;
  }

  /* ---------- escrita ---------- */
  setVal(id, v) {
    this.ch.v[id] = v;
    this.invalidate();
  }
  setPath(path, v) {
    const p = path.split('.');
    if (p.length === 3 && this.lists[p[0]]) {
      const r = this.rows(p[0]).find(r => String(r.key) === p[1]);
      if (r) this.setCell(p[0], r, p[2], v);
      return;
    }
    this.setVal(path, v);
  }

  /* ---------- recursos ---------- */
  resCur(id) {
    return this.get(id);
  }
  resMax(id) {
    return this.get(id + '_max');
  }
  damage(id, n) {
    n = Math.abs(n);
    let temp = this.stored(id + '_temp');
    const absorbed = Math.min(temp, n);
    this.setVal(id + '_temp', temp - absorbed);
    n -= absorbed;
    this.setVal(id, Math.max(0, this.resCur(id) - n));
  }
  heal(id, n) {
    this.setVal(id, Math.min(this.resMax(id), this.resCur(id) + Math.abs(n)));
  }
  spend(id, n) {
    this.setVal(id, Math.max(0, this.resCur(id) - n));
  }
  longRest() {
    const r = this.tpl.rest && this.tpl.rest.long;
    if (!r) return;
    for (const id of r.restore || []) {
      delete this.ch.v[id];
      this.ch.v[id + '_temp'] = 0;
    }
    this.invalidate();
    for (const k in r.set || {}) {
      try {
        this.ch.v[k] = Formula.num(this.evalF(r.set[k]), true);
      } catch (e) {}
      this.invalidate();
    }
  }

  /* ---------- formatação ---------- */
  fmt(v, f) {
    if (Array.isArray(v)) v = v[0];
    if (f === 'text') return v === null || v === undefined ? '' : String(v);
    if (typeof v === 'boolean') return v ? '✔' : '';
    if (typeof v === 'number') {
      if (!isFinite(v)) return '—';
      const r = Math.round(v * 100) / 100;
      return f === 'signed' ? (r >= 0 ? '+' : '−') + Math.abs(r) : String(r).replace('-', '−');
    }
    if (v === null || v === undefined) return '';
    return String(v);
  }

  /* ---------- planilhas importadas (grid) ---------- */
  cellKey(sheet, a) {
    return sheet + '!' + a;
  }
  cellVal(sheet, a) {
    const key = this.cellKey(sheet, a);
    if (this.memo.has(key)) return this.memo.get(key);
    const g = this.grids[sheet];
    const c = g && g.cells[a];
    let val = null;
    if (c) {
      if (c.k === 'ca' && c.f) {
        if (this.stack.includes(key)) {
          this.err(key, '#CIRC');
          return '#CIRC';
        }
        this.stack.push(key);
        try {
          const ast = Formula.parse(c.f, true);
          val = Formula.evaluate(ast, this.xctx(sheet));
          if (Array.isArray(val)) val = val[0];
          if (val === undefined) val = null;
        } catch (e) {
          this.err(key, e.message);
          val = e.code || '#ERR';
        }
        this.stack.pop();
      } else if (c.k === 'in') {
        const o = this.ch.g[key];
        val = o !== undefined ? o : c.v !== undefined ? c.v : null;
      } else val = c.v !== undefined ? c.v : null;
    }
    this.memo.set(key, val);
    return val;
  }
  xctx(sheet) {
    return {
      lenient: false,
      ident: n => {
        const l = n.toLowerCase();
        if (l === 'true') return true;
        if (l === 'false') return false;
        throw new Formula.FErr('#NAME?', n);
      },
      ref: (sh, a) => this.cellVal(sh || sheet, a),
      range: (sh, a, b) => {
        const A = Formula.splitA1(a),
          B = Formula.splitA1(b);
        if (!A || !B) return [];
        const out = [];
        const r1 = Math.min(A.r, B.r),
          r2 = Math.max(A.r, B.r),
          c1 = Math.min(A.c, B.c),
          c2 = Math.max(A.c, B.c);
        const g = this.grids[sh || sheet];
        if (!g) return out;
        for (let r = r1; r <= r2; r++)
          for (let c = c1; c <= c2; c++) {
            const ad = Formula.numToCol(c) + r;
            if (g.cells[ad]) out.push(this.cellVal(sh || sheet, ad));
          }
        return out;
      },
    };
  }
  setCellG(sheet, a, v) {
    this.ch.g[this.cellKey(sheet, a)] = v;
    this.invalidate();
  }
}

const App = {
  ch: null,
  tpl: null,
  rt: null,
  tab: null,
  edit: false,
  binds: [],
  collapsed: new Set(),
  hudBinds: [],
};

const Roller = {
  hist: [],
  adv: 0,
  push(e) {
    this.hist.unshift(e);
    if (this.hist.length > 60) this.hist.pop();
    renderDiceLog();
  },
  roll(title, expr, o = {}) {
    const p = parseDice(expr);
    if (!p) {
      toast(t('noDice'));
      return null;
    }
    const first = p.terms[0];
    const useAdv = o.d20 || (first && first.f === 20 && first.n === 1 && p.terms.length <= 3);
    const res = rollParsed(p, { adv: useAdv ? this.adv : 0 });
    if (o.d20 && App.tpl && App.tpl.rollMods) {
      for (const m of App.tpl.rollMods) {
        let v = 0;
        try {
          v = Formula.num(App.rt.evalF(m.f), true);
        } catch (e) {}
        if (v) {
          res.total += v;
          res.parts.push({ sign: v < 0 ? -1 : 1, c: Math.abs(v), label: tr(m.label) });
        }
      }
    }
    const detail =
      partsText(res.parts) +
      (res.parts.some(x => x.label)
        ? ' (' +
          res.parts
            .filter(x => x.label)
            .map(x => x.label)
            .join(', ') +
          ')'
        : '');
    const crit = res.d20 && res.nat === 20,
      fail = res.d20 && res.nat === 1;
    const entry = {
      title: title || p.expr,
      expr: p.expr,
      total: res.total,
      detail,
      crit,
      fail,
      adv: useAdv ? this.adv : 0,
    };
    this.hist.unshift(entry);
    if (this.hist.length > 60) this.hist.pop();
    toastRoll(entry);
    renderDiceLog();
    try {
      Net.roll(entry);
    } catch (e) {}
    try {
      if (Store.data.prefs.rollSnd) Snd.play(entry.crit ? 'critico' : entry.fail ? 'falha' : 'dado', 0.7);
    } catch (e) {}
    return entry;
  },
};

/* ---------- campos ---------- */
function applySuggest(def, value) {
  const it = (def.suggest || []).find(s => String(s.value).toLowerCase() === String(value).toLowerCase());
  if (!it || !it.set || !Object.keys(it.set).length) return;
  for (const k in it.set) App.rt.setPath(k, it.set[k]);
  toast(t('applied', it.value));
  changed();
  App.rerender();
}
let _dl = 0;
function control(def, io) {
  const k = def.kind;
  let el;
  const raw = io.raw();
  const shown =
    raw !== undefined && raw !== null && raw !== '' ? raw : io.dflt() !== undefined ? io.dflt() : '';
  const ph = tr(def.placeholder);
  if (k === 'number') {
    el = h('input', {
      type: 'number',
      value: shown,
      placeholder: ph,
      step: def.step || 1,
      min: def.min,
      max: def.max,
      'aria-label': tr(def.label),
    });
    el.addEventListener('input', () => {
      io.set(el.value === '' ? undefined : parseFloat(el.value));
      changed();
    });
  } else if (k === 'area') {
    el = h('textarea', { rows: def.rows || 3, placeholder: ph, 'aria-label': tr(def.label) });
    el.value = shown;
    el.addEventListener('input', () => {
      io.set(el.value);
      changed();
    });
  } else if (k === 'check') {
    const inp = h('input', { type: 'checkbox', checked: !!io.val(), 'aria-label': tr(def.label) });
    inp.addEventListener('change', () => {
      io.set(inp.checked);
      changed();
    });
    el = h('label.chk', inp, h('i'));
  } else if (k === 'select') {

    sc = rt.rowScope(L, row);

  let title = a.title ? String(ev(a.title)) : '';

  if (a.spend) {
    const cost = Formula.num(ev(a.spend.cost), true),
      res = a.spend.res;
    if (cost > 0) {
      if (rt.resCur(res) < cost) {
        if (a.overload) {
          const amt = Formula.num(ev(a.overload.amount), true) || 1;
          const ex = rt.stored(a.overload.field);
          if (ex + amt > (a.overload.max ?? 5)) {
            toast(t('overloadMax'));
            return;
          }
          if (!(await ask(t('overload', amt)))) return;
          rt.setVal(a.overload.field, ex + amt);
        } else {
          toast(String(res).toUpperCase() + ' < ' + cost);
          return;
        }
      } else rt.spend(res, cost);
    }
  }
  changed();
  App.refresh();
  if (a.roll)
    Roller.roll((a.spend ? '' : '') + title + ' — ' + tr(a.label), String(ev(a.roll)), { d20: a.d20 });

let _ro = null;
function masonry(grid) {
  if (_ro) _ro.disconnect();
  _ro = new ResizeObserver(entries => {
    for (const en of entries) {
      const blk = en.target.parentElement;
      const hgt = en.target.getBoundingClientRect().height;
      blk.style.gridRowEnd =
        'span ' +
        Math.ceil(
          (hgt + parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap') || 14) + 1) /
            4
        );
    }
  });
  [...grid.children].forEach(c => {
    const k = c.querySelector(':scope > .card, :scope > .xcard') || c.querySelector(':scope > button');
    if (k) _ro.observe(k);
  });
}
function buildTab(tab, forPrint) {
